[graph]
coordination = "sequential"
description = "Retrieve content → verify DAG integrity → check certificate chain."
id = "nest_verify"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]

[[graph.nodes]]
capabilities = [
    "storage",
    "content.get",
]
dependencies = []
depends_on = []
id = "retrieve_content"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "storage"
name = "retrieve_content"
primal = "nestgate"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "storage"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "storage"
by_name = "nestgate"

[[graph.nodes]]
capabilities = [
    "dag",
    "dag.verify",
]
dependencies = []
depends_on = ["retrieve_content"]
id = "verify_dag"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "dag"
name = "verify_dag"
primal = "rhizocrypt"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "dag"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "dag"
by_name = "rhizocrypt"

[[graph.nodes]]
capabilities = [
    "ledger",
    "certificate.verify",
]
dependencies = []
depends_on = ["verify_dag"]
id = "check_certificate"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "ledger"
name = "check_certificate"
primal = "loamspine"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "ledger"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "ledger"
by_name = "loamspine"
