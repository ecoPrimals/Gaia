[graph]
coordination = "sequential"
description = "Two-phase cold start: static Tower startup then graph-driven expansion. Resolves the bootstrap paradox."
id = "tower_bootstrap"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]

[[graph.nodes]]
capabilities = [
    "security",
    "crypto.identity",
    "btsp.handshake",
]
dependencies = []
depends_on = []
id = "beardog_identity"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "security"
name = "beardog_identity"
primal = "beardog"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "security"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "security"
by_name = "beardog"

[[graph.nodes]]
capabilities = [
    "discovery",
    "ipc.register",
    "discovery.announce",
]
dependencies = []
depends_on = ["beardog_identity"]
