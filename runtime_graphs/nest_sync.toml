[graph]
coordination = "sequential"
description = "Cross-spring provenance exchange: fetch braid subset from remote NestGate with trio continuity."
id = "nest_sync"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]
remote_gate = ""

[[graph.nodes]]
capabilities = [
    "dag",
    "dag.checkout_slice",
]
dependencies = []
depends_on = []
gate = "remote_gate"
id = "fetch_dag_slice"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "dag"
name = "fetch_dag_slice"
primal = "rhizocrypt"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "dag"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "dag"
by_name = "rhizocrypt"

[[graph.nodes]]
capabilities = [
    "dag",
    "dag.verify_proof",
]
dependencies = []
depends_on = ["fetch_dag_slice"]
id = "verify_proof"
