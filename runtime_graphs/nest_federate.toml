[graph]
coordination = "sequential"
description = "Push vertices with provenance → verify signatures → attribute cross-gate merge."
id = "nest_federate"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]

[[graph.nodes]]
capabilities = [
    "dag",
    "dag.federate",
]
dependencies = []
depends_on = []
id = "push_vertices"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "dag"
name = "push_vertices"
primal = "rhizocrypt"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "dag"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "dag"
by_name = "rhizocrypt"

[[graph.nodes]]
capabilities = [
    "ledger",
    "certificate.verify",
]
dependencies = []
depends_on = ["push_vertices"]
id = "verify_signatures"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "ledger"
name = "verify_signatures"
primal = "loamspine"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "ledger"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "ledger"
by_name = "loamspine"

[[graph.nodes]]
capabilities = [
    "commit",
    "braid.create",
]
dependencies = []
depends_on = ["verify_signatures"]
id = "attribute_merge"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "commit"
name = "attribute_merge"
primal = "sweetgrass"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "commit"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "commit"
by_name = "sweetgrass"
