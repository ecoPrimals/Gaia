[graph]
coordination = "sequential"
description = "Retrieve → braid → sign. Full pseudoSpore emit pipeline."
id = "nest_emit_spore"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]

[[graph.nodes]]
capabilities = [
    "storage",
    "storage.retrieve",
]
dependencies = []
depends_on = []
id = "retrieve_content"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "storage"
name = "retrieve_content"
primal = "nestgate"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "storage"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "storage"
by_name = "nestgate"

[[graph.nodes]]
capabilities = [
    "attribution",
    "braid.resolve",
]
dependencies = []
depends_on = ["retrieve_content"]
id = "resolve_braid"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "attribution"
name = "resolve_braid"
primal = "sweetgrass"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "attribution"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "attribution"
by_name = "sweetgrass"

[[graph.nodes]]
capabilities = [
    "security",
    "crypto.sign",
]
dependencies = []
depends_on = ["resolve_braid"]
id = "sign_emission"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "security"
name = "sign_emission"
primal = "beardog"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "security"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "security"
by_name = "beardog"
