[graph]
coordination = "sequential"
description = "Generate new key material → re-announce to mesh → audit rotation."
id = "tower_key_rotate"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]

[[graph.nodes]]
capabilities = [
    "security",
    "crypto.rotate_session_keys",
]
dependencies = []
depends_on = []
id = "rotate_keys"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "security"
name = "rotate_keys"
primal = "beardog"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "security"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "security"
by_name = "beardog"

[[graph.nodes]]
capabilities = [
    "discovery",
    "mesh.capabilities_announce",
]
dependencies = []
depends_on = ["rotate_keys"]
id = "announce_rotation"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "discovery"
name = "announce_rotation"
primal = "songbird"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "discovery"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "discovery"
by_name = "songbird"

[[graph.nodes]]
capabilities = [
    "defense",
    "defense.audit",
]
dependencies = []
depends_on = ["announce_rotation"]
id = "audit_rotation"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "defense"
name = "audit_rotation"
primal = "skunkbat"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "defense"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "defense"
by_name = "skunkbat"
