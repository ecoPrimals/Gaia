[graph]
coordination = "parallel"
description = "Parallel liveness check on bearDog + songbird + skunkBat."
id = "tower_health"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]

[[graph.nodes]]
capabilities = [
    "security",
    "health.liveness",
]
dependencies = []
depends_on = []
id = "beardog_health"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "security"
name = "beardog_health"
primal = "beardog"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "security"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "security"
by_name = "beardog"

[[graph.nodes]]
capabilities = [
    "discovery",
    "health.liveness",
]
dependencies = []
depends_on = []
