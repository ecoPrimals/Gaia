[graph]
coordination = "sequential"
description = "Validate → store → DAG → ledger → braid → sign. Full pseudoSpore ingest pipeline."
id = "nest_ingest_spore"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]

