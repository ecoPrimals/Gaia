[graph]
coordination = "sequential"
description = "Dehydrate → sign → store → commit → attribute. RootPulse temporal collapse."
id = "nest_commit"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]

