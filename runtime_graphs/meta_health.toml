[graph]
coordination = "parallel"
description = "Parallel liveness check on biomeOS + squirrel + petalTongue."
id = "meta_health"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]

[[graph.nodes]]
capabilities = [
    "orchestration",
    "health.liveness",
]
dependencies = []
depends_on = []
id = "biomeos_health"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "orchestration"
name = "biomeos_health"
primal = "biomeos"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "orchestration"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "orchestration"
by_name = "biomeos"

[[graph.nodes]]
capabilities = [
    "ai",
    "health.liveness",
]
