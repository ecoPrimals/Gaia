[graph]
coordination = "sequential"
description = "Session create → context push → graph list. Grounded observation for agentic planning."
id = "meta_observe"
version = "1.0.0"

[graph.config]
checkpoint_enabled = false
deterministic = true
max_parallelism = 3
parallel_phases = true
rollback_on_failure = true
timeout_total_ms = 60000

[graph.env]

[[graph.nodes]]
capabilities = [
    "visualization",
    "visualization.session.create",
]
dependencies = []
depends_on = []
id = "create_session"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "visualization"
name = "create_session"
primal = "petaltongue"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "visualization"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "visualization"
by_name = "petaltongue"

[[graph.nodes]]
capabilities = [
    "ai",
    "squirrel.context.push",
]
dependencies = []
depends_on = ["create_session"]
id = "push_context"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "ai"
name = "push_context"
primal = "squirrel"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "ai"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "ai"
by_name = "squirrel"

[[graph.nodes]]
capabilities = [
    "orchestration",
    "graph.list",
]
dependencies = []
depends_on = ["push_context"]
id = "list_graphs"
operation_dependencies = []
outputs = []

[graph.nodes.config]
capability = "orchestration"
name = "list_graphs"
primal = "biomeos"

[graph.nodes.operation]
name = "capability_call"

[graph.nodes.operation.params]
capability = "orchestration"

[graph.nodes.params]

[graph.nodes.primal]
by_capability = "orchestration"
by_name = "biomeos"
