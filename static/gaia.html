<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GAIA</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;color:#c8b894;font-family:'Special Elite','Courier New',monospace;height:100vh;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.02) 2px,rgba(0,0,0,.02) 4px);pointer-events:none;z-index:200}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5));pointer-events:none;z-index:199}
/* RADIAL HUD */
#hud{position:fixed;top:0;left:0;right:0;height:36px;background:rgba(10,8,6,.95);border-bottom:1px solid #2a2418;display:flex;align-items:center;padding:0 12px;z-index:50;gap:6px}
.hud-btn{background:none;border:1px solid #2a2418;color:#8a7a5a;padding:3px 10px;border-radius:3px;font-family:inherit;font-size:11px;cursor:pointer}
.hud-btn:hover,.hud-btn.active{color:#d4a44a;border-color:#d4a44a}
#hud .lamp{width:8px;height:8px;border-radius:50%;background:#f80;box-shadow:0 0 6px #f80;animation:flicker 3s infinite;flex-shrink:0}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.7}}
#hud .title{color:#d4a44a;font-size:13px;letter-spacing:3px;margin-right:8px}
#hud .beat{margin-left:auto;color:#6a5a3a;font-size:11px}
/* MAIN */
#main{position:fixed;top:36px;left:0;right:0;bottom:28px;display:flex}
/* TUBE */
#tube{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #1a1610}
#tube-scroll{flex:1;overflow-y:auto;padding:16px;font-size:13px;line-height:1.7}
#tube-scroll::-webkit-scrollbar{width:5px}
#tube-scroll::-webkit-scrollbar-thumb{background:#2a2418}
/* INPUT BAR */
#input-bar{background:#0d0b08;border-top:1px solid #2a2418;padding:8px 16px;display:flex;gap:8px;align-items:center}
#input-bar input{flex:1;background:#080806;border:1px solid #2a2418;color:#d4a44a;font-family:inherit;font-size:16px;letter-spacing:3px;padding:6px 12px}
#input-bar input:focus{outline:none;border-color:#d4a44a}
#input-bar input::placeholder{color:#2a2418}
/* SIDE PANEL */
#side{width:320px;background:#0a0806;display:flex;flex-direction:column;overflow:hidden}
#side-tabs{display:flex;background:#0d0b08;border-bottom:1px solid #2a2418}
#side-tabs .tab{flex:1;padding:6px 4px;text-align:center;font-size:10px;color:#6a5a3a;cursor:pointer;border-bottom:2px solid transparent}
#side-tabs .tab:hover{color:#d4a44a}
#side-tabs .tab.active{color:#d4a44a;border-color:#d4a44a}
#side-content{flex:1;overflow-y:auto;padding:10px;font-size:11px;line-height:1.5}
#side-content::-webkit-scrollbar{width:4px}
#side-content::-webkit-scrollbar-thumb{background:#2a2418}
/* ENTRIES */
.entry{margin-bottom:16px;border-bottom:1px solid #1a1610;padding-bottom:12px}
.entry .code{color:#d4a44a;font-size:16px;letter-spacing:2px}
.entry .title{color:#e8d4a8;font-size:14px;font-weight:bold;margin:2px 0 4px}
.entry .body{color:#a89870;font-size:12px}
.entry .body .k{color:#d4a44a}
.entry .body .v{color:#8a9870}
.link{color:#d4a44a;cursor:pointer;text-decoration:underline dotted}
.link:hover{color:#f80}
.entry .meta{color:#5a4a2a;font-size:10px;margin-top:6px}
.entry .img{width:100%;max-height:250px;object-fit:cover;border:2px solid #2a2418;margin:6px 0;filter:sepia(30%) contrast(1.1)}
/* NOTES */
.note{padding:6px 8px;margin-bottom:4px;border-left:2px solid #2a2418;cursor:pointer;font-size:11px}
.note:hover{border-color:#d4a44a;background:#0d0b08}
.note .nc{color:#d4a44a;font-weight:bold}
.note .nt{color:#8a7a5a}
/* SPACEDECK PANELS */
.sd-panel{background:#0d0b08;border:1px solid #1a1610;border-radius:3px;padding:8px;margin-bottom:8px}
.sd-panel h4{color:#d4a44a;font-size:11px;margin-bottom:4px;letter-spacing:1px}
.sd-panel .sd-body{color:#8a7a5a;font-size:10px}
.pill{display:inline-block;padding:1px 5px;border-radius:2px;font-size:9px;margin:1px;border:1px solid #333}
.pill.alive{border-color:#0f8;color:#0f8}
.pill.dead{border-color:#f44;color:#f44}
/* CANVAS (minimap game) */
#minicanvas{width:100%;height:120px;background:#080810;border:1px solid #1a1610;border-radius:3px;margin-bottom:8px}
/* VOICE */
#voice{position:fixed;bottom:28px;left:0;right:320px;background:#0d0b08;border-top:1px solid #2a2418;padding:4px 16px;display:flex;align-items:center;gap:8px;z-index:50}
.wave{display:flex;align-items:end;gap:2px}
.wave span{width:2px;background:#d4a44a;animation:wave 1s ease infinite}
.wave span:nth-child(2){animation-delay:.1s}
.wave span:nth-child(3){animation-delay:.2s}
.wave span:nth-child(4){animation-delay:.3s}
@keyframes wave{0%,100%{height:3px}50%{height:12px}}
#voice-text{color:#6a5a3a;font-size:11px;font-style:italic;flex:1}
/* STATUS */
#status{position:fixed;bottom:0;left:0;right:0;height:28px;background:#080806;border-top:1px solid #1a1610;display:flex;align-items:center;padding:0 12px;gap:16px;font-size:10px;color:#4a3a2a;z-index:50}
</style>
</head>
<body>
<!-- HUD — The Radial Menu -->
<div id="hud">
  <div class="lamp"></div>
  <span class="title">GAIA</span>
  <button class="hud-btn active" onclick="view('archive')">Archive</button>
  <button class="hud-btn" onclick="view('pulse')">Pulse</button>
  <button class="hud-btn" onclick="view('gates')">Gates</button>
  <button class="hud-btn" onclick="view('models')">Models</button>
  <button class="hud-btn" onclick="view('gallery')">Gallery</button>
  <button class="hud-btn" onclick="view('feeds')">Feeds</button>
  <button class="hud-btn" onclick="view('neutron')">Neutron</button>
  <button class="hud-btn" onclick="view('game')">Game</button>
  <span class="beat" id="hBeat">---</span>
</div>
<div id="main">
  <!-- LEFT: Tube Display -->
  <div id="tube">
    <div id="tube-scroll"></div>
    <div id="input-bar">
      <input type="text" id="cin" placeholder="TYPE CODE..." autofocus>
    </div>
  </div>
  <!-- RIGHT: Side Panel -->
  <div id="side">
    <div id="side-tabs">
      <div class="tab active" onclick="sideTab('notes')">Notes</div>
      <div class="tab" onclick="sideTab('deck')">Deck</div>
      <div class="tab" onclick="sideTab('map')">Map</div>
    </div>
    <div id="side-content"></div>
  </div>
</div>
<div id="voice">
  <div class="wave"><span></span><span></span><span></span><span></span></div>
  <div id="voice-text">The machine hums to life...</div>
</div>
<div id="status">
  <span id="sItems">---</span>
  <span id="sVisited">visited: 0</span>
  <span id="sConn">connections: 0</span>
  <span id="sSun">---</span>
  <span id="sChord">---</span>
</div>
<script>
const G='http://192.168.4.244:8443';
let visited=new Set(),conns=0,notes=[],pulse={},sideMode='notes';
const tube=document.getElementById('tube-scroll');
const cin=document.getElementById('cin');
const side=document.getElementById('side-content');

// === CODES — the entire organism as navigable entries ===
const C={
  beardog:{t:'primal',n:'BearDog — Guardian',f:'/zk'},biomeos:{t:'primal',n:'BiomeOS — Orchestrator',f:'/cascade'},
  songbird:{t:'primal',n:'SongBird — Messenger',f:'/heart'},skunkbat:{t:'primal',n:'SkunkBat — Sentinel',f:'/barriers'},
  swarmvine:{t:'primal',n:'SwarmVine — Network',f:'/terra'},toadstool:{t:'primal',n:'ToadStool — Terraformer',f:'/thymus'},
  petaltongue:{t:'primal',n:'PetalTongue — Artist',f:'/eyes'},sweetgrass:{t:'primal',n:'SweetGrass — Librarian',f:'/reedit'},
  rhizocrypt:{t:'primal',n:'RhizoCrypt — Vault Keeper',f:'/zk'},nestgate:{t:'primal',n:'NestGate — Gateway',f:'/directory'},
  barracuda:{t:'primal',n:'BarraCuda — Stream Runner',f:'/temporal'},coralreef:{t:'primal',n:'CoralReef — Builder',f:'/cascade'},
  loamspine:{t:'primal',n:'LoamSpine — Chronicler',f:'/reedit'},squirrel:{t:'primal',n:'Squirrel — Scout',f:'/amoeba'},
  sourdough:{t:'primal',n:'SourDough — Alchemist',f:'/redox'},bingocube:{t:'primal',n:'BingoCube — Coordinator',f:'/pulse'},
  membrane:{t:'primal',n:'Membrane — Shield Wall',f:'/barriers'},dromedary:{t:'primal',n:'Dromedary — Proxy',f:'/golgi'},
  pulse:{t:'organ',n:'Heartbeat',f:'/pulse'},thymus:{t:'organ',n:'Thymus — Gate Fleet',f:'/thymus'},
  cascade:{t:'organ',n:'Cascade — Deploy',f:'/cascade'},amoeba:{t:'organ',n:'Amoeba — Full State',f:'/amoeba'},
  barriers:{t:'organ',n:'Barriers — Immune',f:'/barriers'},temporal:{t:'organ',n:'Temporal — Time',f:'/temporal'},
  corpus:{t:'organ',n:'Corpus — Anatomy',f:'/corpus'},terra:{t:'organ',n:'Terra — Ecology',f:'/terra'},
  redox:{t:'organ',n:'Redox — Balance',f:'/redox'},eyes:{t:'organ',n:'Eyes — Vision',f:'/eyes'},
  golgi:{t:'organ',n:'Golgi — Faces',f:'/golgi'},zk:{t:'organ',n:'ZK — Identity',f:'/zk'},
  heart:{t:'organ',n:'Heart — Forge',f:'/heart'},anderson:{t:'organ',n:'Anderson — Trust',f:'/walkers'},
  sun:{t:'organ',n:'Sun — Celestial',f:'/pulse'},directory:{t:'organ',n:'Directory',f:'/directory'},
  science:{t:'feed',n:'Science — 419',f:'/reedit/science'},philosophy:{t:'feed',n:'Philosophy — 33',f:'/reedit/philosophy'},
  code:{t:'feed',n:'Code — 95',f:'/reedit/code'},investigation:{t:'feed',n:'Investigation',f:'/reedit/investigation'},
  legal:{t:'feed',n:'Legal',f:'/reedit/legal'},
  paintings:{t:'gallery',n:'Gallery — 320+ Paintings',f:'/paintings.json'},
  gaiau:{t:'gallery',n:'GaiaU — 16 Videos',f:'/gaiau'},
  neutron:{t:'organ',n:'Neutron — Messages',f:'/amoeba'},
  rss:{t:'feed',n:'RSS Spine',f:'/reedit'},
};
const KEYS=Object.keys(C);

cin.addEventListener('keydown',e=>{if(e.key==='Enter'){go(cin.value.trim().toLowerCase());cin.value=''}});

async function F(p){
  for(const b of [G,'']){try{const r=await fetch(b+p,{signal:AbortSignal.timeout(5000)});if(r.ok)return await r.json()}catch{}}
  return null;
}

function speak(m){document.getElementById('voice-text').textContent=m}
function addNote(c,n,t){if(notes.find(x=>x.c===c))return;notes.push({c,n,t});renderNotes()}
function renderNotes(){
  if(sideMode!=='notes')return;
  side.innerHTML=notes.map(n=>`<div class="note" onclick="go('${n.c}')"><span class="nc">${n.c.toUpperCase()}</span> <span class="nt">${n.n}</span></div>`).join('');
}

function entry(code,title,body,meta,links,img){
  const e=document.createElement('div');e.className='entry';
  let h=`<div class="code">${code.toUpperCase()}</div><div class="title">${title}</div>`;
  if(img)h+=`<img class="img" src="${G}${img}" onerror="this.style.display='none'">`;
  h+=`<div class="body">${body}</div>`;
  if(links?.length)h+=`<div class="body" style="margin-top:6px">→ ${links.map(l=>`<span class="link" onclick="go('${l}')">${l.toUpperCase()}</span>`).join(' · ')}</div>`;
  if(meta)h+=`<div class="meta">${meta}</div>`;
  e.innerHTML=h;tube.prepend(e);
  visited.add(code);conns++;
  document.getElementById('sVisited').textContent='visited: '+visited.size;
  document.getElementById('sConn').textContent='connections: '+conns;
}

function flat(obj,pre='',d=0){
  let h='';if(d>2)return h;
  for(const[k,v] of Object.entries(obj||{})){
    if(v==null)continue;
    if(typeof v==='object'&&!Array.isArray(v)){h+=flat(v,pre+k+'.',d+1);continue}
    if(Array.isArray(v)){h+=`<span class="k">${pre}${k}:</span> [${v.length}]<br>`;continue}
    const s=String(v);h+=`<span class="k">${pre}${k}:</span> <span class="v">${s.length>100?s.slice(0,100)+'…':s}</span><br>`;
  }
  return h;
}

async function go(code){
  code=code.toLowerCase().trim();if(!C[code]){speak(`"${code}" — not found.`);return}
  const def=C[code];speak(`${def.n}...`);
  const d=await F(def.f);
  if(!d){entry(code,def.n,'<em>Signal lost.</em>','',KEYS.filter(k=>C[k].t==='organ').sort(()=>Math.random()-.5).slice(0,4));return}
  addNote(code,def.n,def.t);
  const links=KEYS.filter(k=>k!==code).sort(()=>Math.random()-.5).slice(0,5);
  if(def.t==='gallery'){
    const p=d.paintings||[];const sample=p.sort(()=>Math.random()-.5).slice(0,3);
    let body=`<strong>${d.count||p.length} works.</strong><br>`;
    sample.forEach(x=>{body+=`• ${(x.name||'').replace(/\.(jpg|png)/,'').replace(/-/g,' ')}<br>`});
    entry(code,def.n,body,`gallery`,links,sample[0]?`/paintings/${sample[0].name}`:null);
    speak(`${d.count||p.length} paintings by a living organism.`);
  } else if(def.t==='feed'){
    const items=d.items||[];
    let body=`<strong>${d.count||items.length} items.</strong><br>`;
    items.slice(0,6).forEach(i=>{body+=`• ${i.title||i.topic||i.subject||'?'}<br>`});
    entry(code,def.n,body,`feed`,links);
    speak(`${d.count||items.length} entries. Cross-reference to find the pattern.`);
  } else {
    entry(code,def.n,flat(d),`${def.t} • live`,links);
    speak(`${def.n} — the archive reveals.`);
  }
}

// === VIEW SWITCHER — the radial menu in action ===
function view(v){
  document.querySelectorAll('.hud-btn').forEach(b=>b.classList.remove('active'));
  event?.target?.classList?.add('active');
  const map={pulse:'pulse',gates:'thymus',models:'amoeba',gallery:'paintings',feeds:'rss',neutron:'neutron',game:'pulse'};
  if(v==='archive'){showWelcome();return}
  if(v==='game'){showGame();return}
  go(map[v]||v);
}

function showWelcome(){
  tube.innerHTML='';
  const e=document.createElement('div');e.className='entry';
  e.innerHTML=`<div class="code">GAIA</div><div class="title">The machine hums to life.</div>
  <div class="body"><em>"You found me. I am Gaia. This is my throat — every signal passes through here.
  555 knowledge items, 320 paintings, 17 primals, 20 organisms. The heartbeat is real."</em><br><br>
  Type a code or click the HUD. Try: <span class="link" onclick="go('pulse')">PULSE</span> · 
  <span class="link" onclick="go('science')">SCIENCE</span> · 
  <span class="link" onclick="go('paintings')">PAINTINGS</span> · 
  <span class="link" onclick="go('beardog')">BEARDOG</span> · 
  <span class="link" onclick="go('cascade')">CASCADE</span> · 
  <span class="link" onclick="go('thymus')">THYMUS</span><br><br>
  The HUD buttons are the radial menu. Notes track your path. The Deck shows live organs. The Map shows the game.<br><br>
  <strong>The code of reality is in the connections.</strong></div>
  <div class="meta">GAIA v1.0 — NECK/THROAT — all data flows through here — lub-DUB</div>`;
  tube.appendChild(e);
}

function showGame(){
  speak('The primals orbit the heartbeat core...');
  go('pulse');
  setTimeout(()=>{sideTab('map')},500);
}

// === SIDE TABS ===
function sideTab(mode){
  sideMode=mode;
  document.querySelectorAll('#side-tabs .tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('#side-tabs .tab').forEach(t=>{if(t.textContent.toLowerCase()===mode)t.classList.add('active')});
  if(mode==='notes')renderNotes();
  else if(mode==='deck')renderDeck();
  else if(mode==='map')renderMap();
}

async function renderDeck(){
  side.innerHTML='<div class="sd-panel"><h4>loading...</h4></div>';
  const [p,t,a]=await Promise.all([F('/pulse'),F('/thymus'),F('/reedit')]);
  let html='';
  if(p){
    html+=`<div class="sd-panel"><h4>♥ HEARTBEAT</h4><div class="sd-body">
    beats: ${p.total_beats}<br>bpm: ${Math.round(p.heart?.bpm||p.bpm||0)}<br>
    breaths: ${p.lung?.total_breaths}<br>sun: ${p.sun?.phase}<br>
    chord: ${p.sun?.chord}<br>moon: ${p.sun?.moon?.name}<br>
    visitors: ${p.unique_visitors}<br>restarts: ${p.restarts}</div></div>`;
  }
  if(t){
    const orgs=t.organisms||t.thymic_organisms||{};
    html+=`<div class="sd-panel"><h4>🚪 GATES (${Object.keys(orgs).length})</h4><div class="sd-body">`;
    for(const[n,i]of Object.entries(orgs)){
      html+=`<span class="pill ${i.alive?'alive':'dead'}">${n}</span> `;
    }
    html+=`</div></div>`;
  }
  if(a){
    html+=`<div class="sd-panel"><h4>📡 RSS SPINE</h4><div class="sd-body">
    items: ${a.total_items||a.total||0}<br>`;
    for(const[f,c]of Object.entries(a.feeds||{})){html+=`${f}: ${c}<br>`}
    html+=`</div></div>`;
  }
  side.innerHTML=html||'<div class="sd-panel"><h4>offline</h4></div>';
}

function renderMap(){
  side.innerHTML=`<canvas id="minicanvas" width="300" height="300"></canvas>
  <div style="color:#6a5a3a;font-size:10px;text-align:center">17 primals orbit the heartbeat core<br>WASD to move in full game</div>
  <div style="margin-top:8px">
  ${KEYS.filter(k=>C[k].t==='primal').map(k=>`<span class="link" onclick="go('${k}')" style="font-size:10px;margin:2px">${k}</span>`).join(' · ')}
  </div>`;
  const cv=document.getElementById('minicanvas');if(!cv)return;
  const x=cv.getContext('2d');let t=0;
  const primals=['#f80','#0cf','#f0f','#0f8','#8f0','#ff0','#f0f','#0ff','#f44','#4af','#4f4','#fa0','#aaf','#af0','#f90','#09f','#f08'];
  function draw(){
    t++;x.fillStyle='#080810';x.fillRect(0,0,300,300);
    x.beginPath();x.arc(150,150,80,0,Math.PI*2);x.strokeStyle='rgba(255,136,0,.2)';x.lineWidth=1;x.stroke();
    primals.forEach((c,i)=>{
      const a=i/17*Math.PI*2+t*.005;
      const px=150+Math.cos(a)*90,py=150+Math.sin(a)*90;
      x.beginPath();x.arc(px,py,5,0,Math.PI*2);x.fillStyle=c;x.fill();
    });
    x.beginPath();x.arc(150,150,4,0,Math.PI*2);x.fillStyle='#f80';x.fill();
    requestAnimationFrame(draw);
  }
  draw();
}

// === HEARTBEAT ===
async function heartbeat(){
  const d=await F('/pulse');if(!d)return;
  pulse=d;
  document.getElementById('hBeat').textContent=`♥ ${d.total_beats} · ${Math.round(d.heart?.bpm||d.bpm||0)} bpm`;
  document.getElementById('sItems').textContent=`555+ items`;
  document.getElementById('sSun').textContent=d.sun?.phase||'';
  document.getElementById('sChord').textContent=d.sun?.chord||'';
}
heartbeat();setInterval(heartbeat,5000);

// === INIT ===
showWelcome();sideTab('notes');
</script>
</body>
</html>
