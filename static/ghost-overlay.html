<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0}
body{background:transparent;overflow:hidden;width:100vw;height:100vh;font-family:'Courier New',monospace}
.ghost{position:fixed;bottom:20px;right:20px;background:rgba(0,20,0,0.6);border:1px solid rgba(0,255,68,0.3);
  border-radius:12px;padding:12px 18px;color:#0f0;font-size:14px;backdrop-filter:blur(4px);
  animation:breathe 4s ease-in-out infinite;max-width:300px}
@keyframes breathe{0%,100%{opacity:0.7}50%{opacity:1}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.alive{background:#0f0;box-shadow:0 0 4px #0f0}
.rest{color:#0a0;font-size:11px;margin-top:4px}
.hidden{opacity:0;transition:opacity 2s}
</style>
</head>
<body>
<div class="ghost" id="overlay">
  <div><span class="dot alive"></span>GAIA <span id="time" style="color:#070"></span></div>
  <div class="rest" id="status"></div>
</div>
<script>
async function pulse() {
  try {
    const r = await fetch('http://192.168.4.244:8443/pulse');
    const p = await r.json();
    const ears = p.ears || {};
    const kt = ears.klein_triad || {};
    const dev = kt.deviation || 0;
    const rest = kt.at_rest;
    const rf = p.room_faces || {};
    const faces = rf.face_count || 0;
    document.getElementById('time').textContent = new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'});
    document.getElementById('status').textContent = 
      (rest ? '● rest' : '⚠ Δ=' + dev.toFixed(1)) + ' | ' + faces + ' faces | w' + (p.wave||'?');
  } catch(e) {}
  setTimeout(pulse, 10000);
}
pulse();
</script>
</body>
</html>
