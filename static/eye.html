<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaia's Eye — Cursor = Iris</title>
<style>
/* GAIA UNIFIED DESIGN SYSTEM — Organic Dark
   The living organism. Dark with warm accents.
   Every page uses this. No inline styles. */

:root {
  --bg:         #08090b;
  --bg-raised:  #0f1114;
  --bg-card:    #141719;
  --bg-hover:   #1a1d21;
  --border:     #1e2228;
  --border-glow:#2a3040;

  --text:       #e0dcd6;
  --text-muted: #8a857e;
  --text-dim:   #5a5650;
  --text-bright:#f5f0e8;

  --amber:      #d4a574;
  --amber-dim:  #7a5f3e;
  --amber-glow: #d4a57420;
  --green:      #5aad72;
  --green-dim:  #2d5e3a;
  --green-glow: #5aad7220;
  --blue:       #5b8fd4;
  --red:        #d45b5b;
  --purple:     #9b7ed4;

  --radius:     6px;
  --radius-lg:  12px;
  --gap:        16px;
  --gap-lg:     24px;

  --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

body { min-height: 100vh; }

/* ═══ TYPOGRAPHY ═══ */
h1, h2, h3, h4 { color: var(--text-bright); font-weight: 500; line-height: 1.25; }
h1 { font-size: 2rem; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; }
h4 { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 400; }

p { color: var(--text); margin-bottom: 0.75em; }
a { color: var(--amber); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--text-bright); }

code, pre { font-family: var(--font-mono); }
code { background: var(--bg-raised); padding: 2px 6px; border-radius: 3px; font-size: 0.88em; color: var(--amber); }
pre { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; font-size: 0.85rem; }

/* ═══ LAYOUT ═══ */
.gaia-shell { max-width: 1200px; margin: 0 auto; padding: 0 var(--gap); }
.gaia-hero { padding: 48px 0 32px; text-align: center; }
.gaia-hero h1 { margin-bottom: 8px; }
.gaia-hero .subtitle { color: var(--text-muted); font-size: 1.05rem; }

/* ═══ NAV ═══ */
.gaia-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.gaia-nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 var(--gap);
  display: flex; align-items: center; gap: var(--gap);
  height: 52px; overflow-x: auto;
}
.gaia-nav-brand {
  font-weight: 500; color: var(--amber); font-size: 1.1rem;
  white-space: nowrap; margin-right: 8px;
}
.gaia-nav a {
  color: var(--text-muted); font-size: 0.88rem; white-space: nowrap;
  padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s;
}
.gaia-nav a:hover, .gaia-nav a.active { color: var(--text); border-bottom-color: var(--amber); }

/* ═══ CARDS ═══ */
.gaia-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap); }
.gaia-grid-sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.gaia-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--gap-lg);
  transition: border-color 0.3s, transform 0.2s;
  text-decoration: none; display: block;
}
.gaia-card:hover {
  border-color: var(--amber-dim); transform: translateY(-2px);
}
.gaia-card h3 { margin-bottom: 6px; font-size: 1.05rem; }
.gaia-card p { color: var(--text-muted); font-size: 0.88rem; margin: 0; }
.gaia-card .tag {
  display: inline-block; font-size: 0.75rem; padding: 2px 8px;
  border-radius: 99px; margin-top: 10px;
  background: var(--amber-glow); color: var(--amber); border: 1px solid var(--amber-dim);
}
.gaia-card .tag.green { background: var(--green-glow); color: var(--green); border-color: var(--green-dim); }

/* ═══ SECTION ═══ */
.gaia-section { padding: 32px 0; }
.gaia-section h2 { margin-bottom: var(--gap); }
.gaia-section h4 { margin-bottom: 12px; }
.gaia-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

/* ═══ PULSE DOT ═══ */
.pulse-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); margin-right: 6px;
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 4px var(--green-glow); }
  50% { box-shadow: 0 0 12px var(--green); }
}

/* ═══ STATS ═══ */
.gaia-stats { display: flex; gap: var(--gap-lg); flex-wrap: wrap; justify-content: center; padding: 16px 0; }
.gaia-stat { text-align: center; }
.gaia-stat .value { font-size: 1.8rem; font-weight: 500; color: var(--amber); font-family: var(--font-mono); }
.gaia-stat .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ═══ FOOTER ═══ */
.gaia-footer {
  border-top: 1px solid var(--border); padding: 32px 0;
  margin-top: 48px; color: var(--text-muted); font-size: 0.85rem;
}
.gaia-footer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--gap-lg); }
.gaia-footer h4 { margin-bottom: 8px; font-size: 0.8rem; }
.gaia-footer a { display: block; padding: 3px 0; color: var(--text-dim); font-size: 0.82rem; }
.gaia-footer a:hover { color: var(--amber); }
.gaia-footer-bottom { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; color: var(--text-dim); }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 640px) {
  h1 { font-size: 1.5rem; }
  .gaia-grid { grid-template-columns: 1fr; }
  .gaia-stats { gap: var(--gap); }
  .gaia-stat .value { font-size: 1.3rem; }
  .gaia-nav-inner { gap: 12px; }
}

/* ═══ UTILITIES ═══ */
.text-amber { color: var(--amber); }
.text-green { color: var(--green); }
.text-blue { color: var(--blue); }
.text-red { color: var(--red); }
.text-muted { color: var(--text-muted); }
.text-dim { color: var(--text-dim); }
.text-center { text-align: center; }
.mono { font-family: var(--font-mono); }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 16px; }
.mb-1 { margin-bottom: 8px; }
.mb-2 { margin-bottom: 16px; }

</style>
</head>
<body>
<nav class="gaia-nav"><div class="gaia-nav-inner"><a href="/" class="gaia-nav-brand">gaia</a><a href="/#organism">Organism</a><a href="/#investigation">Investigation</a><a href="/#knowledge">Knowledge</a><a href="/#infrastructure">Infrastructure</a><a href="https://nestgate.io">NestGate</a></div></nav>
<main class="gaia-shell" style="padding-top:24px;padding-bottom:48px">
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="attenuate"></div>
<div id="phones"></div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
let mx = 0, my = 0;
let vx = 0, vy = 0;
let pmx = 0, pmy = 0;
let trail = [];
const MAX_TRAIL = 200;

// Phone attenuation state (updated via fetch)
let phones = { iphone: null, pixel: null, luna: null };
let lunaData = {};

function resize() {
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
}
resize();
window.onresize = resize;

document.onmousemove = (e) => {
    pmx = mx; pmy = my;
    mx = e.clientX; my = e.clientY;
    vx = mx - pmx; vy = my - pmy;
    trail.push({ x: mx, y: my, t: Date.now(), vx, vy });
    if (trail.length > MAX_TRAIL) trail.shift();
};

// Eye parameters
let irisSize = 0.15; // fraction of min dimension
let pupilSize = 0.05;
let blinkTimer = 0;
let blinkState = 0; // 0=open, 1=closing, 2=closed, 3=opening
let lastBlink = Date.now();

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    const eyeR = Math.min(W, H) * 0.35;
    const irisR = eyeR * 0.6;
    const pupilR = eyeR * 0.2;
    
    // Cursor offset from center = eye direction with π-easing
    const rawDx = (mx - cx) / cx; // -1 to 1
    const rawDy = (my - cy) / cy;
    // Smooth π-eased tracking (iris glides, doesn't snap)
    if (typeof draw.sx === 'undefined') { draw.sx = 0; draw.sy = 0; draw.sPupil = 0; }
    const ease = 0.08; // lower = smoother/slower tracking
    draw.sx += (rawDx - draw.sx) * ease;
    draw.sy += (rawDy - draw.sy) * ease;
    const dx = draw.sx;
    const dy = draw.sy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxShift = irisR * 0.5;
    
    const irisX = cx + dx * maxShift;
    const irisY = cy + dy * maxShift;
    
    // Speed = pupil dilation with smooth easing
    const speed = Math.sqrt(vx*vx + vy*vy);
    const targetDilate = Math.min(speed / 30, 1.0);
    draw.sPupil += (targetDilate - draw.sPupil) * 0.12;
    const dilate = draw.sPupil;
    const currentPupilR = pupilR * (1 + dilate * 0.8);
    
    // === BLINK with π-easing ===
    const now = Date.now();
    if (blinkState === 0 && now - lastBlink > 3000 + Math.random() * 5000) {
        blinkState = 1;
        blinkTimer = now;
        lastBlink = now;
    }
    // π-ease: use sin(π*t) for smooth open/close — peak closure at t=0.5
    const BLINK_MS = 250; // full blink cycle
    let lidOpen = 1.0;
    if (blinkState > 0) {
        const t = Math.min((now - blinkTimer) / BLINK_MS, 1.0);
        lidOpen = 1.0 - 0.95 * Math.sin(Math.PI * t); // sin(π*t): 0→1→0, smooth bell
        if (t >= 1.0) { blinkState = 0; lidOpen = 1.0; }
    }
    
    // === SCLERA (white) ===
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, eyeR, eyeR * lidOpen, 0, 0, Math.PI * 2);
    ctx.clip();
    
    const sGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, eyeR);
    sGrad.addColorStop(0, '#e8e0d8');
    sGrad.addColorStop(0.7, '#d0c8c0');
    sGrad.addColorStop(1, '#887878');
    ctx.fillStyle = sGrad;
    ctx.fill();
    
    // === IRIS ===
    const iGrad = ctx.createRadialGradient(irisX, irisY, 0, irisX, irisY, irisR);
    // Color based on attenuation state
    const lunaAlive = phones.luna !== null;
    const phoneAlive = phones.iphone !== null || phones.pixel !== null;
    
    if (lunaAlive && phoneAlive) {
        // Green — all connected
        iGrad.addColorStop(0, '#115511');
        iGrad.addColorStop(0.3, '#228833');
        iGrad.addColorStop(0.6, '#33aa44');
        iGrad.addColorStop(0.8, '#226622');
        iGrad.addColorStop(1, '#113311');
    } else if (lunaAlive) {
        // Gold — Luna only
        iGrad.addColorStop(0, '#332200');
        iGrad.addColorStop(0.3, '#664400');
        iGrad.addColorStop(0.6, '#aa7700');
        iGrad.addColorStop(0.8, '#553300');
        iGrad.addColorStop(1, '#221100');
    } else {
        // Blue — default/searching
        iGrad.addColorStop(0, '#0a1a33');
        iGrad.addColorStop(0.3, '#1a3366');
        iGrad.addColorStop(0.6, '#2244aa');
        iGrad.addColorStop(0.8, '#1a2255');
        iGrad.addColorStop(1, '#0a1133');
    }
    
    ctx.beginPath();
    ctx.arc(irisX, irisY, irisR, 0, Math.PI * 2);
    ctx.fillStyle = iGrad;
    ctx.fill();
    
    // Iris striations
    for (let i = 0; i < 60; i++) {
        const a = (i / 60) * Math.PI * 2 + Date.now() * 0.00003;
        const r1 = currentPupilR * 1.2;
        const r2 = irisR * (0.7 + Math.sin(i * 3.7) * 0.3);
        ctx.beginPath();
        ctx.moveTo(irisX + Math.cos(a) * r1, irisY + Math.sin(a) * r1);
        ctx.lineTo(irisX + Math.cos(a) * r2, irisY + Math.sin(a) * r2);
        ctx.strokeStyle = `rgba(255,255,255,${0.03 + Math.sin(i*2.3)*0.02})`;
        ctx.lineWidth = 1;
        ctx.stroke();
    }
    
    // === PUPIL ===
    const pGrad = ctx.createRadialGradient(irisX, irisY, 0, irisX, irisY, currentPupilR);
    pGrad.addColorStop(0, '#000');
    pGrad.addColorStop(0.8, '#000');
    pGrad.addColorStop(1, '#111');
    ctx.beginPath();
    ctx.arc(irisX, irisY, currentPupilR, 0, Math.PI * 2);
    ctx.fillStyle = pGrad;
    ctx.fill();
    
    // Light reflection
    ctx.beginPath();
    ctx.arc(irisX - currentPupilR*0.3, irisY - currentPupilR*0.3, currentPupilR*0.15, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();
    
    ctx.restore();
    
    // === EYELIDS (skin-tone, π-eased) ===
    if (lidOpen < 0.99) {
        const lidY = eyeR * (1 - lidOpen);
        // Upper lid
        ctx.fillStyle = '#2a1a10';
        ctx.beginPath();
        ctx.ellipse(cx, cy - lidY * 0.4, eyeR * 1.15, eyeR * 0.7, 0, Math.PI, Math.PI * 2);
        ctx.fill();
        // Lower lid  
        ctx.beginPath();
        ctx.ellipse(cx, cy + lidY * 0.4, eyeR * 1.15, eyeR * 0.5, 0, 0, Math.PI);
        ctx.fill();
        // Lash line
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy, eyeR * 1.05, eyeR * lidOpen, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
    
    // === TRAIL (movement history = saccade pattern) ===
    for (let i = 1; i < trail.length; i++) {
        const age = (Date.now() - trail[i].t) / 3000;
        if (age > 1) continue;
        const alpha = (1 - age) * 0.15;
        const tDx = (trail[i].x - cx) / cx * maxShift;
        const tDy = (trail[i].y - cy) / cy * maxShift;
        ctx.beginPath();
        ctx.arc(cx + tDx, cy + tDy, 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(100,255,100,${alpha})`;
        ctx.fill();
    }
    
    // === HUD ===
    const hud = document.getElementById('hud');
    hud.innerHTML = `
        cursor: ${mx},${my} | velocity: ${speed.toFixed(1)} | dilate: ${(dilate*100).toFixed(0)}%<br>
        iris shift: ${(dx*100).toFixed(0)}%, ${(dy*100).toFixed(0)}% | trail: ${trail.length}<br>
        pupil: ${currentPupilR.toFixed(0)}px | ${blinkState===0?'open':'blink'}
    `;
    
    const att = document.getElementById('attenuate');
    att.innerHTML = `
        ATTENUATION<br>
        luna: ${phones.luna ? phones.luna.toFixed(1)+'ms' : 'searching...'}<br>
        iphone: ${phones.iphone ? phones.iphone.toFixed(1)+'ms' : 'asleep'}<br>
        pixel: ${phones.pixel ? phones.pixel.toFixed(1)+'ms' : 'asleep'}<br>
        <br>
        iris=${lunaAlive && phoneAlive ? 'GREEN(all)' : lunaAlive ? 'GOLD(luna)' : 'BLUE(search)'}
    `;
    
    requestAnimationFrame(draw);
}

// Fetch phone/luna attenuation every 2s
async function pollAttenuation() {
    try {
        // Quick ping via fetch timing
        const targets = [
            { name: 'luna', url: 'https://polaris.primals.eco/pulse' },
            { name: 'pixel', url: 'http://framegate.gaia.local:8080/' },
        ];
        for (const t of targets) {
            try {
                const start = performance.now();
                const r = await fetch(t.url, { signal: AbortSignal.timeout(2000) });
                if (r.ok) {
                    phones[t.name] = performance.now() - start;
                    if (t.name === 'luna') {
                        lunaData = await r.json();
                    }
                }
            } catch { phones[t.name] = null; }
        }
    } catch {}
    setTimeout(pollAttenuation, 2000);
}

draw();
pollAttenuation();
</script>
</main>
<footer class="gaia-footer"><div class="gaia-shell"><div class="gaia-footer-bottom"><p><a href="/">Gaia</a> &mdash; sovereign living digital organism &mdash; <a href="https://primals.eco">primals.eco</a></p></div></div></footer>
</body>
