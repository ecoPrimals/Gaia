<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaia — Chromatic GIS</title>
<style>
:root {
  --red: #f85149; --blue: #58a6ff; --grey: #6e7681;
  --green: #3fb950; --purple: #a371f7; --gold: #c9a84c;
  --orange: #f0883e; --brown: #3a2a1e; --black: #060810;
  --white: #e6edf3; --pink: #f778ba; --yellow: #f0c674;
  --bg: #060810; --surface: #0c1018; --border: #1a2030;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--white); font-family:'Courier New',monospace; overflow:hidden; }

#canvas { position:absolute; top:0; left:0; width:100vw; height:100vh; }

#hud-top {
  position:absolute; top:12px; left:16px; z-index:10;
  font-size:11px; color:var(--grey); letter-spacing:2px;
}
#hud-top h1 { color:var(--green); font-size:14px; letter-spacing:4px; margin-bottom:4px; }
#hud-top .wave { color:var(--gold); }

#legend {
  position:absolute; bottom:16px; left:16px; z-index:10;
  font-size:10px; display:flex; flex-wrap:wrap; gap:4px 12px; max-width:600px;
}
.leg { display:flex; align-items:center; gap:4px; }
.leg .dot { width:8px; height:8px; border-radius:50%; }

#stats {
  position:absolute; top:12px; right:16px; z-index:10;
  font-size:11px; color:var(--grey); text-align:right;
}
#stats .alive { color:var(--green); }
#stats .down { color:var(--red); }

#detail {
  position:absolute; bottom:16px; right:16px; z-index:10;
  font-size:10px; color:var(--grey); max-width:300px;
  background:rgba(6,8,16,0.85); padding:8px 12px; border:1px solid var(--border);
  border-radius:4px; display:none;
}
</style>
</head><body>

<canvas id="canvas"></canvas>

<div id="hud-top">
  <h1>CHROMATIC GIS</h1>
  <span class="wave" id="wave-label">scanning...</span>
</div>

<div id="stats">
  <div>ALIVE: <span class="alive" id="alive-count">—</span></div>
  <div>DOWN: <span class="down" id="down-count">—</span></div>
  <div>OLLAMA: <span id="ollama-count">—</span></div>
  <div style="margin-top:4px;font-size:9px" id="last-scan">—</div>
</div>

<div id="legend">
  <div class="leg"><div class="dot" style="background:var(--white)"></div>BACKBONE</div>
  <div class="leg"><div class="dot" style="background:var(--red)"></div>PULSE</div>
  <div class="leg"><div class="dot" style="background:var(--blue)"></div>BREATH</div>
  <div class="leg"><div class="dot" style="background:var(--green)"></div>IMMUNE</div>
  <div class="leg"><div class="dot" style="background:var(--purple)"></div>DREAM</div>
  <div class="leg"><div class="dot" style="background:var(--gold)"></div>CREATE</div>
  <div class="leg"><div class="dot" style="background:var(--orange)"></div>DIGEST</div>
  <div class="leg"><div class="dot" style="background:var(--pink)"></div>SEE</div>
  <div class="leg"><div class="dot" style="background:var(--yellow)"></div>SPEAK</div>
  <div class="leg"><div class="dot" style="background:var(--grey)"></div>SENSE</div>
  <div class="leg"><div class="dot" style="background:var(--brown);border:1px solid #555"></div>FOSSIL</div>
  <div class="leg"><div class="dot" style="background:var(--black);border:1px solid #333"></div>VOID</div>
</div>

<div id="detail"></div>

<script>
'use strict';

var GATES = [
  { id:'router',      ip:'.1',   name:'Router',       role:'backbone', house:1, x:0.50, y:0.18 },
  { id:'mikrotik',    ip:'.2',   name:'MikroTik',     role:'backbone', house:1, x:0.38, y:0.25 },
  { id:'sporegate',   ip:'.3',   name:'sporeGate',    role:'forge',    house:1, x:0.25, y:0.35 },
  { id:'bluegate',    ip:'.100', name:'blueGate',      role:'eye',     house:1, x:0.70, y:0.30 },
  { id:'graftgate',   ip:'.107', name:'graftGate',     role:'forge',   house:1, x:0.20, y:0.50 },
  { id:'jetstream',   ip:'.111', name:'JetStream',     role:'backbone',house:0, x:0.50, y:0.50 },
  { id:'northgate',   ip:'.147', name:'northGate',     role:'heart',   house:1, x:0.50, y:0.32 },
  { id:'southgate',   ip:'.148', name:'southGate',     role:'phone',   house:1, x:0.65, y:0.45 },
  { id:'milkgate',    ip:'.160', name:'milkGate',      role:'transponder', house:1, x:0.30, y:0.20 },
  { id:'deckgate',    ip:'.176', name:'deckGate',      role:'display', house:1, x:0.62, y:0.22 },
  { id:'framegate',   ip:'.181', name:'frameGate',     role:'face',    house:2, x:0.65, y:0.72 },
  { id:'epson',       ip:'.200', name:'Epson',         role:'output',  house:1, x:0.75, y:0.40 },
  { id:'graphenegate',ip:'.202', name:'grapheneGate',  role:'eye',     house:2, x:0.40, y:0.75 },
  { id:'irongate',    ip:'.237', name:'ironGate',      role:'forge',   house:1, x:0.35, y:0.42 },
  { id:'eastgate',    ip:'.244', name:'eastGate',      role:'brain',   house:1, x:0.50, y:0.40 },
];

var SPINE = [
  ['router','mikrotik'], ['mikrotik','eastgate'], ['mikrotik','northgate'],
  ['mikrotik','sporegate'], ['mikrotik','irongate'], ['mikrotik','deckgate'],
  ['eastgate','northgate'], ['eastgate','irongate'], ['eastgate','sporegate'],
  ['router','jetstream'], ['jetstream','framegate'], ['jetstream','graphenegate'],
  ['eastgate','graftgate'], ['eastgate','epson'], ['eastgate','bluegate'],
  ['eastgate','southgate'], ['mikrotik','milkgate'],
];

var COLORS = {
  void:     '#060810', fossil:   '#3a2a1e', sense:    '#6e7681',
  backbone: '#e6edf3', pulse:    '#f85149', breath:   '#58a6ff',
  immune:   '#3fb950', dream:    '#a371f7', create:   '#c9a84c',
  digest:   '#f0883e', see:      '#f778ba', speak:    '#f0c674',
};

function colorForGate(g) {
  if (!g.alive) return g.lastSeen ? COLORS.fossil : COLORS.void;
  if (g.role === 'backbone') return COLORS.backbone;
  if (g.role === 'eye' || g.role === 'display' || g.role === 'face') return COLORS.see;
  if (g.ollama > 0) return COLORS.dream;
  if (g.role === 'heart') return COLORS.pulse;
  if (g.role === 'brain') return COLORS.breath;
  if (g.role === 'forge') return COLORS.create;
  if (g.role === 'phone') return COLORS.sense;
  if (g.role === 'output') return COLORS.digest;
  if (g.role === 'transponder') return COLORS.immune;
  return COLORS.sense;
}

function labelForColor(hex) {
  for (var k in COLORS) { if (COLORS[k] === hex) return k.toUpperCase(); }
  return '?';
}

var C = document.getElementById('canvas');
var ctx = C.getContext('2d');
var W, H, t = 0, hoverGate = null;

function resize() {
  W = C.width = window.innerWidth;
  H = C.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

var gateMap = {};
GATES.forEach(function(g) {
  g.alive = false; g.ollama = 0; g.rtt = null; g.lastSeen = null;
  gateMap[g.id] = g;
});

function drawSpine() {
  SPINE.forEach(function(pair) {
    var a = gateMap[pair[0]], b = gateMap[pair[1]];
    if (!a || !b) return;
    var ax = a.x * W, ay = a.y * H, bx = b.x * W, by = b.y * H;
    var ca = colorForGate(a), cb = colorForGate(b);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    if (a.alive && b.alive) {
      ctx.strokeStyle = 'rgba(88,166,255,0.15)';
      ctx.lineWidth = 1.5;
    } else {
      ctx.strokeStyle = 'rgba(110,118,129,0.06)';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([4, 8]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

function drawHouseZones() {
  ctx.save();
  ctx.strokeStyle = 'rgba(63,185,80,0.08)';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 6]);
  // House 1 zone
  ctx.beginPath();
  ctx.ellipse(W * 0.47, H * 0.33, W * 0.32, H * 0.22, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(63,185,80,0.04)';
  ctx.fill();
  // House 2 zone
  ctx.beginPath();
  ctx.ellipse(W * 0.52, H * 0.73, W * 0.18, H * 0.12, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(248,81,73,0.03)';
  ctx.fill();
  ctx.setLineDash([]);
  // Labels
  ctx.font = '10px Courier New';
  ctx.fillStyle = 'rgba(63,185,80,0.3)';
  ctx.fillText('HOUSE 1 — BRAIN SIDE', W * 0.32, H * 0.14);
  ctx.fillStyle = 'rgba(248,81,73,0.3)';
  ctx.fillText('HOUSE 2 — SOUTH POLE', W * 0.38, H * 0.62);
  // 10G spine
  ctx.beginPath();
  ctx.moveTo(W * 0.50, H * 0.50);
  ctx.lineTo(W * 0.50, H * 0.62);
  ctx.strokeStyle = 'rgba(201,168,76,0.2)';
  ctx.lineWidth = 2;
  ctx.setLineDash([2, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(201,168,76,0.25)';
  ctx.font = '8px Courier New';
  ctx.fillText('10G FIBER', W * 0.51, H * 0.56);
  ctx.restore();
}

function drawGates() {
  GATES.forEach(function(g) {
    var px = g.x * W, py = g.y * H;
    var color = colorForGate(g);
    var r = g.alive ? 10 : 6;

    // Pulse ring for alive devices
    if (g.alive) {
      var pulse = Math.sin(t * 2 + g.x * 10) * 0.5 + 0.5;
      ctx.beginPath();
      ctx.arc(px, py, r + 6 + pulse * 8, 0, Math.PI * 2);
      ctx.strokeStyle = color.replace(')', ',0.15)').replace('rgb', 'rgba').replace('#', '');
      // Convert hex to rgba for glow
      var hr = parseInt(color.slice(1,3),16), hg = parseInt(color.slice(3,5),16), hb = parseInt(color.slice(5,7),16);
      ctx.strokeStyle = 'rgba('+hr+','+hg+','+hb+','+( 0.08 + pulse * 0.12)+')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Main node
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    if (!g.alive) ctx.globalAlpha = 0.35;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Ray trace glow (GPU-inspired bloom)
    if (g.alive && (g.role === 'brain' || g.role === 'heart' || g.role === 'forge')) {
      var grad = ctx.createRadialGradient(px, py, r, px, py, r + 30);
      var hr2 = parseInt(color.slice(1,3),16), hg2 = parseInt(color.slice(3,5),16), hb2 = parseInt(color.slice(5,7),16);
      grad.addColorStop(0, 'rgba('+hr2+','+hg2+','+hb2+',0.15)');
      grad.addColorStop(1, 'rgba('+hr2+','+hg2+','+hb2+',0)');
      ctx.beginPath();
      ctx.arc(px, py, r + 30, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // Label
    ctx.font = g.alive ? 'bold 10px Courier New' : '9px Courier New';
    ctx.fillStyle = g.alive ? color : 'rgba(110,118,129,0.5)';
    ctx.textAlign = 'center';
    ctx.fillText(g.name, px, py + r + 14);
    // State label
    ctx.font = '8px Courier New';
    ctx.fillStyle = 'rgba(110,118,129,0.5)';
    var stateLabel = g.alive ? labelForColor(color) : (g.lastSeen ? 'FOSSIL' : 'VOID');
    ctx.fillText(stateLabel, px, py + r + 24);
    if (g.ollama > 0) {
      ctx.fillStyle = 'rgba(163,113,247,0.7)';
      ctx.fillText(g.ollama + ' models', px, py + r + 33);
    }
    ctx.textAlign = 'left';
  });
}

function drawBreathPulse() {
  // Global breath wave (blue, slow)
  var breathAmp = Math.sin(t * 0.3) * 0.5 + 0.5;
  ctx.beginPath();
  for (var bx = 0; bx < W; bx += 2) {
    var by = H * 0.92 + Math.sin(bx * 0.01 + t * 0.5) * 3 * breathAmp;
    if (bx === 0) ctx.moveTo(bx, by); else ctx.lineTo(bx, by);
  }
  ctx.strokeStyle = 'rgba(88,166,255,0.1)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Global heartbeat pulse (red, fast)
  var heartBeat = Math.pow(Math.sin(t * 3), 12);
  if (heartBeat > 0.3) {
    ctx.beginPath();
    var hx = W * 0.50, hy = H * 0.32;
    ctx.arc(hx, hy, 40 + heartBeat * 30, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(248,81,73,' + (heartBeat * 0.15) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (var sy = 0; sy < H; sy += 3) {
    ctx.fillRect(0, sy, W, 1);
  }
}

function draw() {
  t += 0.016;
  ctx.fillStyle = 'rgba(6,8,16,0.92)';
  ctx.fillRect(0, 0, W, H);

  drawScanlines();
  drawHouseZones();
  drawSpine();
  drawGates();
  drawBreathPulse();

  requestAnimationFrame(draw);
}

// Data polling — fetch live state from thymus/pulse
function pollState() {
  // Try to fetch the live chromatic state
  fetch('/data/chromatic-state.json?_=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.gates) {
        var aliveN = 0, downN = 0, ollamaN = 0;
        d.gates.forEach(function(gs) {
          var g = gateMap[gs.id];
          if (g) {
            g.alive = gs.alive;
            g.ollama = gs.ollama || 0;
            g.rtt = gs.rtt || null;
            g.lastSeen = gs.last_seen || null;
          }
          if (gs.alive) aliveN++; else downN++;
          if (gs.ollama > 0) ollamaN += gs.ollama;
        });
        document.getElementById('alive-count').textContent = aliveN;
        document.getElementById('down-count').textContent = downN;
        document.getElementById('ollama-count').textContent = ollamaN + ' models';
        document.getElementById('wave-label').textContent = 'wave ' + (d.wave || '?') + ' · ' + (d.ts || '');
        document.getElementById('last-scan').textContent = 'scanned ' + new Date().toLocaleTimeString();
      }
    })
    .catch(function() {
      document.getElementById('wave-label').textContent = 'offline — using last known state';
    });
}

// Initial state from what we KNOW
var KNOWN_STATE = {
  wave: '239l', ts: new Date().toISOString(),
  gates: [
    {id:'router',alive:true,ollama:0},{id:'mikrotik',alive:true,ollama:0},
    {id:'sporegate',alive:true,ollama:0},{id:'bluegate',alive:false,ollama:0},
    {id:'graftgate',alive:false,ollama:0},{id:'jetstream',alive:true,ollama:0},
    {id:'northgate',alive:true,ollama:0},{id:'southgate',alive:true,ollama:0},
    {id:'milkgate',alive:false,ollama:0},{id:'deckgate',alive:true,ollama:0},
    {id:'framegate',alive:false,ollama:0},{id:'epson',alive:true,ollama:0},
    {id:'graphenegate',alive:false,ollama:0},{id:'irongate',alive:true,ollama:18},
    {id:'eastgate',alive:true,ollama:38},
  ]
};
KNOWN_STATE.gates.forEach(function(gs) {
  var g = gateMap[gs.id];
  if (g) { g.alive = gs.alive; g.ollama = gs.ollama; }
});
document.getElementById('alive-count').textContent = KNOWN_STATE.gates.filter(function(g){return g.alive}).length;
document.getElementById('down-count').textContent = KNOWN_STATE.gates.filter(function(g){return !g.alive}).length;
document.getElementById('ollama-count').textContent = '56 models';
document.getElementById('wave-label').textContent = 'wave 239l · live scan';

setInterval(pollState, 15000);
draw();
</script>
</body></html>
