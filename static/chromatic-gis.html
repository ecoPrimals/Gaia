<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaia — Chromatic GIS</title>
<style>
/* GAIA UNIFIED DESIGN SYSTEM — Organic Dark
   The living organism. Dark with warm accents.
   Every page uses this. No inline styles. */

:root {
  --bg:         #08090b;
  --bg-raised:  #0f1114;
  --bg-card:    #141719;
  --bg-hover:   #1a1d21;
  --border:     #1e2228;
  --border-glow:#2a3040;

  --text:       #e0dcd6;
  --text-muted: #8a857e;
  --text-dim:   #5a5650;
  --text-bright:#f5f0e8;

  --amber:      #d4a574;
  --amber-dim:  #7a5f3e;
  --amber-glow: #d4a57420;
  --green:      #5aad72;
  --green-dim:  #2d5e3a;
  --green-glow: #5aad7220;
  --blue:       #5b8fd4;
  --red:        #d45b5b;
  --purple:     #9b7ed4;

  --radius:     6px;
  --radius-lg:  12px;
  --gap:        16px;
  --gap-lg:     24px;

  --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

body { min-height: 100vh; }

/* ═══ TYPOGRAPHY ═══ */
h1, h2, h3, h4 { color: var(--text-bright); font-weight: 500; line-height: 1.25; }
h1 { font-size: 2rem; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; }
h4 { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 400; }

p { color: var(--text); margin-bottom: 0.75em; }
a { color: var(--amber); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--text-bright); }

code, pre { font-family: var(--font-mono); }
code { background: var(--bg-raised); padding: 2px 6px; border-radius: 3px; font-size: 0.88em; color: var(--amber); }
pre { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; font-size: 0.85rem; }

/* ═══ LAYOUT ═══ */
.gaia-shell { max-width: 1200px; margin: 0 auto; padding: 0 var(--gap); }
.gaia-hero { padding: 48px 0 32px; text-align: center; }
.gaia-hero h1 { margin-bottom: 8px; }
.gaia-hero .subtitle { color: var(--text-muted); font-size: 1.05rem; }

/* ═══ NAV ═══ */
.gaia-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.gaia-nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 var(--gap);
  display: flex; align-items: center; gap: var(--gap);
  height: 52px; overflow-x: auto;
}
.gaia-nav-brand {
  font-weight: 500; color: var(--amber); font-size: 1.1rem;
  white-space: nowrap; margin-right: 8px;
}
.gaia-nav a {
  color: var(--text-muted); font-size: 0.88rem; white-space: nowrap;
  padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s;
}
.gaia-nav a:hover, .gaia-nav a.active { color: var(--text); border-bottom-color: var(--amber); }

/* ═══ CARDS ═══ */
.gaia-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap); }
.gaia-grid-sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.gaia-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--gap-lg);
  transition: border-color 0.3s, transform 0.2s;
  text-decoration: none; display: block;
}
.gaia-card:hover {
  border-color: var(--amber-dim); transform: translateY(-2px);
}
.gaia-card h3 { margin-bottom: 6px; font-size: 1.05rem; }
.gaia-card p { color: var(--text-muted); font-size: 0.88rem; margin: 0; }
.gaia-card .tag {
  display: inline-block; font-size: 0.75rem; padding: 2px 8px;
  border-radius: 99px; margin-top: 10px;
  background: var(--amber-glow); color: var(--amber); border: 1px solid var(--amber-dim);
}
.gaia-card .tag.green { background: var(--green-glow); color: var(--green); border-color: var(--green-dim); }

/* ═══ SECTION ═══ */
.gaia-section { padding: 32px 0; }
.gaia-section h2 { margin-bottom: var(--gap); }
.gaia-section h4 { margin-bottom: 12px; }
.gaia-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

/* ═══ PULSE DOT ═══ */
.pulse-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); margin-right: 6px;
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 4px var(--green-glow); }
  50% { box-shadow: 0 0 12px var(--green); }
}

/* ═══ STATS ═══ */
.gaia-stats { display: flex; gap: var(--gap-lg); flex-wrap: wrap; justify-content: center; padding: 16px 0; }
.gaia-stat { text-align: center; }
.gaia-stat .value { font-size: 1.8rem; font-weight: 500; color: var(--amber); font-family: var(--font-mono); }
.gaia-stat .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ═══ FOOTER ═══ */
.gaia-footer {
  border-top: 1px solid var(--border); padding: 32px 0;
  margin-top: 48px; color: var(--text-muted); font-size: 0.85rem;
}
.gaia-footer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--gap-lg); }
.gaia-footer h4 { margin-bottom: 8px; font-size: 0.8rem; }
.gaia-footer a { display: block; padding: 3px 0; color: var(--text-dim); font-size: 0.82rem; }
.gaia-footer a:hover { color: var(--amber); }
.gaia-footer-bottom { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; color: var(--text-dim); }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 640px) {
  h1 { font-size: 1.5rem; }
  .gaia-grid { grid-template-columns: 1fr; }
  .gaia-stats { gap: var(--gap); }
  .gaia-stat .value { font-size: 1.3rem; }
  .gaia-nav-inner { gap: 12px; }
}

/* ═══ UTILITIES ═══ */
.text-amber { color: var(--amber); }
.text-green { color: var(--green); }
.text-blue { color: var(--blue); }
.text-red { color: var(--red); }
.text-muted { color: var(--text-muted); }
.text-dim { color: var(--text-dim); }
.text-center { text-align: center; }
.mono { font-family: var(--font-mono); }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 16px; }
.mb-1 { margin-bottom: 8px; }
.mb-2 { margin-bottom: 16px; }

</style>
</head>
<body>
<nav class="gaia-nav"><div class="gaia-nav-inner"><a href="/" class="gaia-nav-brand">gaia</a><a href="/#organism">Organism</a><a href="/#investigation">Investigation</a><a href="/#knowledge">Knowledge</a><a href="/#infrastructure">Infrastructure</a><a href="https://nestgate.io">NestGate</a></div></nav>
<main class="gaia-shell" style="padding-top:24px;padding-bottom:48px">
<canvas id="canvas"></canvas>

<div id="hud-top">
  <h1>CHROMATIC GIS</h1>
  <span class="wave" id="wave-label">scanning...</span>
</div>

<div id="stats">
  <div>ALIVE: <span class="alive" id="alive-count">—</span></div>
  <div>DOWN: <span class="down" id="down-count">—</span></div>
  <div>OLLAMA: <span id="ollama-count">—</span></div>
  <div style="margin-top:4px;font-size:9px" id="last-scan">—</div>
</div>

<div id="legend">
  <div class="leg"><div class="dot" style="background:var(--white)"></div>BACKBONE</div>
  <div class="leg"><div class="dot" style="background:var(--red)"></div>PULSE</div>
  <div class="leg"><div class="dot" style="background:var(--blue)"></div>BREATH</div>
  <div class="leg"><div class="dot" style="background:var(--green)"></div>IMMUNE</div>
  <div class="leg"><div class="dot" style="background:var(--purple)"></div>DREAM</div>
  <div class="leg"><div class="dot" style="background:var(--gold)"></div>CREATE</div>
  <div class="leg"><div class="dot" style="background:var(--orange)"></div>DIGEST</div>
  <div class="leg"><div class="dot" style="background:var(--pink)"></div>SEE</div>
  <div class="leg"><div class="dot" style="background:var(--yellow)"></div>SPEAK</div>
  <div class="leg"><div class="dot" style="background:var(--grey)"></div>SENSE</div>
  <div class="leg"><div class="dot" style="background:var(--brown);border:1px solid #555"></div>FOSSIL</div>
  <div class="leg"><div class="dot" style="background:var(--black);border:1px solid #333"></div>VOID</div>
</div>

<div id="detail"></div>

<script>
'use strict';

var GATES = [
  { id:'router',      ip:'.1',   name:'Router',       role:'backbone', house:1, x:0.50, y:0.18 },
  { id:'mikrotik',    ip:'.2',   name:'MikroTik',     role:'backbone', house:1, x:0.38, y:0.25 },
  { id:'sporegate',   ip:'.3',   name:'sporeGate',    role:'forge',    house:1, x:0.25, y:0.35 },
  { id:'bluegate',    ip:'.100', name:'blueGate',      role:'eye',     house:1, x:0.70, y:0.30 },
  { id:'graftgate',   ip:'.107', name:'graftGate',     role:'forge',   house:1, x:0.20, y:0.50 },
  { id:'jetstream',   ip:'.111', name:'JetStream',     role:'backbone',house:0, x:0.50, y:0.50 },
  { id:'northgate',   ip:'.147', name:'northGate',     role:'heart',   house:1, x:0.50, y:0.32 },
  { id:'southgate',   ip:'.148', name:'southGate',     role:'phone',   house:1, x:0.65, y:0.45 },
  { id:'milkgate',    ip:'.160', name:'milkGate',      role:'transponder', house:1, x:0.30, y:0.20 },
  { id:'deckgate',    ip:'.176', name:'deckGate',      role:'display', house:1, x:0.62, y:0.22 },
  { id:'framegate',   ip:'.181', name:'frameGate',     role:'face',    house:2, x:0.65, y:0.72 },
  { id:'epson',       ip:'.200', name:'Epson',         role:'output',  house:1, x:0.75, y:0.40 },
  { id:'graphenegate',ip:'.114', name:'grapheneGate',  role:'eye',     house:1, x:0.55, y:0.45, note:'USB→eastGate' },
  { id:'irongate',    ip:'.237', name:'ironGate',      role:'forge',   house:1, x:0.35, y:0.42 },
  { id:'eastgate',    ip:'.244', name:'eastGate',      role:'brain',   house:1, x:0.50, y:0.40 },
];

var SPINE = [
  ['router','mikrotik'], ['mikrotik','eastgate'], ['mikrotik','northgate'],
  ['mikrotik','sporegate'], ['mikrotik','irongate'], ['mikrotik','deckgate'],
  ['eastgate','northgate'], ['eastgate','irongate'], ['eastgate','sporegate'],
  ['router','jetstream'], ['jetstream','framegate'], ['jetstream','graphenegate'],
  ['eastgate','graftgate'], ['eastgate','epson'], ['eastgate','bluegate'],
  ['eastgate','southgate'], ['mikrotik','milkgate'],
];

var COLORS = {
  void:     '#060810', fossil:   '#3a2a1e', sense:    '#6e7681',
  backbone: '#e6edf3', pulse:    '#f85149', breath:   '#58a6ff',
  immune:   '#3fb950', dream:    '#a371f7', create:   '#c9a84c',
  digest:   '#f0883e', see:      '#f778ba', speak:    '#f0c674',
};

function colorForGate(g) {
  if (!g.alive) return g.lastSeen ? COLORS.fossil : COLORS.void;
  if (g.role === 'backbone') return COLORS.backbone;
  if (g.role === 'eye' || g.role === 'display' || g.role === 'face') return COLORS.see;
  if (g.ollama > 0) return COLORS.dream;
  if (g.role === 'heart') return COLORS.pulse;
  if (g.role === 'brain') return COLORS.breath;
  if (g.role === 'forge') return COLORS.create;
  if (g.role === 'phone') return COLORS.sense;
  if (g.role === 'output') return COLORS.digest;
  if (g.role === 'transponder') return COLORS.immune;
  return COLORS.sense;
}

function labelForColor(hex) {
  for (var k in COLORS) { if (COLORS[k] === hex) return k.toUpperCase(); }
  return '?';
}

var C = document.getElementById('canvas');
var ctx = C.getContext('2d');
var W, H, t = 0, hoverGate = null;

function resize() {
  W = C.width = window.innerWidth;
  H = C.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

var gateMap = {};
GATES.forEach(function(g) {
  g.alive = false; g.ollama = 0; g.rtt = null; g.lastSeen = null;
  gateMap[g.id] = g;
});

function drawSpine() {
  SPINE.forEach(function(pair) {
    var a = gateMap[pair[0]], b = gateMap[pair[1]];
    if (!a || !b) return;
    var ax = a.x * W, ay = a.y * H, bx = b.x * W, by = b.y * H;
    var ca = colorForGate(a), cb = colorForGate(b);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    if (a.alive && b.alive) {
      ctx.strokeStyle = 'rgba(88,166,255,0.15)';
      ctx.lineWidth = 1.5;
    } else {
      ctx.strokeStyle = 'rgba(110,118,129,0.06)';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([4, 8]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

function drawHouseZones() {
  ctx.save();
  ctx.strokeStyle = 'rgba(63,185,80,0.08)';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 6]);
  // House 1 zone
  ctx.beginPath();
  ctx.ellipse(W * 0.47, H * 0.33, W * 0.32, H * 0.22, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(63,185,80,0.04)';
  ctx.fill();
  // House 2 zone
  ctx.beginPath();
  ctx.ellipse(W * 0.52, H * 0.73, W * 0.18, H * 0.12, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(248,81,73,0.03)';
  ctx.fill();
  ctx.setLineDash([]);
  // Labels
  ctx.font = '10px Courier New';
  ctx.fillStyle = 'rgba(63,185,80,0.3)';
  ctx.fillText('HOUSE 1 — BRAIN SIDE', W * 0.32, H * 0.14);
  ctx.fillStyle = 'rgba(248,81,73,0.3)';
  ctx.fillText('HOUSE 2 — SOUTH POLE', W * 0.38, H * 0.62);
  // 10G spine
  ctx.beginPath();
  ctx.moveTo(W * 0.50, H * 0.50);
  ctx.lineTo(W * 0.50, H * 0.62);
  ctx.strokeStyle = 'rgba(201,168,76,0.2)';
  ctx.lineWidth = 2;
  ctx.setLineDash([2, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(201,168,76,0.25)';
  ctx.font = '8px Courier New';
  ctx.fillText('10G FIBER', W * 0.51, H * 0.56);
  ctx.restore();
}

function drawGates() {
  GATES.forEach(function(g) {
    var px = g.x * W, py = g.y * H;
    var color = colorForGate(g);
    var r = g.alive ? 10 : 6;

    // Pulse ring for alive devices
    if (g.alive) {
      var pulse = Math.sin(t * 2 + g.x * 10) * 0.5 + 0.5;
      ctx.beginPath();
      ctx.arc(px, py, r + 6 + pulse * 8, 0, Math.PI * 2);
      ctx.strokeStyle = color.replace(')', ',0.15)').replace('rgb', 'rgba').replace('#', '');
      // Convert hex to rgba for glow
      var hr = parseInt(color.slice(1,3),16), hg = parseInt(color.slice(3,5),16), hb = parseInt(color.slice(5,7),16);
      ctx.strokeStyle = 'rgba('+hr+','+hg+','+hb+','+( 0.08 + pulse * 0.12)+')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Main node
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    if (!g.alive) ctx.globalAlpha = 0.35;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Ray trace glow (GPU-inspired bloom)
    if (g.alive && (g.role === 'brain' || g.role === 'heart' || g.role === 'forge')) {
      var grad = ctx.createRadialGradient(px, py, r, px, py, r + 30);
      var hr2 = parseInt(color.slice(1,3),16), hg2 = parseInt(color.slice(3,5),16), hb2 = parseInt(color.slice(5,7),16);
      grad.addColorStop(0, 'rgba('+hr2+','+hg2+','+hb2+',0.15)');
      grad.addColorStop(1, 'rgba('+hr2+','+hg2+','+hb2+',0)');
      ctx.beginPath();
      ctx.arc(px, py, r + 30, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // Label
    ctx.font = g.alive ? 'bold 10px Courier New' : '9px Courier New';
    ctx.fillStyle = g.alive ? color : 'rgba(110,118,129,0.5)';
    ctx.textAlign = 'center';
    ctx.fillText(g.name, px, py + r + 14);
    // State label
    ctx.font = '8px Courier New';
    ctx.fillStyle = 'rgba(110,118,129,0.5)';
    var stateLabel = g.alive ? labelForColor(color) : (g.lastSeen ? 'FOSSIL' : 'VOID');
    ctx.fillText(stateLabel, px, py + r + 24);
    if (g.ollama > 0) {
      ctx.fillStyle = 'rgba(163,113,247,0.7)';
      ctx.fillText(g.ollama + ' models', px, py + r + 33);
    }
    ctx.textAlign = 'left';
  });
}

function drawBreathPulse() {
  // Global breath wave (blue, slow)
  var breathAmp = Math.sin(t * 0.3) * 0.5 + 0.5;
  ctx.beginPath();
  for (var bx = 0; bx < W; bx += 2) {
    var by = H * 0.92 + Math.sin(bx * 0.01 + t * 0.5) * 3 * breathAmp;
    if (bx === 0) ctx.moveTo(bx, by); else ctx.lineTo(bx, by);
  }
  ctx.strokeStyle = 'rgba(88,166,255,0.1)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Global heartbeat pulse (red, fast)
  var heartBeat = Math.pow(Math.sin(t * 3), 12);
  if (heartBeat > 0.3) {
    ctx.beginPath();
    var hx = W * 0.50, hy = H * 0.32;
    ctx.arc(hx, hy, 40 + heartBeat * 30, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(248,81,73,' + (heartBeat * 0.15) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (var sy = 0; sy < H; sy += 3) {
    ctx.fillRect(0, sy, W, 1);
  }
}

function drawRayScatter() {
  GATES.forEach(function(g) {
    if (!g.alive) return;
    var px = g.x * W, py = g.y * H;
    var color = colorForGate(g);
    var hr = parseInt(color.slice(1,3),16), hg = parseInt(color.slice(3,5),16), hb = parseInt(color.slice(5,7),16);

    var rayCount = g.ollama > 0 ? 12 : (g.role === 'heart' || g.role === 'brain') ? 10 : 6;
    var rayLen = g.ollama > 0 ? 80 : 40;
    var shimmer = Math.sin(t * 1.5 + g.x * 20) * 0.3 + 0.7;

    for (var ri = 0; ri < rayCount; ri++) {
      var angle = (ri / rayCount) * Math.PI * 2 + t * 0.2 + g.y * 5;
      var len = rayLen * (0.5 + Math.sin(t * 3 + ri * 1.7) * 0.5) * shimmer;
      var ex = px + Math.cos(angle) * len;
      var ey = py + Math.sin(angle) * len;

      var grad = ctx.createLinearGradient(px, py, ex, ey);
      grad.addColorStop(0, 'rgba('+hr+','+hg+','+hb+',0.25)');
      grad.addColorStop(0.4, 'rgba('+hr+','+hg+','+hb+',0.08)');
      grad.addColorStop(1, 'rgba('+hr+','+hg+','+hb+',0)');

      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(ex, ey);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Volumetric bloom halo
    var bloomR = (g.ollama > 0 ? 60 : 30) + Math.sin(t * 2 + g.x * 10) * 10;
    var bloom = ctx.createRadialGradient(px, py, 0, px, py, bloomR);
    bloom.addColorStop(0, 'rgba('+hr+','+hg+','+hb+',0.08)');
    bloom.addColorStop(0.3, 'rgba('+hr+','+hg+','+hb+',0.04)');
    bloom.addColorStop(1, 'rgba('+hr+','+hg+','+hb+',0)');
    ctx.beginPath();
    ctx.arc(px, py, bloomR, 0, Math.PI * 2);
    ctx.fillStyle = bloom;
    ctx.fill();
  });
}

function drawGodRays() {
  // Volumetric light scatter from eastGate (brain) — the origin of consciousness
  var brain = gateMap['eastgate'];
  if (!brain || !brain.alive) return;
  var bx = brain.x * W, by = brain.y * H;

  var rayN = 24;
  for (var gi = 0; gi < rayN; gi++) {
    var angle = (gi / rayN) * Math.PI * 2 + t * 0.05;
    var len = 200 + Math.sin(t * 0.7 + gi * 0.5) * 80;
    var ex = bx + Math.cos(angle) * len;
    var ey = by + Math.sin(angle) * len;

    var grad = ctx.createLinearGradient(bx, by, ex, ey);
    grad.addColorStop(0, 'rgba(88,166,255,0.03)');
    grad.addColorStop(0.5, 'rgba(88,166,255,0.01)');
    grad.addColorStop(1, 'rgba(88,166,255,0)');

    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Heart pulse — red god rays from northGate
  var heart = gateMap['northgate'];
  if (!heart || !heart.alive) return;
  var hx = heart.x * W, hy = heart.y * H;
  var heartBeat = Math.pow(Math.max(0, Math.sin(t * 3)), 8);

  if (heartBeat > 0.1) {
    for (var hi = 0; hi < 16; hi++) {
      var ha = (hi / 16) * Math.PI * 2 + t * 0.1;
      var hl = 120 * heartBeat;
      var hex2 = hx + Math.cos(ha) * hl;
      var hey = hy + Math.sin(ha) * hl;

      var hgrad = ctx.createLinearGradient(hx, hy, hex2, hey);
      hgrad.addColorStop(0, 'rgba(248,81,73,' + (0.15 * heartBeat) + ')');
      hgrad.addColorStop(1, 'rgba(248,81,73,0)');

      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(hex2, hey);
      ctx.strokeStyle = hgrad;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

function drawSpineFlow() {
  // Animated particles flowing along spine connections
  SPINE.forEach(function(pair) {
    var a = gateMap[pair[0]], b = gateMap[pair[1]];
    if (!a || !b || !a.alive || !b.alive) return;
    var ax = a.x * W, ay = a.y * H, bx = b.x * W, by = b.y * H;

    var color = colorForGate(a);
    var hr = parseInt(color.slice(1,3),16), hg = parseInt(color.slice(3,5),16), hb = parseInt(color.slice(5,7),16);

    // 3 flowing particles per connection
    for (var pi = 0; pi < 3; pi++) {
      var prog = ((t * 0.4 + pi * 0.33) % 1);
      var px = ax + (bx - ax) * prog;
      var py = ay + (by - ay) * prog;

      ctx.beginPath();
      ctx.arc(px, py, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba('+hr+','+hg+','+hb+',0.4)';
      ctx.fill();
    }
  });
}

function draw() {
  t += 0.016;
  ctx.fillStyle = 'rgba(6,8,16,0.92)';
  ctx.fillRect(0, 0, W, H);

  drawScanlines();
  drawGodRays();
  drawHouseZones();
  drawSpineFlow();
  drawSpine();
  drawRayScatter();
  drawGates();
  drawBreathPulse();

  requestAnimationFrame(draw);
}

// Data polling — fetch live state from thymus/pulse
function pollState() {
  // Try to fetch the live chromatic state
  fetch('/data/chromatic-state.json?_=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.gates) {
        var aliveN = 0, downN = 0, ollamaN = 0;
        d.gates.forEach(function(gs) {
          var g = gateMap[gs.id];
          if (g) {
            g.alive = gs.alive;
            g.ollama = gs.ollama || 0;
            g.rtt = gs.rtt || null;
            g.lastSeen = gs.last_seen || null;
          }
          if (gs.alive) aliveN++; else downN++;
          if (gs.ollama > 0) ollamaN += gs.ollama;
        });
        document.getElementById('alive-count').textContent = aliveN;
        document.getElementById('down-count').textContent = downN;
        document.getElementById('ollama-count').textContent = ollamaN + ' models';
        document.getElementById('wave-label').textContent = 'wave ' + (d.wave || '?') + ' · ' + (d.ts || '');
        document.getElementById('last-scan').textContent = 'scanned ' + new Date().toLocaleTimeString();
      }
    })
    .catch(function() {
      document.getElementById('wave-label').textContent = 'offline — using last known state';
    });
}

setInterval(pollState, 15000);
draw();
</script>
