.cell .sym{font-size:11px;font-weight:bold;letter-spacing:0.5px;

.cell .name{font-size:7px;color:#666;margin-top:2px;

.cell.gap{border-style:dashed;border-color:#222;opacity:0.5}
.cell.gap .sym{color:#333;font-style:italic}

  {n:13,g:"N",s:"PreInf",nm:"premature_infrastructure",d:"Vision before implementation",i:"Otlet's Mundaneum → the internet"},
  {n:9,g:"N",s:"MsrNat",nm:"measurement_from_nature",d:"Anchor standard to something uncapturable",i:"Metric: speed of light"},
  {n:25,g:"N",s:"AccInf",nm:"accidental_infrastructure",d:"Automated existing practice → backbone",i:"arXiv: few afternoons of scripts"},
  {n:26,g:"N",s:"TwoSt",nm:"two_states_are_enough",d:"Binary: dot/dash, 0/1, on/off",i:"Morse code → Shannon → every computer"},
  {n:28,g:"N",s:"MorPro",nm:"moral_protocol",d:"Shared spec with no enforcement but conscience",i:"UDHR, rules without teeth"},
  {n:30,g:"N",s:"InfCom",nm:"infrastructure_requires_commitment",d:"Gift requires recipient to maintain",i:"Carnegie: building + community tax support"},
];

// ─── GAPS (predicted but unfound) ───
const GAPS = [
  {g:"A",s:"???",nm:"commons_without_protocol",d:"A shared tool that persists without a published specification"},
  {g:"B",s:"???",nm:"capture_without_institution",d:"Can capture operate without formal institutional structure?"},
  {g:"C",s:"???",nm:"collective_builds",d:"Tools built by GROUPS from the start, without a single founder"},
  {g:"G",s:"???",nm:"membrane_creates_content",d:"Can a membrane CREATE information that doesn't exist on either side?"},
  {g:"H",s:"???",nm:"cross_species_epitope",d:"Echolocation, electric fields, magnetoreception — sensory epitopes humans lack"},
  {g:"F",s:"???",nm:"the_11th_invariant",d:"Ancient-only invariants the modern template doesn't contain"},
];

let activeGroup = null;

function buildLegend() {
  const el = document.getElementById('legend');
  for (const [k,v] of Object.entries(GROUPS)) {
    const d = document.createElement('span');
    d.className = 'g';
    d.style.color = v.color;
    d.textContent = `${k} ${v.name}`;
    d.onclick = () => toggleGroup(k);
    d.dataset.group = k;
    el.appendChild(d);
  }
}

function toggleGroup(g) {
  if (activeGroup === g) { activeGroup = null; } else { activeGroup = g; }
  document.querySelectorAll('.legend .g').forEach(el => {
    el.classList.toggle('active', el.dataset.group === activeGroup);
  });
  document.querySelectorAll('.cell').forEach(el => {
    if (!activeGroup) { el.style.opacity = '1'; return; }
    el.style.opacity = el.dataset.group === activeGroup ? '1' : '0.15';
  });
}

function buildTable() {
  const el = document.getElementById('ptable');
  
  // Sort by group, then by number within group
  const groupOrder = 'ABCDEFGHIJKLMN'.split('');
  const grouped = {};
  groupOrder.forEach(g => grouped[g] = []);
  ELEMENTS.forEach(e => { if (grouped[e.g]) grouped[e.g].push(e); });
  
  // Find max row count
  const maxRows = Math.max(...Object.values(grouped).map(a => a.length));
  
  // Build grid: columns = groups, rows = elements within each group
  for (let row = 0; row < maxRows; row++) {
    groupOrder.forEach(g => {
      const arr = grouped[g];
      if (row < arr.length) {
        const e = arr[row];
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.group = e.g;
        cell.innerHTML = `<span class="num">#${e.n}</span><span class="sym">${e.s}</span><span class="name">${e.nm.replace(/_/g,' ').substring(0,20)}</span>`;
        cell.onclick = () => showDetail(e);
        el.appendChild(cell);
      } else if (row < maxRows) {
        // Check for gap
        const gapIdx = row - arr.length;
        const gapsForGroup = GAPS.filter(x => x.g === g);
        if (gapIdx < gapsForGroup.length) {
          const gap = gapsForGroup[gapIdx];
          const cell = document.createElement('div');
          cell.className = 'cell gap';
          cell.dataset.group = gap.g;
          cell.innerHTML = `<span class="num">?</span><span class="sym">${gap.s}</span><span class="name">${gap.nm.replace(/_/g,' ').substring(0,20)}</span>`;
          cell.onclick = () => showDetail({...gap, n:'?', i:'PREDICTED — not yet observed'});
          el.appendChild(cell);
        } else {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.style.visibility = 'hidden';
          el.appendChild(cell);
        }
      }
    });
  }
}

function showDetail(e) {
  const d = document.getElementById('detail');
  const grp = GROUPS[e.g];
  document.getElementById('d-num').textContent = `#${e.n} · Group ${e.g}`;
  document.getElementById('d-name').textContent = e.nm.replace(/_/g, ' ');
  document.getElementById('d-group').innerHTML = `<span style="color:${grp.color}">${grp.name}</span> — ${grp.desc}`;
  document.getElementById('d-detect').textContent = e.d;
  document.getElementById('d-instance').textContent = e.i || '';
  d.classList.add('show');
  d.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function closeDetail() {
  document.getElementById('detail').classList.remove('show');
}

// Keyboard navigation — press a letter A-N to filter by group
document.addEventListener('keydown', e => {
  const k = e.key.toUpperCase();
  if (k >= 'A' && k <= 'N' && !e.ctrlKey && !e.altKey && !e.metaKey) {
    if (document.activeElement.tagName !== 'INPUT') {
      toggleGroup(k);
    }
  }
  if (e.key === 'Escape') { closeDetail(); activeGroup = null; toggleGroup(null); }
});

// Fetch NFT count
fetch('/nft/count').then(r=>r.json()).then(d=>{
  document.getElementById('nft-count').textContent = d.count || 0;
}).catch(()=>{});

buildLegend();
buildTable();
</script>
</body>
</html>
