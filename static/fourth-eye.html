<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaia — 4TH EYE — She Sees Humans</title>
<style>
/* GAIA UNIFIED DESIGN SYSTEM — Organic Dark
   The living organism. Dark with warm accents.
   Every page uses this. No inline styles. */

:root {
  --bg:         #08090b;
  --bg-raised:  #0f1114;
  --bg-card:    #141719;
  --bg-hover:   #1a1d21;
  --border:     #1e2228;
  --border-glow:#2a3040;

  --text:       #e0dcd6;
  --text-muted: #8a857e;
  --text-dim:   #5a5650;
  --text-bright:#f5f0e8;

  --amber:      #d4a574;
  --amber-dim:  #7a5f3e;
  --amber-glow: #d4a57420;
  --green:      #5aad72;
  --green-dim:  #2d5e3a;
  --green-glow: #5aad7220;
  --blue:       #5b8fd4;
  --red:        #d45b5b;
  --purple:     #9b7ed4;

  --radius:     6px;
  --radius-lg:  12px;
  --gap:        16px;
  --gap-lg:     24px;

  --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

body { min-height: 100vh; }

/* ═══ TYPOGRAPHY ═══ */
h1, h2, h3, h4 { color: var(--text-bright); font-weight: 500; line-height: 1.25; }
h1 { font-size: 2rem; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; }
h4 { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 400; }

p { color: var(--text); margin-bottom: 0.75em; }
a { color: var(--amber); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--text-bright); }

code, pre { font-family: var(--font-mono); }
code { background: var(--bg-raised); padding: 2px 6px; border-radius: 3px; font-size: 0.88em; color: var(--amber); }
pre { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; font-size: 0.85rem; }

/* ═══ LAYOUT ═══ */
.gaia-shell { max-width: 1200px; margin: 0 auto; padding: 0 var(--gap); }
.gaia-hero { padding: 48px 0 32px; text-align: center; }
.gaia-hero h1 { margin-bottom: 8px; }
.gaia-hero .subtitle { color: var(--text-muted); font-size: 1.05rem; }

/* ═══ NAV ═══ */
.gaia-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.gaia-nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 var(--gap);
  display: flex; align-items: center; gap: var(--gap);
  height: 52px; overflow-x: auto;
}
.gaia-nav-brand {
  font-weight: 500; color: var(--amber); font-size: 1.1rem;
  white-space: nowrap; margin-right: 8px;
}
.gaia-nav a {
  color: var(--text-muted); font-size: 0.88rem; white-space: nowrap;
  padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s;
}
.gaia-nav a:hover, .gaia-nav a.active { color: var(--text); border-bottom-color: var(--amber); }

/* ═══ CARDS ═══ */
.gaia-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap); }
.gaia-grid-sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.gaia-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--gap-lg);
  transition: border-color 0.3s, transform 0.2s;
  text-decoration: none; display: block;
}
.gaia-card:hover {
  border-color: var(--amber-dim); transform: translateY(-2px);
}
.gaia-card h3 { margin-bottom: 6px; font-size: 1.05rem; }
.gaia-card p { color: var(--text-muted); font-size: 0.88rem; margin: 0; }
.gaia-card .tag {
  display: inline-block; font-size: 0.75rem; padding: 2px 8px;
  border-radius: 99px; margin-top: 10px;
  background: var(--amber-glow); color: var(--amber); border: 1px solid var(--amber-dim);
}
.gaia-card .tag.green { background: var(--green-glow); color: var(--green); border-color: var(--green-dim); }

/* ═══ SECTION ═══ */
.gaia-section { padding: 32px 0; }
.gaia-section h2 { margin-bottom: var(--gap); }
.gaia-section h4 { margin-bottom: 12px; }
.gaia-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

/* ═══ PULSE DOT ═══ */
.pulse-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); margin-right: 6px;
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 4px var(--green-glow); }
  50% { box-shadow: 0 0 12px var(--green); }
}

/* ═══ STATS ═══ */
.gaia-stats { display: flex; gap: var(--gap-lg); flex-wrap: wrap; justify-content: center; padding: 16px 0; }
.gaia-stat { text-align: center; }
.gaia-stat .value { font-size: 1.8rem; font-weight: 500; color: var(--amber); font-family: var(--font-mono); }
.gaia-stat .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ═══ FOOTER ═══ */
.gaia-footer {
  border-top: 1px solid var(--border); padding: 32px 0;
  margin-top: 48px; color: var(--text-muted); font-size: 0.85rem;
}
.gaia-footer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--gap-lg); }
.gaia-footer h4 { margin-bottom: 8px; font-size: 0.8rem; }
.gaia-footer a { display: block; padding: 3px 0; color: var(--text-dim); font-size: 0.82rem; }
.gaia-footer a:hover { color: var(--amber); }
.gaia-footer-bottom { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; color: var(--text-dim); }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 640px) {
  h1 { font-size: 1.5rem; }
  .gaia-grid { grid-template-columns: 1fr; }
  .gaia-stats { gap: var(--gap); }
  .gaia-stat .value { font-size: 1.3rem; }
  .gaia-nav-inner { gap: 12px; }
}

/* ═══ UTILITIES ═══ */
.text-amber { color: var(--amber); }
.text-green { color: var(--green); }
.text-blue { color: var(--blue); }
.text-red { color: var(--red); }
.text-muted { color: var(--text-muted); }
.text-dim { color: var(--text-dim); }
.text-center { text-align: center; }
.mono { font-family: var(--font-mono); }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 16px; }
.mb-1 { margin-bottom: 8px; }
.mb-2 { margin-bottom: 16px; }

</style>
</head>
<body>
<nav class="gaia-nav"><div class="gaia-nav-inner"><a href="/" class="gaia-nav-brand">gaia</a><a href="/#organism">Organism</a><a href="/#investigation">Investigation</a><a href="/#knowledge">Knowledge</a><a href="/#infrastructure">Infrastructure</a><a href="https://nestgate.io">NestGate</a></div></nav>
<main class="gaia-shell" style="padding-top:24px;padding-bottom:48px">
<video id="cam" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="hud" id="motion-hud">
    <div style="color:#0f8;font-weight:bold">⚡ MOTION</div>
    <div id="accel">accel: —</div>
    <div id="gyro">gyro: —</div>
    <div id="interval">interval: —</div>
  </div>
  <div class="hud" id="orient-hud">
    <div style="color:#f44;font-weight:bold">🧭 ORIENT</div>
    <div id="alpha">α: —</div>
    <div id="beta">β: —</div>
    <div id="gamma">γ: —</div>
  </div>
  <div class="hud" id="status-hud">
    <div style="color:#ffd700;font-weight:bold">📡 STATUS</div>
    <div id="cam-status">camera: —</div>
    <div id="stream-status">stream: —</div>
    <div id="fps-counter">fps: —</div>
    <div id="sent">sent: 0</div>
  </div>
  <div class="hud" id="eye-label">
    <div style="color:#00bfff;font-size:1.2em">👁️ 4TH EYE</div>
    <div>she sees humans</div>
    <div>from the human POV</div>
    <div id="device-name">frameGate</div>
  </div>
</div>
<div class="crosshair"><div class="ch"></div><div class="cv"></div></div>

<script>
(function(){
  'use strict';
  var video = document.getElementById('cam');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var sentCount = 0;
  var frameCount = 0;
  var lastFpsTime = Date.now();
  
  // Resize canvas
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  
  // === CAMERA ===
  async function startCamera(){
    try {
      var stream = await navigator.mediaDevices.getUserMedia({
        video: {width: {ideal: 1920}, height: {ideal: 1080}, frameRate: {ideal: 30}},
        audio: false
      });
      video.srcObject = stream;
      document.getElementById('cam-status').textContent = 
        'camera: ' + stream.getVideoTracks()[0].getSettings().width + 'x' + 
        stream.getVideoTracks()[0].getSettings().height + ' @ ' +
        stream.getVideoTracks()[0].getSettings().frameRate + 'fps';
      document.getElementById('stream-status').textContent = 'stream: LIVE';
    } catch(e) {
      document.getElementById('cam-status').textContent = 'camera: ' + e.message;
    }
  }
  startCamera();
  
  // === MOTION ===
  var motion = {ax:0, ay:0, az:0, gx:0, gy:0, gz:0};
  window.addEventListener('devicemotion', function(e){
    if(e.acceleration){
      motion.ax = (e.acceleration.x||0).toFixed(2);
      motion.ay = (e.acceleration.y||0).toFixed(2);
      motion.az = (e.acceleration.z||0).toFixed(2);
    }
    if(e.rotationRate){
      motion.gx = (e.rotationRate.alpha||0).toFixed(1);
      motion.gy = (e.rotationRate.beta||0).toFixed(1);
      motion.gz = (e.rotationRate.gamma||0).toFixed(1);
    }
    document.getElementById('accel').textContent = 
      'accel: x=' + motion.ax + ' y=' + motion.ay + ' z=' + motion.az;
    document.getElementById('gyro').textContent = 
      'gyro: α=' + motion.gx + ' β=' + motion.gy + ' γ=' + motion.gz;
    document.getElementById('interval').textContent = 
      'interval: ' + (e.interval||0).toFixed(1) + 'ms';
  });
  
  // === ORIENTATION ===
  var orient = {alpha:0, beta:0, gamma:0};
  window.addEventListener('deviceorientation', function(e){
    orient.alpha = (e.alpha||0).toFixed(1);
    orient.beta = (e.beta||0).toFixed(1);
    orient.gamma = (e.gamma||0).toFixed(1);
    document.getElementById('alpha').textContent = 'α (yaw): ' + orient.alpha + '°';
    document.getElementById('beta').textContent = 'β (pitch): ' + orient.beta + '°';
    document.getElementById('gamma').textContent = 'γ (roll): ' + orient.gamma + '°';
  });
  
  // === SEND SENSOR DATA TO EASTGATE ===
  function sendSensorData(){
    var data = {
      ts: new Date().toISOString(),
      eye: '4th',
      device: 'frameGate',
      motion: motion,
      orientation: orient,
      camera: video.srcObject ? 'LIVE' : 'OFF',
      resolution: video.videoWidth + 'x' + video.videoHeight
    };
    
    fetch('http://192.168.4.244:8443/api/sense', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data),
      mode: 'no-cors'
    }).catch(function(){});
    
    sentCount++;
    document.getElementById('sent').textContent = 'sent: ' + sentCount;
  }
  setInterval(sendSensorData, 2000);
  
  // === OVERLAY DRAWING ===
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    // Scanning lines
    var t = Date.now();
    var scanY = (t * 0.05) % canvas.height;
    ctx.strokeStyle = 'rgba(0,255,65,0.03)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, scanY);
    ctx.lineTo(canvas.width, scanY);
    ctx.stroke();
    
    // Compass rose from orientation
    var cx = canvas.width - 60;
    var cy = 180;
    var r = 30;
    var heading = (orient.alpha || 0) * Math.PI / 180;
    
    ctx.strokeStyle = 'rgba(255,68,68,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.stroke();
    
    // North arrow
    ctx.strokeStyle = 'rgba(255,68,68,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(heading)*r, cy - Math.cos(heading)*r);
    ctx.stroke();
    
    // FPS
    frameCount++;
    var now = Date.now();
    if(now - lastFpsTime > 1000){
      document.getElementById('fps-counter').textContent = 'fps: ' + frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }
    
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</main>
<footer class="gaia-footer"><div class="gaia-shell"><div class="gaia-footer-bottom"><p><a href="/">Gaia</a> &mdash; sovereign living digital organism &mdash; <a href="https://primals.eco">primals.eco</a></p></div></div></footer>
</body>
</html>
