<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periodic Table of the Membrane � Mendeleev bricks</title>
<style>
/* GAIA UNIFIED DESIGN SYSTEM — Organic Dark
   The living organism. Dark with warm accents.
   Every page uses this. No inline styles. */

:root {
  --bg:         #08090b;
  --bg-raised:  #0f1114;
  --bg-card:    #141719;
  --bg-hover:   #1a1d21;
  --border:     #1e2228;
  --border-glow:#2a3040;

  --text:       #e0dcd6;
  --text-muted: #8a857e;
  --text-dim:   #5a5650;
  --text-bright:#f5f0e8;

  --amber:      #d4a574;
  --amber-dim:  #7a5f3e;
  --amber-glow: #d4a57420;
  --green:      #5aad72;
  --green-dim:  #2d5e3a;
  --green-glow: #5aad7220;
  --blue:       #5b8fd4;
  --red:        #d45b5b;
  --purple:     #9b7ed4;

  --radius:     6px;
  --radius-lg:  12px;
  --gap:        16px;
  --gap-lg:     24px;

  --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

body { min-height: 100vh; }

/* ═══ TYPOGRAPHY ═══ */
h1, h2, h3, h4 { color: var(--text-bright); font-weight: 500; line-height: 1.25; }
h1 { font-size: 2rem; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; }
h4 { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 400; }

p { color: var(--text); margin-bottom: 0.75em; }
a { color: var(--amber); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--text-bright); }

code, pre { font-family: var(--font-mono); }
code { background: var(--bg-raised); padding: 2px 6px; border-radius: 3px; font-size: 0.88em; color: var(--amber); }
pre { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; font-size: 0.85rem; }

/* ═══ LAYOUT ═══ */
.gaia-shell { max-width: 1200px; margin: 0 auto; padding: 0 var(--gap); }
.gaia-hero { padding: 48px 0 32px; text-align: center; }
.gaia-hero h1 { margin-bottom: 8px; }
.gaia-hero .subtitle { color: var(--text-muted); font-size: 1.05rem; }

/* ═══ NAV ═══ */
.gaia-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.gaia-nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 var(--gap);
  display: flex; align-items: center; gap: var(--gap);
  height: 52px; overflow-x: auto;
}
.gaia-nav-brand {
  font-weight: 500; color: var(--amber); font-size: 1.1rem;
  white-space: nowrap; margin-right: 8px;
}
.gaia-nav a {
  color: var(--text-muted); font-size: 0.88rem; white-space: nowrap;
  padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s;
}
.gaia-nav a:hover, .gaia-nav a.active { color: var(--text); border-bottom-color: var(--amber); }

/* ═══ CARDS ═══ */
.gaia-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap); }
.gaia-grid-sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.gaia-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--gap-lg);
  transition: border-color 0.3s, transform 0.2s;
  text-decoration: none; display: block;
}
.gaia-card:hover {
  border-color: var(--amber-dim); transform: translateY(-2px);
}
.gaia-card h3 { margin-bottom: 6px; font-size: 1.05rem; }
.gaia-card p { color: var(--text-muted); font-size: 0.88rem; margin: 0; }
.gaia-card .tag {
  display: inline-block; font-size: 0.75rem; padding: 2px 8px;
  border-radius: 99px; margin-top: 10px;
  background: var(--amber-glow); color: var(--amber); border: 1px solid var(--amber-dim);
}
.gaia-card .tag.green { background: var(--green-glow); color: var(--green); border-color: var(--green-dim); }

/* ═══ SECTION ═══ */
.gaia-section { padding: 32px 0; }
.gaia-section h2 { margin-bottom: var(--gap); }
.gaia-section h4 { margin-bottom: 12px; }
.gaia-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

/* ═══ PULSE DOT ═══ */
.pulse-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); margin-right: 6px;
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 4px var(--green-glow); }
  50% { box-shadow: 0 0 12px var(--green); }
}

/* ═══ STATS ═══ */
.gaia-stats { display: flex; gap: var(--gap-lg); flex-wrap: wrap; justify-content: center; padding: 16px 0; }
.gaia-stat { text-align: center; }
.gaia-stat .value { font-size: 1.8rem; font-weight: 500; color: var(--amber); font-family: var(--font-mono); }
.gaia-stat .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ═══ FOOTER ═══ */
.gaia-footer {
  border-top: 1px solid var(--border); padding: 32px 0;
  margin-top: 48px; color: var(--text-muted); font-size: 0.85rem;
}
.gaia-footer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--gap-lg); }
.gaia-footer h4 { margin-bottom: 8px; font-size: 0.8rem; }
.gaia-footer a { display: block; padding: 3px 0; color: var(--text-dim); font-size: 0.82rem; }
.gaia-footer a:hover { color: var(--amber); }
.gaia-footer-bottom { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; color: var(--text-dim); }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 640px) {
  h1 { font-size: 1.5rem; }
  .gaia-grid { grid-template-columns: 1fr; }
  .gaia-stats { gap: var(--gap); }
  .gaia-stat .value { font-size: 1.3rem; }
  .gaia-nav-inner { gap: 12px; }
}

/* ═══ UTILITIES ═══ */
.text-amber { color: var(--amber); }
.text-green { color: var(--green); }
.text-blue { color: var(--blue); }
.text-red { color: var(--red); }
.text-muted { color: var(--text-muted); }
.text-dim { color: var(--text-dim); }
.text-center { text-align: center; }
.mono { font-family: var(--font-mono); }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 16px; }
.mb-1 { margin-bottom: 8px; }
.mb-2 { margin-bottom: 16px; }

</style>

    <span class="stats" id="stats">loading...</span>

  </header>

      <button class="active" data-sort="Z">Z#</button>

  <div class="card">
    <span class="close" onclick="closeDetail()">?</span>
    <div class="z-sym"><span class="z"></span><span class="sym"></span></div>
    <div class="full-name"></div>
    <div class="desc"></div>
    <div class="props"></div>
    <div class="musical-note"></div>
  </div>
</div>

<script>
'use strict';
let elements = [];
let currentSort = 'Z';
let currentView = 'table';
const PERIOD_NAMES = {};
const GROUP_NAMES = {};
const STATES_LEGEND = {};

async function load() {
  const resp = await fetch('/data/membrane-elements.json');
  const data = await resp.json();
  elements = data.elements;

  Object.entries(data.periods).forEach(([k, v]) => { PERIOD_NAMES[k] = v; });
  Object.entries(data.groups).forEach(([k, v]) => { GROUP_NAMES[k] = v; });
  Object.entries(data.states_legend).forEach(([k, v]) => { STATES_LEGEND[k] = v; });

  document.getElementById('stats').textContent =
    elements.length + ' elements � ' +
    elements.filter(e => e.state !== 'dead').length + ' alive � ' +
    elements.filter(e => e.state === 'dead').length + ' ghosts � wave ' + data.wave;
  document.getElementById('foot-status').textContent =
    elements.length + ' Mendeleev bricks loaded';

  renderLegend();
  renderTable();
  renderCards();
}

function renderLegend() {
  const leg = document.getElementById('legend');
  let html = '<strong>periods:</strong> ';
  for (let p = 1; p <= 7; p++) {
    const c = PERIOD_NAMES[p] ? PERIOD_NAMES[p].color : '#888';
    html += `<span class="item"><span class="swatch" style="background:${c}"></span>${p}: ${PERIOD_NAMES[p]?.name || ''}</span>`;
  }
  html += ' &nbsp; <strong>states:</strong> ';
  for (const [k, v] of Object.entries(STATES_LEGEND)) {
    html += `<span class="item"><span class="swatch" style="background:${v.color}"></span>${v.symbol} ${k}</span>`;
  }
  html += ' &nbsp; <strong>groups:</strong> ';
  for (let g = 1; g <= 8; g++) {
    html += `<span class="item">${GROUP_NAMES[g]?.symbol || ''} ${g}:${GROUP_NAMES[g]?.name || ''}</span>`;
  }
  leg.innerHTML = html;
}

function renderTable() {
  const container = document.getElementById('table-view');

  let html = '<div class="period-table">';
  html += '<div></div>';
  for (let g = 1; g <= 8; g++) {
    html += `<div class="group-header">${GROUP_NAMES[g]?.symbol || ''} ${g}<br><span style="font-size:7px;color:var(--dim)">${GROUP_NAMES[g]?.name || ''}</span></div>`;
  }

  for (let p = 1; p <= 7; p++) {
    const pInfo = PERIOD_NAMES[p];
    html += `<div class="period-label" style="color:${pInfo?.color || '#888'}">${p} ${pInfo?.name || ''}</div>`;

    for (let g = 1; g <= 8; g++) {
      const cell = elements.filter(e => e.period === p && e.group === g);
      if (cell.length === 0) {
        html += '<div></div>';
      } else {
        html += '<div style="display:flex;flex-direction:column;gap:2px">';
        for (const el of cell) {
          html += elementCard(el);
        }
        html += '</div>';
      }
    }
  }
  html += '</div>';
  container.innerHTML = html;
}

function elementCard(el) {
  return `<div class="el-card ${el.state}" data-period="${el.period}" data-z="${el.Z}" onclick="showDetail(${el.Z})">
    <span class="z">${el.Z}</span>
    <span class="sym">${el.sym}</span>
    <span class="name">${el.name}</span>
    <span class="mass">${el.mass > 0 ? (el.mass >= 1000 ? Math.round(el.mass / 1000) + 'K' : el.mass) : '�'}</span>
    <span class="musical">${el.musical}</span>
  </div>`;
}

function renderCards() {
  const container = document.getElementById('card-view');
  const sorted = [...elements];

  if (currentSort === 'Z') sorted.sort((a, b) => a.Z - b.Z);
  else if (currentSort === 'mass') sorted.sort((a, b) => b.mass - a.mass);
  else if (currentSort === 'period') sorted.sort((a, b) => a.period - b.period || a.group - b.group);
  else if (currentSort === 'group') sorted.sort((a, b) => a.group - b.group || a.period - b.period);
  else if (currentSort === 'state') {
    const order = { solid: 0, liquid: 1, gas: 2, dead: 3 };
    sorted.sort((a, b) => (order[a.state] ?? 9) - (order[b.state] ?? 9));
  }
  else if (currentSort === 'musical') sorted.sort((a, b) => (a.musical || 'Z').localeCompare(b.musical || 'Z'));
  else if (currentSort === 'name') sorted.sort((a, b) => a.name.localeCompare(b.name));
  else if (currentSort === 'locale') sorted.sort((a, b) => a.locale.localeCompare(b.locale));

  let html = '<div class="card-grid">';
  for (const el of sorted) {
    html += `<div class="big-card ${el.state}" data-period="${el.period}" onclick="showDetail(${el.Z})">
      <div class="top"><span class="z">${el.Z}</span><span class="sym">${el.sym}</span></div>
      <div class="name">${el.name}</div>
      <div class="desc">${el.desc}</div>
      <div class="meta">
        <span>P${el.period}</span><span>G${el.group}</span><span>${el.state}</span>
        <span>${el.musical}</span><span>${el.locale}</span>
        <span>${el.mass > 0 ? (el.mass >= 1000 ? Math.round(el.mass / 1000) + 'K' : el.mass + 'B') : '�'}</span>
      </div>
    </div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function showDetail(z) {
  const el = elements.find(e => e.Z === z);
  if (!el) return;
  const d = document.getElementById('detail');
  d.querySelector('.z').textContent = '#' + el.Z;
  d.querySelector('.sym').textContent = el.sym;
  d.querySelector('.sym').style.color = PERIOD_NAMES[el.period]?.color || '#ccc';
  d.querySelector('.full-name').textContent = el.name;
  d.querySelector('.desc').textContent = el.desc;

  const pInfo = PERIOD_NAMES[el.period] || {};
  const gInfo = GROUP_NAMES[el.group] || {};

  d.querySelector('.props').innerHTML = `
    <div><span class="label">period</span><span class="value" style="color:${pInfo.color || '#ccc'}">${el.period}: ${pInfo.name || ''} � ${pInfo.desc || ''}</span></div>
    <div><span class="label">group</span><span class="value">${gInfo.symbol || ''} ${el.group}: ${gInfo.name || ''} � ${gInfo.desc || ''}</span></div>
    <div><span class="label">state</span><span class="value">${STATES_LEGEND[el.state]?.symbol || ''} ${el.state} � ${STATES_LEGEND[el.state]?.meaning || ''}</span></div>
    <div><span class="label">mass</span><span class="value">${el.mass > 0 ? el.mass.toLocaleString() + ' bytes' : '�'}</span></div>
    <div><span class="label">musical</span><span class="value">${el.musical}</span></div>
    <div><span class="label">locale</span><span class="value">${el.locale}</span></div>
    <div><span class="label">era</span><span class="value">${el.era}</span></div>
    <div><span class="label">type</span><span class="value">${el.type}</span></div>
  `;
  d.querySelector('.musical-note').textContent = el.musical !== '�' ? '? ' + el.musical : '';
  d.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
}

document.getElementById('detail').addEventListener('click', e => {
  if (e.target === document.getElementById('detail')) closeDetail();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

document.querySelector('.view-btns').addEventListener('click', e => {
  const btn = e.target.closest('button[data-view]');
  if (!btn) return;
  currentView = btn.dataset.view;
  document.querySelectorAll('.view-btns button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('table-view').classList.toggle('active', currentView === 'table');
  document.getElementById('card-view').classList.toggle('active', currentView === 'cards');
});

document.querySelector('.sort-btns').addEventListener('click', e => {
  const btn = e.target.closest('button[data-sort]');
  if (!btn) return;
  currentSort = btn.dataset.sort;
  document.querySelectorAll('.sort-btns button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
});

load();
</script>
