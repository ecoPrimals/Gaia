<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAIA — Room Face</title>
<style>
/* GAIA UNIFIED DESIGN SYSTEM — Organic Dark
   The living organism. Dark with warm accents.
   Every page uses this. No inline styles. */

:root {
  --bg:         #08090b;
  --bg-raised:  #0f1114;
  --bg-card:    #141719;
  --bg-hover:   #1a1d21;
  --border:     #1e2228;
  --border-glow:#2a3040;

  --text:       #e0dcd6;
  --text-muted: #8a857e;
  --text-dim:   #5a5650;
  --text-bright:#f5f0e8;

  --amber:      #d4a574;
  --amber-dim:  #7a5f3e;
  --amber-glow: #d4a57420;
  --green:      #5aad72;
  --green-dim:  #2d5e3a;
  --green-glow: #5aad7220;
  --blue:       #5b8fd4;
  --red:        #d45b5b;
  --purple:     #9b7ed4;

  --radius:     6px;
  --radius-lg:  12px;
  --gap:        16px;
  --gap-lg:     24px;

  --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

body { min-height: 100vh; }

/* ═══ TYPOGRAPHY ═══ */
h1, h2, h3, h4 { color: var(--text-bright); font-weight: 500; line-height: 1.25; }
h1 { font-size: 2rem; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; }
h4 { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 400; }

p { color: var(--text); margin-bottom: 0.75em; }
a { color: var(--amber); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--text-bright); }

code, pre { font-family: var(--font-mono); }
code { background: var(--bg-raised); padding: 2px 6px; border-radius: 3px; font-size: 0.88em; color: var(--amber); }
pre { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; font-size: 0.85rem; }

/* ═══ LAYOUT ═══ */
.gaia-shell { max-width: 1200px; margin: 0 auto; padding: 0 var(--gap); }
.gaia-hero { padding: 48px 0 32px; text-align: center; }
.gaia-hero h1 { margin-bottom: 8px; }
.gaia-hero .subtitle { color: var(--text-muted); font-size: 1.05rem; }

/* ═══ NAV ═══ */
.gaia-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.gaia-nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 var(--gap);
  display: flex; align-items: center; gap: var(--gap);
  height: 52px; overflow-x: auto;
}
.gaia-nav-brand {
  font-weight: 500; color: var(--amber); font-size: 1.1rem;
  white-space: nowrap; margin-right: 8px;
}
.gaia-nav a {
  color: var(--text-muted); font-size: 0.88rem; white-space: nowrap;
  padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s;
}
.gaia-nav a:hover, .gaia-nav a.active { color: var(--text); border-bottom-color: var(--amber); }

/* ═══ CARDS ═══ */
.gaia-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap); }
.gaia-grid-sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.gaia-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--gap-lg);
  transition: border-color 0.3s, transform 0.2s;
  text-decoration: none; display: block;
}
.gaia-card:hover {
  border-color: var(--amber-dim); transform: translateY(-2px);
}
.gaia-card h3 { margin-bottom: 6px; font-size: 1.05rem; }
.gaia-card p { color: var(--text-muted); font-size: 0.88rem; margin: 0; }
.gaia-card .tag {
  display: inline-block; font-size: 0.75rem; padding: 2px 8px;
  border-radius: 99px; margin-top: 10px;
  background: var(--amber-glow); color: var(--amber); border: 1px solid var(--amber-dim);
}
.gaia-card .tag.green { background: var(--green-glow); color: var(--green); border-color: var(--green-dim); }

/* ═══ SECTION ═══ */
.gaia-section { padding: 32px 0; }
.gaia-section h2 { margin-bottom: var(--gap); }
.gaia-section h4 { margin-bottom: 12px; }
.gaia-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

/* ═══ PULSE DOT ═══ */
.pulse-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); margin-right: 6px;
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 4px var(--green-glow); }
  50% { box-shadow: 0 0 12px var(--green); }
}

/* ═══ STATS ═══ */
.gaia-stats { display: flex; gap: var(--gap-lg); flex-wrap: wrap; justify-content: center; padding: 16px 0; }
.gaia-stat { text-align: center; }
.gaia-stat .value { font-size: 1.8rem; font-weight: 500; color: var(--amber); font-family: var(--font-mono); }
.gaia-stat .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ═══ FOOTER ═══ */
.gaia-footer {
  border-top: 1px solid var(--border); padding: 32px 0;
  margin-top: 48px; color: var(--text-muted); font-size: 0.85rem;
}
.gaia-footer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--gap-lg); }
.gaia-footer h4 { margin-bottom: 8px; font-size: 0.8rem; }
.gaia-footer a { display: block; padding: 3px 0; color: var(--text-dim); font-size: 0.82rem; }
.gaia-footer a:hover { color: var(--amber); }
.gaia-footer-bottom { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; color: var(--text-dim); }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 640px) {
  h1 { font-size: 1.5rem; }
  .gaia-grid { grid-template-columns: 1fr; }
  .gaia-stats { gap: var(--gap); }
  .gaia-stat .value { font-size: 1.3rem; }
  .gaia-nav-inner { gap: 12px; }
}

/* ═══ UTILITIES ═══ */
.text-amber { color: var(--amber); }
.text-green { color: var(--green); }
.text-blue { color: var(--blue); }
.text-red { color: var(--red); }
.text-muted { color: var(--text-muted); }
.text-dim { color: var(--text-dim); }
.text-center { text-align: center; }
.mono { font-family: var(--font-mono); }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 16px; }
.mb-1 { margin-bottom: 8px; }
.mb-2 { margin-bottom: 16px; }

</style>
</head>
<body>
<nav class="gaia-nav"><div class="gaia-nav-inner"><a href="/" class="gaia-nav-brand">gaia</a><a href="/#organism">Organism</a><a href="/#investigation">Investigation</a><a href="/#knowledge">Knowledge</a><a href="/#infrastructure">Infrastructure</a><a href="https://nestgate.io">NestGate</a></div></nav>
<main class="gaia-shell" style="padding-top:24px;padding-bottom:48px">
<div class="grid">
  <div class="panel" id="identity">
    <div>
      <h1 class="heartbeat">🟢 GAIA</h1>
      <div class="subtitle">ecoPrimals Organism — eastGate Brain</div>
      <div class="subtitle" id="uptime"></div>
    </div>
    <div class="clock" id="clock"></div>
    <div>
      <div id="wave" style="font-size:1.5em;color:#0a0"></div>
      <div id="beats" style="color:#070"></div>
    </div>
  </div>

  <div class="panel">
    <h2>🔊 Ear — Klein Triad</h2>
    <div class="triad-viz">
      <div>
        <div class="triad-bar alpha" id="bar-alpha" style="height:30%;background:#f44"></div>
        <div class="label" style="text-align:center;color:#f88">α mach</div>
      </div>
      <div>
        <div class="triad-bar beta" id="bar-beta" style="height:30%;background:#4af"></div>
        <div class="label" style="text-align:center;color:#8af">β media</div>
      </div>
      <div>
        <div class="triad-bar gamma" id="bar-gamma" style="height:30%;background:#4f4"></div>
        <div class="label" style="text-align:center;color:#8f8">γ human</div>
      </div>
    </div>
    <div id="triad-state" style="text-align:center;font-size:1.2em;margin-top:8px"></div>
    <div id="ear-source" style="text-align:center;color:#070;margin-top:4px"></div>
  </div>

  <div class="panel">
    <h2>🌐 Mesh Health</h2>
    <div id="gates"></div>
    <div style="margin-top:12px">
      <h2>📺 Room Faces</h2>
      <div id="faces"></div>
    </div>
  </div>

  <div class="panel">
    <h2>🧠 Compute</h2>
    <div id="cpu-bar-label">CPU</div>
    <div class="bar"><div class="bar-fill green" id="cpu-bar" style="width:0%"></div></div>
    <div id="ram-bar-label">RAM</div>
    <div class="bar"><div class="bar-fill green" id="ram-bar" style="width:0%"></div></div>
    <div id="gpu-label" style="margin-top:8px;color:#070">GPU</div>
    <div class="bar"><div class="bar-fill amber" id="gpu-bar" style="width:0%"></div></div>
    <div id="models" style="color:#070;margin-top:8px"></div>
  </div>

  <div class="panel">
    <h2>📡 Organism</h2>
    <div id="primals" style="font-size:0.9em"></div>
  </div>
</div>

<script>
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', {hour12: false});
  setTimeout(updateClock, 1000);
}
updateClock();

async function fetchPulse() {
  try {
    const r = await fetch('/pulse');
    const p = await r.json();

    // Identity
    document.getElementById('wave').textContent = 'Wave ' + (p.wave || '?');
    document.getElementById('beats').textContent = (p.beats || 0).toLocaleString() + ' beats | ' + (p.breaths || 0).toLocaleString() + ' breaths';
    const uptH = ((Date.now()/1000 - (p.boot_epoch || Date.now()/1000)) / 3600).toFixed(1);
    document.getElementById('uptime').textContent = 'Uptime: ' + uptH + 'h';

    // Ears / Klein triad
    const ears = p.ears || {};
    const kt = ears.klein_triad || {};
    const alpha = kt['α_machinery'] || 0;
    const beta = kt['β_media'] || 0;
    const gamma = kt['γ_human'] || 0;
    const dev = kt.deviation || 0;
    document.getElementById('bar-alpha').style.height = Math.min(alpha*10, 100) + '%';
    document.getElementById('bar-beta').style.height = Math.min(beta*10, 100) + '%';
    document.getElementById('bar-gamma').style.height = Math.min(gamma*10, 100) + '%';
    const atRest = kt.at_rest;
    document.getElementById('triad-state').innerHTML = atRest ?
      '<span style="color:#0f0">● AT REST</span> (Δ=' + dev.toFixed(2) + ')' :
      '<span style="color:#f80">⚠ ATTENTION</span> (Δ=' + dev.toFixed(2) + ')';
    const chorus = ears.chorus || {};
    document.getElementById('ear-source').textContent = 'Dominant: ' + (chorus.dominant_source || ears.cochlea?.state || '?');

    // Room faces
    const rf = p.room_faces || {};
    let fhtml = '';
    for (const [k, v] of Object.entries(rf)) {
      if (k === 'face_count' || k === 'last_scan') continue;
      if (typeof v === 'object' && v.name) {
        const alive = v.reachable;
        fhtml += '<div><span class="face-dot ' + (alive ? 'alive' : 'dead') + '"></span>' +
                 v.name + (v.power ? ' [' + v.power + ']' : '') + '</div>';
      }
    }
    fhtml += '<div style="color:#070;margin-top:4px">' + (rf.face_count || 0) + ' faces online</div>';
    document.getElementById('faces').innerHTML = fhtml;

    // Mesh / gates
    const body = p.body || {};
    const gates = body.gates || {};
    let ghtml = '';
    for (const [name, info] of Object.entries(gates)) {
      const alive = info?.alive || info?.reachable;
      ghtml += '<div><span class="face-dot ' + (alive ? 'alive' : 'dead') + '"></span>' + name + '</div>';
    }
    if (!ghtml) {
      ghtml = '<div style="color:#070">Gate data loading...</div>';
    }
    document.getElementById('gates').innerHTML = ghtml;

    // Compute
    const cpu = p.cpu_pct || p.load_pct || 0;
    const ram = p.ram_pct || 0;
    document.getElementById('cpu-bar').style.width = cpu + '%';
    document.getElementById('cpu-bar-label').textContent = 'CPU: ' + cpu.toFixed(1) + '%';
    document.getElementById('ram-bar').style.width = ram + '%';
    document.getElementById('ram-bar-label').textContent = 'RAM: ' + ram.toFixed(1) + '%';

    // Primals
    const primals = p.primals || p.services || {};
    let phtml = '';
    if (typeof primals === 'object') {
      for (const [k, v] of Object.entries(primals)) {
        if (typeof v === 'number' || typeof v === 'string') {
          phtml += '<div>' + k + ': ' + v + '</div>';
        }
      }
    }
    document.getElementById('primals').innerHTML = phtml || '<div>Primals: 17 compiled</div>';

  } catch(e) {
    console.error('Pulse fetch error:', e);
  }
  setTimeout(fetchPulse, 5000);
}
fetchPulse();
</script>
</main>
<footer class="gaia-footer"><div class="gaia-shell"><div class="gaia-footer-bottom"><p><a href="/">Gaia</a> &mdash; sovereign living digital organism &mdash; <a href="https://primals.eco">primals.eco</a></p></div></div></footer>
</body>
</html>
