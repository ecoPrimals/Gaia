<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas — the stories, pinned above the places they are about</title>
<meta name="description" content="A globe of the public record: every story pinned above the building, the city or the state it is about. Lansing, Detroit, Michigan, and the Library above the Library of Congress. Sun and moon stand where they really are.">
<!--
  THE ATLAS. One globe, drawn here on a canvas from outlines kept in this repo - nothing is fetched from anyone else,
  no map tiles, no trackers. Two files feed it, both made by tools/atlas_build.py:
    /static/atlas-earth.json   coastlines, lakes, borders
    /static/atlas-pins.json    the pins: public buildings and offices, and the library's four shelves-by-place.
                               What a pin says is the published page's own description. No homes are pinned.
                               The pins marked from: sporePrint are the offices and campuses the sporePrint pages
                               are written to or build on (Valve in Bellevue, the chip makers, the labs, the schools).
  Each pin floats above its place. Pins that stand too close to tell apart are drawn as one mark with a count;
  pressing it goes closer until they come apart.

  THE SKY is worked out from the clock alone, in /static/sky.js (the HUD reads the same file, so both show one sky):
  the place the sun stands straight over, the place the moon stands straight over, and the night. It is held against an
  independent ephemeris from 700 BC to now - how closely is said at the top of that file.

  TIME is travelled like the ground is. The keys at the foot step the clock by a minute, an hour, a day, a moon, a year
  or a century; a date can be typed; "scroll = time" (or Shift held) makes the wheel turn the clock instead of coming
  closer. Dates before 15 October 1582 are in the old calendar, the one the annals count in. A pressed pin shows the
  sky from that place at that time: how high the sun and the moon stand, and the moon drawn as it is seen from there.
  MOMENTS (atlas-pins.json: moments, backscatter) are times with a pin to stand on - Easter sunrise from the monks'
  rock, the eclipses the annals and Ptolemy record, and the years of sporePrint's own backscatter timeline.

  THE CLOCK. Looking straight down on the north pole the earth is a 24-hour dial: midnight UT at the top, noon at the
  foot. The green mark is the UTC clock; the gold hand is the sun itself, on the meridian it stands over (through the
  year it runs up to 16 minutes ahead of the clock or behind it); the edge of the night is square to it. The silver
  hand is the moon. Every open atlas, and the HUD, keep one clock between them: travel in one and the others follow.

  THE CORE. Three plumb lines - straight down from where you stand, straight down from under the sun, straight down
  from under the moon - meet in one point: the centre of the earth. The length of any one of them is the unit this
  page measures in: 1.00 = one earth radius = 6,371 km. The green line is yours, split where it crosses the outer
  core (0.55) and the inner core (0.19). The axis runs pole to pole through the same point.

  WHERE YOU STAND is yours. It is asked of your own device only when you press the key, it is used on this page
  only, and it is not sent, logged or stored anywhere. You can also just point at the globe.

  THE TRIANGLE. Three pins to measure from - home (the Lansing shelf: the town, nothing finer), Michigan State,
  and Wayne County's seat in Detroit - and a far body to sight on: Meta's office in Dublin and the monks' rock of
  Skellig Michael. Which pins they are is said in atlas-pins.json (triangle); every number shown is worked out here
  from where the pins stand: the sides and the long lines as the shortest way over the ground, the angle each line
  opens at the core, the way each line sets out, how high the sun stands over each mark now, and when it next
  stands due south of each. THE TRIANGLE, WIDENED (triangle.wide) is three more marks - Pictured Rocks, Yellowstone,
  Alexandria - each a project the house stands at that place. Its three angles add to more than 180 degrees: the
  ground is round, and that sum says by how much.

  THE GRAPH. sporePrint serves its own graph of what it is made of. Every node of it hangs on a pin (atlas-pins.json:
  a pin's graph, and graph.lines for the lines whose two ends hang on different pins). The backscatter is the path
  through the pins that sporePrint's backscatter page gives, year by year.

  The address carries the pin (#pin=dykema), a view (#go=wayne, #go=clock), the triangle (#tri), a moment (#m=easter-824)
  and the time (&t=0824-04-24T05:31), so a place at a time can be linked.
  /static/atlas.html?face is the globe alone, as a clock face, for the middle of the HUD: no keys, no panel. A pressed
  pin is told to the page that holds the frame; the wheel turns the clock.
-->
<style>
:root{--ink:#c8d6e5;--dim:#8395a7;--low:#576574;--bg:#06080b;--line:#1c242d;--green:#2ecc71;--gold:#d4af37}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 'Courier New',monospace;overflow:hidden}
#globe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#globe.drag{cursor:grabbing}
#globe.point{cursor:crosshair}
#globe:focus-visible{outline:1px solid var(--low);outline-offset:-3px}
a{color:#7fdbda}
button{font:inherit;color:var(--ink);background:rgba(10,14,18,.86);border:1px solid var(--line);border-radius:99px;padding:3px 11px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--dim);outline:none}
button[aria-pressed=true]{color:#06080b;background:var(--green);border-color:var(--green)}
#top{position:fixed;left:10px;top:8px;right:10px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#top h1{font:bold 13px 'Courier New',monospace;letter-spacing:.14em;margin:0 4px 0 0;color:var(--ink)}
#top .what{color:var(--low);font-size:11px;margin-right:6px}
#top .gap{flex:1 1 20px;pointer-events:none}
.framed #top h1,.framed #top .what,.framed #home{display:none}
@media (max-width:1500px){#top .what{display:none}}
#panel{position:fixed;right:10px;top:44px;width:min(370px,calc(100vw - 20px));max-height:calc(100vh - 132px);overflow:auto;background:rgba(8,11,15,.93);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px}
#panel h2{font:bold 13px 'Courier New',monospace;margin:0 0 2px;color:#f5f6fa;line-height:1.35}
#panel .where{color:var(--dim);font-size:11px;margin:0 0 6px}
#panel .say{margin:0 0 8px;font-size:12px}
#panel .count{color:var(--low);font-size:11px;margin:0 0 6px}
#panel ul{list-style:none;margin:0 0 6px;padding:0}
#panel li{margin:0;padding:3px 0;border-top:1px solid var(--line);font-size:12px}
#panel li a{text-decoration:none}
#panel li a:hover,#panel li a:focus-visible{text-decoration:underline;outline:none}
#panel li .tag{color:var(--low);font-size:10px;margin-left:6px}
#panel .pin+.pin{margin-top:14px;padding-top:10px;border-top:2px solid var(--line)}
#panel .row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
#panel .idx button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;border-radius:6px;border-color:transparent;background:none;padding:2px 4px}
#panel .idx button:hover,#panel .idx button:focus-visible{background:rgba(255,255,255,.05)}
#panel .idx .dot{flex:0 0 8px;height:8px;border-radius:50%;align-self:center}
#panel .idx .n{margin-left:auto;color:var(--low);font-size:11px}
#panel .lead{color:var(--dim);font-size:12px;margin:0 0 8px}
#panel .note{color:var(--low);font-size:10.5px;margin:8px 0 0}
#panel .tri h2{color:var(--gold)}
#panel .tri h3{font:bold 11px 'Courier New',monospace;letter-spacing:.08em;color:var(--dim);margin:10px 0 2px;text-transform:uppercase}
#panel .tri li{display:flex;gap:8px;align-items:baseline}
#panel .tri li .v{margin-left:auto;color:var(--ink);text-align:right;white-space:nowrap}
#panel .tri li .k{color:var(--dim)}
#panel .tri li.in{border-top:0;padding:0 0 3px 12px}
#panel .tri .idx .n{color:var(--dim)}
#panel .stood{color:var(--dim);font-size:11px;margin:0 0 6px}
#panel .skybox{display:flex;gap:10px;align-items:center;margin:0 0 8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
#panel .skybox canvas{flex:0 0 56px;width:56px;height:56px}
#panel .skybox p{margin:0;font-size:11px;color:var(--dim)}
#panel .skybox b{color:var(--ink);font-weight:normal}
#panel .moment{margin:0 0 10px;padding:6px 8px;border:1px solid rgba(212,175,55,.45);border-radius:8px}
#panel .moment h3{font:bold 12px 'Courier New',monospace;color:var(--gold);margin:0 0 2px}
#panel .moment p{margin:0;font-size:11px;color:var(--dim)}
#panel .hung h3{font:bold 11px 'Courier New',monospace;letter-spacing:.08em;color:var(--dim);margin:8px 0 2px;text-transform:uppercase}
#panel .hung li{display:flex;gap:8px;align-items:baseline}
#panel .hung li .n{margin-left:auto;color:var(--low);font-size:11px;white-space:nowrap}
#foot{position:fixed;left:10px;bottom:8px;right:10px;pointer-events:none}
#time{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 4px;max-width:calc(100vw - 410px)}
#time>*{pointer-events:auto}
#time select,#time input{font:inherit;color:var(--ink);background:rgba(10,14,18,.86);border:1px solid var(--line);border-radius:99px;padding:3px 9px;max-width:100%}
#time select:hover,#time input:hover,#time select:focus-visible,#time input:focus-visible{border-color:var(--dim);outline:none}
#time input{width:15em}
#time #t-moment{max-width:11em}
#time input.no{border-color:#ff5c6c}
#time .away{color:var(--gold);font-size:11px;text-shadow:0 0 4px #000,0 0 2px #000;pointer-events:none}
#sky{margin:0;color:var(--dim);font-size:11px;pointer-events:none;text-shadow:0 0 4px #000,0 0 2px #000}
#sky b{color:var(--ink);font-weight:normal}
#sky .g{color:var(--green)}
#sky .o{color:var(--gold)}
/* the face: the globe alone, for the middle of the HUD */
.face,.face body{background:transparent}
.face #top,.face #panel,.face #foot{display:none}
.face #globe:focus-visible{outline:none}
@media (max-width:720px){
  #panel{left:10px;right:10px;top:auto;bottom:98px;width:auto;max-height:40vh}

  #time{flex-wrap:nowrap;overflow-x:auto;max-width:none;scrollbar-width:none}
  #time::-webkit-scrollbar{display:none}
  #time>*{flex:0 0 auto}

}
/* a watch face (the same line the HUD draws: narrower than 280): the globe alone in the middle. The keys and the
   sky line are put away; the panel stays away until a pin is pressed, then it rises over the lower half. */
@media (max-width:279px){
  #top,#foot{display:none}
  #panel{display:none;left:9%;right:9%;bottom:9%;top:auto;width:auto;max-height:52vh;padding:6px 8px;font-size:10px}
  .picked #panel{display:block}
  #panel h2{font-size:11px} #panel li,#panel .say{font-size:10px}

</style>
</head>
<body>
<canvas id="globe" tabindex="0" role="application" aria-label="A globe. Drag to turn it, scroll or pinch to come closer, arrow keys and plus and minus work too. The stories are listed in the panel."></canvas>
<div id="top">
  <a id="home" href="/" style="text-decoration:none;color:#5aad72">gaia</a>
  <h1>ATLAS</h1><span class="what">the stories, pinned above the places they are about</span>
  <button type="button" data-go="world">world</button>
  <button type="button" data-go="michigan">Michigan</button>
  <button type="button" data-go="lansing">Lansing</button>
  <button type="button" data-go="detroit">Detroit</button>
  <button type="button" data-go="wayne">Wayne County</button>
  <button type="button" data-go="ireland">Ireland</button>
  <button type="button" data-go="library">the Library</button>
  <span class="gap"></span>
  <button type="button" id="k-tri" aria-pressed="false" title="the triangle: home, Michigan State and Wayne County, with the far body in Ireland — measured">triangle</button>
  <button type="button" id="k-core" aria-pressed="false" title="see through to the core: the three plumb lines, the axis, and the one unit">core</button>
  <button type="button" id="k-clock" aria-pressed="false" title="look straight down on the north pole: the earth as a 24-hour dial, the sun its hand, the edge of the night square to it">clock</button>
  <button type="button" id="k-graph" aria-pressed="false" title="sporePrint’s own graph, hung on the pins, and the backscatter’s path through them">graph</button>
  <button type="button" id="k-day" aria-pressed="false" title="let a day pass in a minute, to watch the night go round">a day a minute</button>
</div>
<aside id="panel" aria-live="polite"></aside>
<div id="foot">
  <div id="time" role="group" aria-label="the clock: travel in time">
    <button type="button" id="t-now" aria-pressed="true" title="the clock as it stands now (key: n)">now</button>
    <button type="button" id="t-back" title="one step back (key: ,)" aria-label="one step back">◀</button>
    <select id="t-unit" title="how long one step is" aria-label="how long one step is">
      <option value="60000">a minute</option><option value="3600000" selected>an hour</option><option value="86400000">a day</option>
      <option value="2551442878">a moon</option><option value="31556952000">a year</option><option value="3155695200000">a century</option>
    </select>
    <button type="button" id="t-fwd" title="one step on (key: .)" aria-label="one step on">▶</button>
    <input id="t-at" type="text" spellcheck="false" autocomplete="off" placeholder="go to: 824-04-24 05:30" title="a date to go to, in UT: year-month-day hour:minute. Before 15 October 1582 it is read in the old calendar. A year alone will do." aria-label="a date to go to">
    <select id="t-moment" title="moments to travel to: a time, and a pin to stand on" aria-label="moments to travel to"><option value="">a moment…</option></select>
    <button type="button" id="t-scroll" aria-pressed="false" title="let the wheel turn the clock instead of coming closer (holding Shift does the same)">scroll = time</button>
    <span class="away" id="t-away"></span>
  </div>
  <p id="sky"></p>
</div>
<script src="/static/sky.js?v=1"></script>

  function km(deg) { var k = deg * DEG * KM; return (k < 100 ? k.toFixed(1) : Math.round(k).toLocaleString()) + ' km'; }

  function setTriangle() {                                            // the triangle names pins; it stands only if every one of them does

  function setGraph(on) { graphOn = !!on; kGraph.setAttribute('aria-pressed', graphOn ? 'true' : 'false'); if (graphOn && tri) setTri(false); else { fill(); dirty = true; } }
