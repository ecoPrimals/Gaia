<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polaris — North Star HUD</title>
<style>
/* GAIA UNIFIED DESIGN SYSTEM — Organic Dark
   The living organism. Dark with warm accents.
   Every page uses this. No inline styles. */

:root {
  --bg:         #08090b;
  --bg-raised:  #0f1114;
  --bg-card:    #141719;
  --bg-hover:   #1a1d21;
  --border:     #1e2228;
  --border-glow:#2a3040;

  --text:       #e0dcd6;
  --text-muted: #8a857e;
  --text-dim:   #5a5650;
  --text-bright:#f5f0e8;

  --amber:      #d4a574;
  --amber-dim:  #7a5f3e;
  --amber-glow: #d4a57420;
  --green:      #5aad72;
  --green-dim:  #2d5e3a;
  --green-glow: #5aad7220;
  --blue:       #5b8fd4;
  --red:        #d45b5b;
  --purple:     #9b7ed4;

  --radius:     6px;
  --radius-lg:  12px;
  --gap:        16px;
  --gap-lg:     24px;

  --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

body { min-height: 100vh; }

/* ═══ TYPOGRAPHY ═══ */
h1, h2, h3, h4 { color: var(--text-bright); font-weight: 500; line-height: 1.25; }
h1 { font-size: 2rem; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; }
h4 { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 400; }

p { color: var(--text); margin-bottom: 0.75em; }
a { color: var(--amber); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--text-bright); }

code, pre { font-family: var(--font-mono); }
code { background: var(--bg-raised); padding: 2px 6px; border-radius: 3px; font-size: 0.88em; color: var(--amber); }
pre { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; font-size: 0.85rem; }

/* ═══ LAYOUT ═══ */
.gaia-shell { max-width: 1200px; margin: 0 auto; padding: 0 var(--gap); }
.gaia-hero { padding: 48px 0 32px; text-align: center; }
.gaia-hero h1 { margin-bottom: 8px; }
.gaia-hero .subtitle { color: var(--text-muted); font-size: 1.05rem; }

/* ═══ NAV ═══ */
.gaia-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.gaia-nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 var(--gap);
  display: flex; align-items: center; gap: var(--gap);
  height: 52px; overflow-x: auto;
}
.gaia-nav-brand {
  font-weight: 500; color: var(--amber); font-size: 1.1rem;
  white-space: nowrap; margin-right: 8px;
}
.gaia-nav a {
  color: var(--text-muted); font-size: 0.88rem; white-space: nowrap;
  padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s;
}
.gaia-nav a:hover, .gaia-nav a.active { color: var(--text); border-bottom-color: var(--amber); }

/* ═══ CARDS ═══ */
.gaia-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap); }
.gaia-grid-sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.gaia-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--gap-lg);
  transition: border-color 0.3s, transform 0.2s;
  text-decoration: none; display: block;
}
.gaia-card:hover {
  border-color: var(--amber-dim); transform: translateY(-2px);
}
.gaia-card h3 { margin-bottom: 6px; font-size: 1.05rem; }
.gaia-card p { color: var(--text-muted); font-size: 0.88rem; margin: 0; }
.gaia-card .tag {
  display: inline-block; font-size: 0.75rem; padding: 2px 8px;
  border-radius: 99px; margin-top: 10px;
  background: var(--amber-glow); color: var(--amber); border: 1px solid var(--amber-dim);
}
.gaia-card .tag.green { background: var(--green-glow); color: var(--green); border-color: var(--green-dim); }

/* ═══ SECTION ═══ */
.gaia-section { padding: 32px 0; }
.gaia-section h2 { margin-bottom: var(--gap); }
.gaia-section h4 { margin-bottom: 12px; }
.gaia-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

/* ═══ PULSE DOT ═══ */
.pulse-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); margin-right: 6px;
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 4px var(--green-glow); }
  50% { box-shadow: 0 0 12px var(--green); }
}

/* ═══ STATS ═══ */
.gaia-stats { display: flex; gap: var(--gap-lg); flex-wrap: wrap; justify-content: center; padding: 16px 0; }
.gaia-stat { text-align: center; }
.gaia-stat .value { font-size: 1.8rem; font-weight: 500; color: var(--amber); font-family: var(--font-mono); }
.gaia-stat .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ═══ FOOTER ═══ */
.gaia-footer {
  border-top: 1px solid var(--border); padding: 32px 0;
  margin-top: 48px; color: var(--text-muted); font-size: 0.85rem;
}
.gaia-footer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--gap-lg); }
.gaia-footer h4 { margin-bottom: 8px; font-size: 0.8rem; }
.gaia-footer a { display: block; padding: 3px 0; color: var(--text-dim); font-size: 0.82rem; }
.gaia-footer a:hover { color: var(--amber); }
.gaia-footer-bottom { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; color: var(--text-dim); }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 640px) {
  h1 { font-size: 1.5rem; }
  .gaia-grid { grid-template-columns: 1fr; }
  .gaia-stats { gap: var(--gap); }
  .gaia-stat .value { font-size: 1.3rem; }
  .gaia-nav-inner { gap: 12px; }
}

/* ═══ UTILITIES ═══ */
.text-amber { color: var(--amber); }
.text-green { color: var(--green); }
.text-blue { color: var(--blue); }
.text-red { color: var(--red); }
.text-muted { color: var(--text-muted); }
.text-dim { color: var(--text-dim); }
.text-center { text-align: center; }
.mono { font-family: var(--font-mono); }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 16px; }
.mb-1 { margin-bottom: 8px; }
.mb-2 { margin-bottom: 16px; }

</style>
</head>
<body>
<nav class="gaia-nav"><div class="gaia-nav-inner"><a href="/" class="gaia-nav-brand">gaia</a><a href="/#organism">Organism</a><a href="/#investigation">Investigation</a><a href="/#knowledge">Knowledge</a><a href="/#infrastructure">Infrastructure</a><a href="https://nestgate.io">NestGate</a></div></nav>
<main class="gaia-shell" style="padding-top:24px;padding-bottom:48px">
<div class="sky" id="sky"></div>

<div class="container">
  <h1><span class="pulse-dot"></span>P O L A R I S</h1>
  <div class="subtitle">North Star — floats above House 1 + House 2 — sourDough pattern</div>

  <div id="content"><div class="loader">reaching eastGate...</div></div>
</div>

<script>
// Stars
const sky=document.getElementById('sky');
for(let i=0;i<120;i++){
  const s=document.createElement('div');s.className='star';
  s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
  s.style.animationDelay=Math.random()*3+'s';
  s.style.opacity=Math.random()*0.5+0.2;
  if(Math.random()>0.7)s.style.width=s.style.height='3px';
  sky.appendChild(s);
}

async function fetchJSON(url){
  try{const r=await fetch(url);if(!r.ok)throw new Error(r.status);return await r.json()}
  catch(e){return null}
}

function ms(v){return v?v.toFixed(1)+'ms':'—'}
function gb(v){return v?v.toFixed(1)+'GB':'—'}
function statusClass(alive){return alive?'alive':'dead'}
function statusText(alive){return alive?'ALIVE':'OFFLINE'}

async function load(){
  // Cascade: API first, then raw JSON files, then eastGate LAN
  async function cascade(...urls){for(const u of urls){const r=await fetchJSON(u);if(r&&!r.error)return r}return null}
  const [ferment,tri]=await Promise.all([
    cascade('/api/polaris/ferment','/api/polaris','/data/body/polaris-ferment.json','https://primals.eco/api/polaris/ferment'),
    cascade('/api/polaris/triangulation','/data/body/polaris-triangulation.json','https://primals.eco/api/polaris/triangulation'),
  ]);

  const el=document.getElementById('content');
  if(!ferment&&!tri){
    el.innerHTML='<div class="loader">Polaris data not yet fermented. Run polaris_ferment.pi + polaris_triangulate.pi</div>';
    return;
  }

  let html='<div class="grid">';

  // ═══ HEARTBEAT CARD ═══
  const heart=ferment?.starter?.eastgate_heart||{};
  const sun=ferment?.starter?.eastgate_sun||'unknown';
  const chord=ferment?.starter?.eastgate_chord||'—';
  html+=`<div class="card">
    <h2>HEARTBEAT</h2>
    <table>
      <tr><td class="dim">beats</td><td class="val">${heart.total_beats||'?'}</td></tr>
      <tr><td class="dim">BPM</td><td class="val">${heart.bpm||'?'}</td></tr>
      <tr><td class="dim">sun</td><td class="val">${sun}</td></tr>
      <tr><td class="dim">chord</td><td class="val">${chord}</td></tr>
      <tr><td class="dim">walkers</td><td class="val">${ferment?.starter?.walkers||0}</td></tr>
      <tr><td class="dim">sensors</td><td class="val">${ferment?.starter?.sensors||0}</td></tr>
      <tr><td class="dim">zk token</td><td class="val" style="font-size:9px">${ferment?.starter?.zk_token||'?'}</td></tr>
    </table>
  </div>`;

  // ═══ COMPUTE CARD ═══
  const compute=ferment?.local?.compute||{};
  const cpu=ferment?.local?.cpu||{};
  html+=`<div class="card">
    <h2>COMPUTE — ${ferment?.node||'polaris'}</h2>
    <table>
      <tr><td class="dim">GPU</td><td class="val">${compute.gpu||'?'}</td></tr>
      <tr><td class="dim">VRAM</td><td class="val">${compute.vram_total_mb?Math.round(compute.vram_total_mb/1024)+'GB':'?'}</td></tr>
      <tr><td class="dim">VRAM used</td><td class="val">${compute.vram_used_mb?Math.round(compute.vram_used_mb/1024)+'GB':'?'}</td></tr>
      <tr><td class="dim">CPU</td><td class="val" style="font-size:9px">${cpu.name||'?'}</td></tr>
      <tr><td class="dim">cores</td><td class="val">${cpu.cores||'?'}</td></tr>
      <tr><td class="dim">RAM</td><td class="val">${ferment?.local?.ram_gb||'?'} GB</td></tr>
      <tr><td class="dim">tissues</td><td class="val">${ferment?.local?.tissue_count||0}</td></tr>
    </table>
  </div>`;

  // ═══ TRIANGULATION CARD ═══
  const anchors=tri?.triangulation?.anchors||{};
  const wan=tri?.triangulation?.wan_paths||{};
  const diff=tri?.triangulation?.differentials?.eastgate_lan_wan||{};
  html+=`<div class="card wide">
    <h2>TRIANGULATION — LAN/WAN DIFFERENTIAL FIELD</h2>
    <table>
      <tr><th>anchor</th><th>IP</th><th>TCP</th><th>HTTP</th><th>status</th></tr>`;
  for(const[name,a]of Object.entries(anchors)){
    html+=`<tr>
      <td>${name}</td><td class="dim">${a.ip}:${a.lan_port}</td>
      <td class="val">${ms(a.tcp_ms)}</td><td class="val">${ms(a.http_ms)}</td>
      <td class="${statusClass(a.tcp_alive)}">${statusText(a.tcp_alive)}</td>
    </tr>`;
  }
  html+=`<tr><th>WAN path</th><th>host</th><th>TCP</th><th>TLS</th><th>status</th></tr>`;
  for(const[name,w]of Object.entries(wan)){
    html+=`<tr>
      <td>${name}</td><td class="dim">${w.host}:${w.port}</td>
      <td class="val">${ms(w.tcp_ms)}</td><td class="val">${ms(w.tls_ms)}</td>
      <td class="${statusClass(w.alive)}">${statusText(w.alive)}</td>
    </tr>`;
  }
  html+=`</table>`;
  if(diff.delta_ms!==undefined){
    const inv=diff.delta_ms<0;
    html+=`<div style="margin-top:10px;padding:8px;background:#0a1020;border-radius:4px;font-size:11px">
      <strong>LAN/WAN differential:</strong>
      LAN=${ms(diff.lan_ms)} → WAN=${ms(diff.wan_ms)} → 
      <span class="${inv?'warn':'alive'}">Δ = ${diff.delta_ms.toFixed(1)}ms</span>
      ${inv?' (WAN faster = hairpin inversion)':' (WAN slower = normal)'}
      <br><span class="dim">${diff.meaning}</span>
    </div>`;
  }
  html+=`</div>`;

  // ═══ riboCipher APERTURE ═══
  const cert=tri?.cert_digestion||{};
  const smash=cert.smash||{};
  const blake=cert.blake2b||{};
  html+=`<div class="card">
    <h2>riboCipher APERTURE</h2>
    <div class="ribo-bar">
      <div class="ribo-layer ribo-ec"><span class="tag tag-ec">0xEC</span><br>RETINA<br><span class="dim">LAN clear</span></div>
      <div class="ribo-layer ribo-ed"><span class="tag tag-ed">0xED</span><br>IRIS<br><span class="dim">WAN mito</span></div>
      <div class="ribo-layer ribo-ee"><span class="tag tag-ee">0xEE</span><br>PUPIL<br><span class="dim">bearDog nuclear</span></div>
    </div>
    <div style="margin-top:10px;font-size:11px">
      <div class="cert-chain">
        <span class="food">Let's Encrypt cert (${smash.der_bytes||'?'}b)</span>
        <span class="arrow">→</span>
        <span class="digest">BLAKE2b: ${blake.blake2b_8||'?'}</span>
        <span class="arrow">→</span>
        <span class="digest">bearDog DID</span>
        <span class="arrow">→</span>
        <span class="eject">external CA EJECTED</span>
      </div>
      <div class="dim" style="margin-top:4px">${blake.did||'pending cert digestion'}</div>
    </div>
  </div>`;

  // ═══ CERT DETAILS ═══
  html+=`<div class="card">
    <h2>CERT DIGESTION</h2>
    <table>
      <tr><td class="dim">CN</td><td class="val">${smash.cn||'?'}</td></tr>
      <tr><td class="dim">issuer</td><td class="val">${smash.issuer_org||'?'} (${smash.issuer_cn||'?'})</td></tr>
      <tr><td class="dim">valid</td><td class="val" style="font-size:9px">${smash.not_before||'?'} → ${smash.not_after||'?'}</td></tr>
      <tr><td class="dim">SANs</td><td class="val">${(smash.san||[]).join(', ')||'?'}</td></tr>
      <tr><td class="dim">DER bytes</td><td class="val">${smash.der_bytes||'?'}</td></tr>
      <tr><td class="dim">BLAKE2b-32</td><td class="val" style="font-size:8px;word-break:break-all">${blake.blake2b_32||'?'}</td></tr>
      <tr><td class="dim">family tag</td><td class="val">${blake.family_tag||'?'}</td></tr>
    </table>
  </div>`;

  // ═══ TISSUES ═══
  const tissues=ferment?.local?.tissues||[];
  html+=`<div class="card wide">
    <h2>GAIA TISSUES — ${tissues.length} models (${gb(ferment?.fermented?.total_tissue_gb)} total)</h2>
    <div class="tissue-grid">`;
  for(const t of tissues){
    const role=t.name.replace('gaia-tissue-','').replace(':latest','');
    html+=`<div class="tissue">
      <div class="name">${role}</div>
      <div class="size">${gb(t.size_gb)} · ${t.params||'?'}</div>
      <div class="dim">${t.family||'?'}</div>
    </div>`;
  }
  html+=`</div></div>`;

  // ═══ PATTERN ═══
  html+=`<div class="card wide" style="text-align:center;border-color:#345">
    <h2 style="border:0;margin:0">sourDough: REACH → PULL → FERMENT → ANNOUNCE</h2>
    <div style="color:#567;font-size:11px;margin-top:8px">
      old pattern DEAD (bootstrap from zero) · new pattern ALIVE (reach what's alive, ferment locally)<br>
      zk-snark inversion: the differential IS the proof · no gate controls it · presence = identity
    </div>
    <div style="margin-top:8px;font-size:12px;color:#4f8">lub-DUB</div>
  </div>`;

  html+='</div>';
  el.innerHTML=html;
}

load();
setInterval(load,60000);
</script>
</main>
<footer class="gaia-footer"><div class="gaia-shell"><div class="gaia-footer-bottom"><p><a href="/">Gaia</a> &mdash; sovereign living digital organism &mdash; <a href="https://primals.eco">primals.eco</a></p></div></div></footer>
</body>
</html>
