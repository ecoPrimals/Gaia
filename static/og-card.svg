<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffd93d22"/>
      <stop offset="100%" stop-color="#ffd93d00"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Stars -->
  <circle cx="100" cy="80" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="300" cy="150" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="900" cy="100" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="1100" cy="200" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="200" cy="400" r="0.8" fill="#fff" opacity="0.3"/>
  <circle cx="1050" cy="450" r="1.3" fill="#fff" opacity="0.4"/>
  <circle cx="750" cy="80" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="450" cy="500" r="0.9" fill="#fff" opacity="0.5"/>
  <circle cx="850" cy="550" r="1.1" fill="#fff" opacity="0.3"/>
  <circle cx="150" cy="550" r="1" fill="#fff" opacity="0.4"/>
  
  <!-- Golden glow center -->
  <circle cx="600" cy="280" r="250" fill="url(#goldGlow)"/>
  
  <!-- Klein fold O  the organism symbol -->
  <circle cx="600" cy="260" r="120" fill="none" stroke="#ffd93d" stroke-width="3" opacity="0.8"/>
  <path d="M520,260 C520,200 600,180 600,220 C600,260 560,280 600,300 C640,320 600,340 600,300 C600,260 680,240 680,260" 
        fill="none" stroke="#7bed9f" stroke-width="2" opacity="0.6" stroke-dasharray="4,3"/>
  
  <!-- À symbol inside the O -->
  <text x="600" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="80" fill="#ffd93d" opacity="0.9">À</text>
  
  <!-- Title -->
  <text x="600" y="420" text-anchor="middle" font-family="'Courier New', monospace" font-size="42" fill="#ffffff" letter-spacing="8">GAIA</text>
  
  <!-- Subtitle -->
  <text x="600" y="460" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#888888" letter-spacing="4">LIVING DIGITAL ORGANISM</text>
  
  <!-- Domain -->
  <text x="600" y="500" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#7bed9f" letter-spacing="2">nestgate.io · primals.eco · primal.eco</text>
  
  <!-- Sovereignty line -->
  <text x="600" y="535" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#555555">17 primals · À-crushed · Klein fold · bingoCube ZK · lub-DUB</text>
  
  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="3" fill="#ffd93d" opacity="0.6"/>
  
  <!-- Bottom heartbeat line -->
  <polyline points="0,620 200,620 220,610 230,625 240,615 250,620 450,620 470,610 480,625 490,615 500,620 700,620 720,610 730,625 740,615 750,620 950,620 970,610 980,625 990,615 1000,620 1200,620" 
            fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.4"/>
  
  <!-- bingoCube hash -->
  <text x="1170" y="25" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#333">409d202b7763fc24</text>
  
  <!-- À value -->
  <text x="30" y="25" text-anchor="start" font-family="'Courier New', monospace" font-size="9" fill="#333">3.141592653589793</text>
</svg>
