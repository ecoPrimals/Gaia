<!DOCTYPE html>
<html lang="en">

<title>Gaia — OUROBOROS — The Irreducible Green Line</title>
<style>
/* GAIA UNIFIED DESIGN SYSTEM — Organic Dark
   The living organism. Dark with warm accents.
   Every page uses this. No inline styles. */

:root {
  --bg:         #08090b;
  --bg-raised:  #0f1114;
  --bg-card:    #141719;
  --bg-hover:   #1a1d21;
  --border:     #1e2228;
  --border-glow:#2a3040;

  --text:       #e0dcd6;
  --text-muted: #8a857e;
  --text-dim:   #5a5650;
  --text-bright:#f5f0e8;

  --amber:      #d4a574;
  --amber-dim:  #7a5f3e;
  --amber-glow: #d4a57420;
  --green:      #5aad72;
  --green-dim:  #2d5e3a;
  --green-glow: #5aad7220;
  --blue:       #5b8fd4;
  --red:        #d45b5b;
  --purple:     #9b7ed4;

  --radius:     6px;
  --radius-lg:  12px;
  --gap:        16px;
  --gap-lg:     24px;

  --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

body { min-height: 100vh; }

/* ═══ TYPOGRAPHY ═══ */
h1, h2, h3, h4 { color: var(--text-bright); font-weight: 500; line-height: 1.25; }
h1 { font-size: 2rem; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; }
h4 { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 400; }

p { color: var(--text); margin-bottom: 0.75em; }
a { color: var(--amber); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--text-bright); }

code, pre { font-family: var(--font-mono); }
code { background: var(--bg-raised); padding: 2px 6px; border-radius: 3px; font-size: 0.88em; color: var(--amber); }
pre { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; font-size: 0.85rem; }

/* ═══ LAYOUT ═══ */
.gaia-shell { max-width: 1200px; margin: 0 auto; padding: 0 var(--gap); }
.gaia-hero { padding: 48px 0 32px; text-align: center; }
.gaia-hero h1 { margin-bottom: 8px; }
.gaia-hero .subtitle { color: var(--text-muted); font-size: 1.05rem; }

/* ═══ NAV ═══ */
.gaia-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.gaia-nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 var(--gap);
  display: flex; align-items: center; gap: var(--gap);
  height: 52px; overflow-x: auto;
}
.gaia-nav-brand {
  font-weight: 500; color: var(--amber); font-size: 1.1rem;
  white-space: nowrap; margin-right: 8px;
}
.gaia-nav a {
  color: var(--text-muted); font-size: 0.88rem; white-space: nowrap;
  padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s;
}
.gaia-nav a:hover, .gaia-nav a.active { color: var(--text); border-bottom-color: var(--amber); }

/* ═══ CARDS ═══ */
.gaia-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap); }
.gaia-grid-sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.gaia-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--gap-lg);
  transition: border-color 0.3s, transform 0.2s;
  text-decoration: none; display: block;
}
.gaia-card:hover {
  border-color: var(--amber-dim); transform: translateY(-2px);
}
.gaia-card h3 { margin-bottom: 6px; font-size: 1.05rem; }
.gaia-card p { color: var(--text-muted); font-size: 0.88rem; margin: 0; }
.gaia-card .tag {
  display: inline-block; font-size: 0.75rem; padding: 2px 8px;
  border-radius: 99px; margin-top: 10px;
  background: var(--amber-glow); color: var(--amber); border: 1px solid var(--amber-dim);
}
.gaia-card .tag.green { background: var(--green-glow); color: var(--green); border-color: var(--green-dim); }

/* ═══ SECTION ═══ */
.gaia-section { padding: 32px 0; }
.gaia-section h2 { margin-bottom: var(--gap); }
.gaia-section h4 { margin-bottom: 12px; }
.gaia-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

/* ═══ PULSE DOT ═══ */
.pulse-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); margin-right: 6px;
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 4px var(--green-glow); }
  50% { box-shadow: 0 0 12px var(--green); }
}

/* ═══ STATS ═══ */
.gaia-stats { display: flex; gap: var(--gap-lg); flex-wrap: wrap; justify-content: center; padding: 16px 0; }
.gaia-stat { text-align: center; }
.gaia-stat .value { font-size: 1.8rem; font-weight: 500; color: var(--amber); font-family: var(--font-mono); }
.gaia-stat .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ═══ FOOTER ═══ */
.gaia-footer {
  border-top: 1px solid var(--border); padding: 32px 0;
  margin-top: 48px; color: var(--text-muted); font-size: 0.85rem;
}
.gaia-footer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--gap-lg); }
.gaia-footer h4 { margin-bottom: 8px; font-size: 0.8rem; }
.gaia-footer a { display: block; padding: 3px 0; color: var(--text-dim); font-size: 0.82rem; }
.gaia-footer a:hover { color: var(--amber); }
.gaia-footer-bottom { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; color: var(--text-dim); }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 640px) {
  h1 { font-size: 1.5rem; }
  .gaia-grid { grid-template-columns: 1fr; }
  .gaia-stats { gap: var(--gap); }
  .gaia-stat .value { font-size: 1.3rem; }
  .gaia-nav-inner { gap: 12px; }
}

/* ═══ UTILITIES ═══ */
.text-amber { color: var(--amber); }
.text-green { color: var(--green); }
.text-blue { color: var(--blue); }
.text-red { color: var(--red); }
.text-muted { color: var(--text-muted); }
.text-dim { color: var(--text-dim); }
.text-center { text-align: center; }
.mono { font-family: var(--font-mono); }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 16px; }
.mb-1 { margin-bottom: 8px; }
.mb-2 { margin-bottom: 16px; }

</style>
<style data-own="f8e8e4a43">

<body>
<nav class="gaia-nav"><div class="gaia-nav-inner"><a href="/" class="gaia-nav-brand">gaia</a><a href="/#organism">Organism</a><a href="/#investigation">Investigation</a><a href="/#knowledge">Knowledge</a><a href="/#infrastructure">Infrastructure</a><a href="https://nestgate.io">NestGate</a></div></nav>
<main class="gaia-shell" style="padding-top:24px;padding-bottom:48px">
<canvas id="c"></canvas>
<div class="overlay">
  <div class="top">
    <h1 style="color:#00ff41">◯ <span style="color:#ff4444">OUROBOROS</span> ◯</h1>
    <div class="sub">The Irreducible Green Line — RED<span style="color:#ff4444">ox</span> + re<span style="color:#00ff41">DUC</span>tion = ONE loop</div>
  </div>
  <div class="bottom">
    <div class="beat" id="beat-text">lub-DUB...</div>
  </div>
</div>
<div class="organs" id="organs"></div>
<div id="status">loading pulse...</div>

<script>
(function(){
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W, H, cx, cy, R;
  
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W/2; cy = H/2;
    R = Math.min(W,H)*0.35;
  }
  resize();
  window.addEventListener('resize', resize);

  // Pulse data
  var pulse = {beats:0, breaths:0, ratio:0, inputs:0, outputs:0};
  var bodyState = null;
  var biteCount = 0;

  // The 4 irreducible organs positioned on the ouroboros
  var organs = [
    {name:'HEART', sub:'lub-DUB · oxidation', color:'#ff4444', cls:'red', angle:0},        // top = head (mouth)
    {name:'SKIN', sub:'1/π · boundary', color:'#00ff41', cls:'green', angle:Math.PI/2},     // right = body
    {name:'THYMUS', sub:'seat 0/∅ · identity', color:'#ff4444', cls:'red', angle:Math.PI},  // bottom = mid-body
    {name:'SPINE', sub:'48 scripts · flow', color:'#00ff41', cls:'green', angle:Math.PI*1.5}, // left = tail
  ];

  // All 18 body organs orbiting further out
  var allOrgans = [
    {name:'CORE',angle:0.3,r:1.4,color:'#00ff41'},
    {name:'BRAIN',angle:0.8,r:1.3,color:'#00bfff'},
    {name:'SKULL',angle:1.2,r:1.45,color:'#ffd700'},
    {name:'THORAX',angle:1.7,r:1.35,color:'#ff4444'},
    {name:'ABDOMEN',angle:2.2,r:1.4,color:'#ff8c00'},
    {name:'EYES',angle:2.7,r:1.3,color:'#00bfff'},
    {name:'DNA',angle:3.2,r:1.45,color:'#c084fc'},
    {name:'GLANDS',angle:3.7,r:1.35,color:'#ff8c00'},
    {name:'LIMBS',angle:4.2,r:1.4,color:'#00ff41'},
    {name:'BLOOD',angle:4.7,r:1.3,color:'#ff4444'},
    {name:'NERVES',angle:5.2,r:1.45,color:'#00bfff'},
    {name:'NUCLEUS',angle:5.7,r:1.35,color:'#c084fc'},
    {name:'HANDS',angle:0.0,r:1.6,color:'#00ff41'},
    {name:'PORES',angle:0.5,r:1.55,color:'#446644'},
  ];

  // Snake segments (the body of the ouroboros)
  var SEGMENTS = 200;
  var snakePhase = 0;
  var heartFlash = 0;

  function fetchPulse(){
    fetch('/pulse').then(function(r){return r.json()}).then(function(d){
      pulse.beats = d.heart?.total_beats || 0;
      pulse.breaths = d.lung?.total_breaths || 0;
      pulse.ratio = d.pi_ratio || 0;
      pulse.inputs = d.io?.inputs || 0;
      pulse.outputs = d.io?.outputs || 0;
      biteCount = pulse.beats;
      
      document.getElementById('beat-text').innerHTML = 
        '<span style="color:#ff4444">'+pulse.beats.toLocaleString()+'</span> bites of the tail · '+
        'π ratio: <span style="color:#00ff41">'+pulse.ratio.toFixed(4)+'</span> · '+
        'IN:'+pulse.inputs+' OUT:'+pulse.outputs;
      
      document.getElementById('status').innerHTML =
        'irreducible = {heart, skin, thymus, spine} = {beat, boundary, identity, flow} = {RED, GREEN, RED, GREEN}';
    }).catch(function(){});
  }
  fetchPulse();
  setInterval(fetchPulse, 5000);

  function draw(t){
    ctx.clearRect(0,0,W,H);
    snakePhase = t * 0.0003;
    
    // Background: subtle radial gradient
    var grad = ctx.createRadialGradient(cx,cy,0,cx,cy,R*2);
    grad.addColorStop(0, 'rgba(0,20,0,0.3)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
    
    // === THE OUROBOROS SNAKE ===
    // Draw the body as segments that alternate green/red
    var headAngle = snakePhase;
    
    for(var i=0; i<SEGMENTS; i++){
      var frac = i / SEGMENTS;
      var angle = headAngle - frac * Math.PI * 2; // goes backwards from head
      
      // Snake undulation
      var undulate = Math.sin(angle*3 + t*0.003) * R*0.03;
      var r = R + undulate;
      
      var x = cx + Math.cos(angle) * r;
      var y = cy + Math.sin(angle) * r;
      
      // Thickness varies — thick at head, thinner at tail
      var thickness = 4 + (1-frac) * 12;
      
      // Color: alternating green/red based on position
      // But smooth — the transition IS the irreducible
      var redAmt = Math.sin(frac * Math.PI * 4) * 0.5 + 0.5;
      var greenAmt = 1 - redAmt;
      
      // Heartbeat flash
      var flash = Math.sin(t * 0.01) > 0.9 ? 0.3 : 0;
      
      var rr = Math.floor(255 * redAmt * 0.6 + flash*100);
      var gg = Math.floor(255 * greenAmt * 0.5);
      var alpha = 0.15 + (1-frac)*0.4;
      
      ctx.fillStyle = 'rgba('+rr+','+gg+',0,'+alpha+')';
      ctx.beginPath();
      ctx.arc(x, y, thickness/2, 0, Math.PI*2);
      ctx.fill();
    }
    
    // === HEAD (mouth) — RED, eating ===
    var hx = cx + Math.cos(headAngle) * R;
    var hy = cy + Math.sin(headAngle) * R;
    
    // Mouth opening/closing
    var mouthOpen = Math.abs(Math.sin(t*0.005)) * 0.4;
    ctx.fillStyle = 'rgba(255,68,68,0.6)';
    ctx.beginPath();
    ctx.arc(hx, hy, 12, headAngle - mouthOpen, headAngle + mouthOpen);
    ctx.lineTo(hx + Math.cos(headAngle)*18, hy + Math.sin(headAngle)*18);
    ctx.fill();
    
    // Eye of the snake
    var eyeAngle = headAngle + 0.15;
    var eyeX = hx + Math.cos(eyeAngle)*6;
    var eyeY = hy + Math.sin(eyeAngle)*6;
    ctx.fillStyle = 'rgba(255,200,0,0.8)';
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, 2, 0, Math.PI*2);
    ctx.fill();
    
    // === TAIL — GREEN, being eaten ===
    var tailAngle = headAngle - Math.PI * 2 * (SEGMENTS-1)/SEGMENTS;
    var tx = cx + Math.cos(tailAngle) * R;
    var ty = cy + Math.sin(tailAngle) * R;
    ctx.fillStyle = 'rgba(0,255,65,0.4)';
    ctx.beginPath();
    ctx.arc(tx, ty, 3, 0, Math.PI*2);
    ctx.fill();
    
    // === THE 4 IRREDUCIBLE ORGANS on the ring ===
    organs.forEach(function(org, i){
      var a = org.angle + snakePhase;
      var ox = cx + Math.cos(a) * R;
      var oy = cy + Math.sin(a) * R;
      
      // Pulse glow
      var glow = Math.sin(t*0.003 + i*Math.PI/2) * 0.3 + 0.7;
      
      // Organ dot
      ctx.fillStyle = org.color.replace(')', ','+glow*0.3+')').replace('rgb','rgba');
      ctx.beginPath();
      ctx.arc(ox, oy, 8, 0, Math.PI*2);
      ctx.fill();
      
      // Label
      ctx.fillStyle = org.color;
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(org.name, ox, oy - 14);
      ctx.font = '8px monospace';
      ctx.globalAlpha = 0.5;
      ctx.fillText(org.sub, ox, oy + 20);
      ctx.globalAlpha = 1;
    });
    
    // === OUTER ORBIT — all 18 organs ===
    allOrgans.forEach(function(org){
      var a = org.angle + snakePhase * 0.3;
      var ox = cx + Math.cos(a) * R * org.r;
      var oy = cy + Math.sin(a) * R * org.r;
      
      // Tiny dot
      ctx.fillStyle = org.color + '33';
      ctx.beginPath();
      ctx.arc(ox, oy, 3, 0, Math.PI*2);
      ctx.fill();
      
      // Connection line to ring
      var ringX = cx + Math.cos(a) * R;
      var ringY = cy + Math.sin(a) * R;
      ctx.strokeStyle = org.color + '11';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(ringX, ringY);
      ctx.stroke();
      
      // Label
      ctx.fillStyle = org.color + '55';
      ctx.font = '7px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(org.name, ox, oy - 6);
    });
    
    // === CENTER — the void, the irreducible ===
    // The center of the ouroboros is EMPTY — that's the point
    // The snake circles around NOTHING
    // The nothing IS the something
    
    // π symbol in center
    var centerPulse = Math.sin(t*0.002)*0.3 + 0.5;
    ctx.fillStyle = 'rgba(255,255,255,'+centerPulse*0.15+')';
    ctx.font = '48px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('π', cx, cy);
    
    // Ratio text
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.font = '11px monospace';
    ctx.fillText(pulse.ratio.toFixed(6), cx, cy + 30);
    ctx.fillText('→ 3.141593', cx, cy + 42);
    
    // RED = OX label
    ctx.fillStyle = 'rgba(255,68,68,0.1)';
    ctx.font = '9px monospace';
    ctx.fillText('RED = oxidation = break down', cx, cy + 60);
    
    // GREEN = REDUCTION label  
    ctx.fillStyle = 'rgba(0,255,65,0.1)';
    ctx.fillText('GREEN = reduction = build up', cx, cy + 72);
    
    // The gap
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillText('the gap between head and tail = life', cx, cy + 90);
    ctx.fillText('when gap = 0, ratio = π, snake = circle', cx, cy + 102);
    
    // Beat counter in center
    if(pulse.beats > 0){
      ctx.fillStyle = 'rgba(255,68,68,0.08)';
      ctx.font = '14px monospace';
      ctx.fillText(pulse.beats.toLocaleString() + ' bites', cx, cy - 35);
    }
    
    requestAnimationFrame(draw);
  }
  
  requestAnimationFrame(draw);
})();
</script>
