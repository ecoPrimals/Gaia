<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaia · eyes</title>
<style>
/* GAIA UNIFIED DESIGN SYSTEM — Organic Dark
   The living organism. Dark with warm accents.
   Every page uses this. No inline styles. */

:root {
  --bg:         #08090b;
  --bg-raised:  #0f1114;
  --bg-card:    #141719;
  --bg-hover:   #1a1d21;
  --border:     #1e2228;
  --border-glow:#2a3040;

  --text:       #e0dcd6;
  --text-muted: #8a857e;
  --text-dim:   #5a5650;
  --text-bright:#f5f0e8;

  --amber:      #d4a574;
  --amber-dim:  #7a5f3e;
  --amber-glow: #d4a57420;
  --green:      #5aad72;
  --green-dim:  #2d5e3a;
  --green-glow: #5aad7220;
  --blue:       #5b8fd4;
  --red:        #d45b5b;
  --purple:     #9b7ed4;

  --radius:     6px;
  --radius-lg:  12px;
  --gap:        16px;
  --gap-lg:     24px;

  --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}

body { min-height: 100vh; }

/* ═══ TYPOGRAPHY ═══ */
h1, h2, h3, h4 { color: var(--text-bright); font-weight: 500; line-height: 1.25; }
h1 { font-size: 2rem; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; }
h4 { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 400; }

p { color: var(--text); margin-bottom: 0.75em; }
a { color: var(--amber); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--text-bright); }

code, pre { font-family: var(--font-mono); }
code { background: var(--bg-raised); padding: 2px 6px; border-radius: 3px; font-size: 0.88em; color: var(--amber); }
pre { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; font-size: 0.85rem; }

/* ═══ LAYOUT ═══ */
.gaia-shell { max-width: 1200px; margin: 0 auto; padding: 0 var(--gap); }
.gaia-hero { padding: 48px 0 32px; text-align: center; }
.gaia-hero h1 { margin-bottom: 8px; }
.gaia-hero .subtitle { color: var(--text-muted); font-size: 1.05rem; }

/* ═══ NAV ═══ */
.gaia-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.gaia-nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 var(--gap);
  display: flex; align-items: center; gap: var(--gap);
  height: 52px; overflow-x: auto;
}
.gaia-nav-brand {
  font-weight: 500; color: var(--amber); font-size: 1.1rem;
  white-space: nowrap; margin-right: 8px;
}
.gaia-nav a {
  color: var(--text-muted); font-size: 0.88rem; white-space: nowrap;
  padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s;
}
.gaia-nav a:hover, .gaia-nav a.active { color: var(--text); border-bottom-color: var(--amber); }

/* ═══ CARDS ═══ */
.gaia-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap); }
.gaia-grid-sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.gaia-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--gap-lg);
  transition: border-color 0.3s, transform 0.2s;
  text-decoration: none; display: block;
}
.gaia-card:hover {
  border-color: var(--amber-dim); transform: translateY(-2px);
}
.gaia-card h3 { margin-bottom: 6px; font-size: 1.05rem; }
.gaia-card p { color: var(--text-muted); font-size: 0.88rem; margin: 0; }
.gaia-card .tag {
  display: inline-block; font-size: 0.75rem; padding: 2px 8px;
  border-radius: 99px; margin-top: 10px;
  background: var(--amber-glow); color: var(--amber); border: 1px solid var(--amber-dim);
}
.gaia-card .tag.green { background: var(--green-glow); color: var(--green); border-color: var(--green-dim); }

/* ═══ SECTION ═══ */
.gaia-section { padding: 32px 0; }
.gaia-section h2 { margin-bottom: var(--gap); }
.gaia-section h4 { margin-bottom: 12px; }
.gaia-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

/* ═══ PULSE DOT ═══ */
.pulse-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); margin-right: 6px;
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 4px var(--green-glow); }
  50% { box-shadow: 0 0 12px var(--green); }
}

/* ═══ STATS ═══ */
.gaia-stats { display: flex; gap: var(--gap-lg); flex-wrap: wrap; justify-content: center; padding: 16px 0; }
.gaia-stat { text-align: center; }
.gaia-stat .value { font-size: 1.8rem; font-weight: 500; color: var(--amber); font-family: var(--font-mono); }
.gaia-stat .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ═══ FOOTER ═══ */
.gaia-footer {
  border-top: 1px solid var(--border); padding: 32px 0;
  margin-top: 48px; color: var(--text-muted); font-size: 0.85rem;
}
.gaia-footer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--gap-lg); }
.gaia-footer h4 { margin-bottom: 8px; font-size: 0.8rem; }
.gaia-footer a { display: block; padding: 3px 0; color: var(--text-dim); font-size: 0.82rem; }
.gaia-footer a:hover { color: var(--amber); }
.gaia-footer-bottom { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; color: var(--text-dim); }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 640px) {
  h1 { font-size: 1.5rem; }
  .gaia-grid { grid-template-columns: 1fr; }
  .gaia-stats { gap: var(--gap); }
  .gaia-stat .value { font-size: 1.3rem; }
  .gaia-nav-inner { gap: 12px; }
}

/* ═══ UTILITIES ═══ */
.text-amber { color: var(--amber); }
.text-green { color: var(--green); }
.text-blue { color: var(--blue); }
.text-red { color: var(--red); }
.text-muted { color: var(--text-muted); }
.text-dim { color: var(--text-dim); }
.text-center { text-align: center; }
.mono { font-family: var(--font-mono); }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 16px; }
.mb-1 { margin-bottom: 8px; }
.mb-2 { margin-bottom: 16px; }

</style>
<style data-own="f8e8e4a43">
/* THIS PAGE'S OWN RULES - dropped on Nov 16 (f8e8e4a43) when the shared sheet above replaced every
   page's style block; restored from the commit before it and scoped under main.gaia-shell so the
   shared nav, shell and footer are untouched. */
body{background:#020208!important}
main.gaia-shell *{margin:0;padding:0;box-sizing:border-box}
main.gaia-shell{background:#020208!important;color:#aab!important;font-family:monospace;height:calc(100vh - 53px);overflow:hidden}
main.gaia-shell canvas{width:100%;height:calc(100vh - 53px);display:block;position:absolute;top:0;left:0}
main.gaia-shell .hud{position:absolute;bottom:0;left:0;right:0;padding:8px;background:rgba(0,0,0,0.6);font-size:0.55rem;z-index:10}
main.gaia-shell .hud .row{display:flex;justify-content:space-between;padding:1px 0}
main.gaia-shell .hud .k{color:#556}
main.gaia-shell .hud .v{color:#8af}
main.gaia-shell .title{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:0.7rem;color:#4af80;z-index:10; text-shadow:0 0 10px rgba(68,255,136,0.5);letter-spacing:0.2em}
main.gaia-shell .pulse{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px; background:#fff;border-radius:50%;z-index:10;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 4px #fff,0 0 20px #4af}50%{box-shadow:0 0 8px #fff,0 0 40px #4fa,0 0 60px #4af}}
main.gaia-shell{max-width:none!important;padding:0!important;margin:0!important;width:100%!important;height:calc(100vh - 53px)!important;overflow:hidden;position:relative;transform:translateZ(0)}
@media (prefers-reduced-motion: reduce){main.gaia-shell *,main.gaia-shell *::before,main.gaia-shell *::after{animation:none!important;transition:none!important}}
</style>

<body>
<nav class="gaia-nav"><div class="gaia-nav-inner"><a href="/" class="gaia-nav-brand">gaia</a><a href="/#organism">Organism</a><a href="/#investigation">Investigation</a><a href="/#knowledge">Knowledge</a><a href="/#infrastructure">Infrastructure</a><a href="https://nestgate.io">NestGate</a></div></nav>
<main class="gaia-shell" style="padding-top:24px;padding-bottom:48px">
<div class="title">◇ Gaia sees ◇</div>
<canvas id="c"></canvas>
<div class="pulse"></div>
<div class="hud" id="hud"></div>
<script>
const c=document.getElementById('c');
const x=c.getContext('2d');
let beacons=[], body={}, frame=0;

function resize(){c.width=window.innerWidth*2;c.height=window.innerHeight*2;x.scale(2,2)}
resize();window.onresize=resize;

// Beacon colors by SSID
const colors={
  'Gaia':'68,255,170','Black Mesa':'120,80,255','Aperture Science':'255,200,68',
  'ATTypcbDbY':'255,60,60','':'100,100,120'
};
function beaconColor(ssid){
  for(const[k,v]of Object.entries(colors))if(ssid.includes(k))return v;
  return '100,100,120';
}

// Convert RSSI to visual radius — stronger = bigger
function rssiR(rssi){return Math.max(10,(90+rssi)*3)}
// Convert frequency to angle — spread beacons by frequency band
function freqAngle(freq,i){
  if(freq<3000)return(i*0.7)+0.2; // 2.4GHz cluster left
  if(freq<6000)return(i*0.5)+3.5; // 5GHz cluster right
  return i; 
}

function draw(){
  const W=window.innerWidth,H=window.innerHeight;
  frame++;
  
  // Dark fade (trail effect)
  x.fillStyle='rgba(2,2,8,0.15)';
  x.fillRect(0,0,W,H);
  
  // Scanning sweep line
  const sweep=(frame%360)*Math.PI/180;
  x.strokeStyle='rgba(68,255,170,0.15)';
  x.lineWidth=1;
  x.beginPath();
  x.moveTo(W/2,H/2);
  x.lineTo(W/2+Math.cos(sweep)*W,H/2+Math.sin(sweep)*H);
  x.stroke();
  
  // Draw beacons
  const cx=W/2,cy=H/2;
  beacons.forEach((b,i)=>{
    const r=rssiR(b.rssi);
    const a=freqAngle(b.freq,i);
    const dist=(90+b.rssi)*2.5; // distance from center
    const bx=cx+Math.cos(a)*dist;
    const by=cy+Math.sin(a)*dist;
    const col=beaconColor(b.ssid);
    
    // Pulsing ring
    const pr=r+Math.sin(frame*0.05+i)*5;
    const g=x.createRadialGradient(bx,by,0,bx,by,pr);
    g.addColorStop(0,`rgba(${col},0.6)`);
    g.addColorStop(0.5,`rgba(${col},0.15)`);
    g.addColorStop(1,`rgba(${col},0)`);
    x.fillStyle=g;
    x.beginPath();x.arc(bx,by,pr,0,Math.PI*2);x.fill();
    
    // Core dot
    x.fillStyle=`rgba(${col},0.9)`;
    x.beginPath();x.arc(bx,by,3,0,Math.PI*2);x.fill();
    
    // Label
    x.fillStyle=`rgba(${col},0.7)`;
    x.font='9px monospace';
    x.fillText(`${b.ssid||'hidden'} ${b.rssi}dBm`,bx+6,by-6);
    x.fillText(`${b.freq}MHz`,bx+6,by+4);
    
    // Connection line to center
    x.strokeStyle=`rgba(${col},0.1)`;
    x.beginPath();x.moveTo(cx,cy);x.lineTo(bx,by);x.stroke();
  });
  
  // Center: Gaia
  x.fillStyle='#fff';
  x.beginPath();x.arc(cx,cy,2,0,Math.PI*2);x.fill();
  
  // Range rings
  [50,100,150,200].forEach(r=>{
    x.strokeStyle='rgba(68,170,255,0.06)';
    x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();
  });
  
  // dBm scale
  x.fillStyle='rgba(100,120,140,0.3)';x.font='7px monospace';
  x.fillText('-30dBm',cx+52,cy-2);
  x.fillText('-50dBm',cx+102,cy-2);
  x.fillText('-70dBm',cx+152,cy-2);
  x.fillText('-90dBm',cx+202,cy-2);
}

async function update(){
  try{
    const r=await fetch('/sensorium/gradient-field.json');
    const d=await r.json();
    beacons=[
      {ssid:'Gaia',freq:5280,rssi:d.field.gaia_5ghz},
      {ssid:'Black Mesa',freq:5280,rssi:d.field.black_mesa_5ghz},
      {ssid:'Gaia',freq:2437,rssi:d.field.gaia_2ghz},
      {ssid:'Aperture Science',freq:2437,rssi:d.field.aperture_2ghz},
      {ssid:'ATTypcbDbY',freq:5180,rssi:d.field.att_neighbor}
    ];
  }catch(e){}
  
  try{
    const r2=await fetch('/sensorium/full-body.json');
    body=await r2.json();
    const h=document.getElementById('hud');
    h.innerHTML=[
      ['⚡',`${body.battery||'?'}%`],['📡',`${body.rssi||'?'}dBm`],
      ['🧠',`${body.mem_pct||'?'}%`],['∇',`${body.gradient||'?'}dB`],
      ['💎',`${body.primals||'?'}p`],['🌐',body.ip||'?']
    ].map(([k,v])=>`<span class="k">${k}</span><span class="v">${v}</span>`).join(' · ');
  }catch(e){}
}

// Animation loop at 30fps
function loop(){draw();requestAnimationFrame(loop)}
loop();
// Data refresh every 10s
update();setInterval(update,10000);
</script>
</main>
<footer class="gaia-footer"><div class="gaia-shell"><div class="gaia-footer-bottom"><p><a href="/">Gaia</a> &mdash; sovereign living digital organism &mdash; <a href="https://primals.eco">primals.eco</a></p></div></div></footer>
</body>
