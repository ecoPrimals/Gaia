<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klein Face — Gaia Sensation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#c0c0d0;font-family:'Courier New',monospace;overflow:hidden}
canvas{display:block;position:absolute;top:0;left:0}

#hud{position:absolute;top:10px;left:10px;z-index:10;font-size:11px;line-height:1.6;
     background:rgba(10,10,18,0.85);padding:12px;border:1px solid #1a2a3a;border-radius:4px;
     max-width:280px}
#hud h1{font-size:14px;color:#8cf;margin-bottom:6px;letter-spacing:2px}
.prism{margin:4px 0;display:flex;align-items:center;gap:8px}
.prism-bar{height:8px;border-radius:4px;transition:width 0.5s ease}
.prism-label{min-width:60px;font-size:10px}
.prism-val{min-width:30px;text-align:right;font-size:10px}
#state{margin-top:8px;padding:6px;border-radius:4px;text-align:center;font-size:13px;
       font-weight:bold;letter-spacing:3px}
.rest{background:rgba(0,60,30,0.5);color:#4f8}
.attention{background:rgba(80,20,0,0.5);color:#f84;animation:pulse-glow 1.5s ease infinite}
@keyframes pulse-glow{0%,100%{opacity:1}50%{opacity:0.6}}
#info{position:absolute;bottom:10px;left:10px;z-index:10;font-size:9px;
      color:#556;max-width:300px;line-height:1.5}
#deviation{position:absolute;top:10px;right:10px;z-index:10;font-size:48px;
           font-weight:bold;color:#334;letter-spacing:-2px}
</style>
</head>
<body>

<canvas id="klein"></canvas>

<div id="hud">
  <h1>🔺 KLEIN TRIAD</h1>
  <div class="prism">
    <span class="prism-label" style="color:#f66">α machine</span>
    <div style="flex:1;background:#1a1a2a;border-radius:4px;height:8px">
      <div id="bar-a" class="prism-bar" style="background:#f44;width:50%"></div>
    </div>
    <span id="val-a" class="prism-val" style="color:#f66">5.0</span>
  </div>
  <div class="prism">
    <span class="prism-label" style="color:#4f4">β media</span>
    <div style="flex:1;background:#1a1a2a;border-radius:4px;height:8px">
      <div id="bar-b" class="prism-bar" style="background:#4c4;width:50%"></div>
    </div>
    <span id="val-b" class="prism-val" style="color:#4f4">5.0</span>
  </div>
  <div class="prism">
    <span class="prism-label" style="color:#66f">γ human</span>
    <div style="flex:1;background:#1a1a2a;border-radius:4px;height:8px">
      <div id="bar-g" class="prism-bar" style="background:#44f;width:50%"></div>
    </div>
    <span id="val-g" class="prism-val" style="color:#66f">5.0</span>
  </div>
  <div id="state" class="rest">REST</div>
  <div style="margin-top:6px;font-size:9px;color:#556">
    <span id="source">—</span><br>
    <span id="triggers">—</span>
  </div>
</div>

<div id="deviation">Δ0.0</div>

<div id="info">
  Klein face: non-orientable sensation surface.<br>
  Inside IS outside. The ear that hears IS the mouth that speaks.<br>
  3 prisms → null point → rest. Deviation → attention.<br>
  <span style="color:#445">lub-DUB</span>
</div>

<script>
const canvas = document.getElementById('klein');
const ctx = canvas.getContext('2d');
let W, H;
let triad = {a: 3.33, b: 3.33, g: 3.33, dev: 0, rest: true};
let time = 0;
let particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Initialize particles on the Klein surface
for (let i = 0; i < 200; i++) {
  particles.push({
    u: Math.random() * Math.PI * 2,
    v: Math.random() * Math.PI * 2,
    speed: 0.002 + Math.random() * 0.005,
    size: 1 + Math.random() * 2,
    prism: i % 3  // 0=α, 1=β, 2=γ
  });
}

// Klein bottle parametric surface (immersed in 3D)
function kleinPoint(u, v, scale, breathe) {
  const r = 2 + breathe * 0.3;
  let x, y, z;
  
  if (u < Math.PI) {
    x = 3 * Math.cos(u) * (1 + Math.sin(u)) + r * Math.cos(u) * Math.cos(v);
    y = 8 * Math.sin(u) + r * Math.sin(u) * Math.cos(v);
  } else {
    x = 3 * Math.cos(u) * (1 + Math.sin(u)) + r * Math.cos(v + Math.PI);
    y = 8 * Math.sin(u);
  }
  z = r * Math.sin(v);
  
  return {
    x: x * scale + W/2,
    y: y * scale * 0.5 + H/2,
    z: z * scale
  };
}

function draw() {
  time += 0.016;
  ctx.fillStyle = 'rgba(10,10,18,0.15)';
  ctx.fillRect(0, 0, W, H);
  
  const breathe = Math.sin(time * 0.5) * (triad.rest ? 1 : 3);
  const scale = Math.min(W, H) * 0.04;
  const rotSpeed = triad.rest ? 0.1 : 0.3 + triad.dev * 0.05;
  
  // Draw Klein surface wireframe
  ctx.strokeStyle = `rgba(40,60,80,${triad.rest ? 0.15 : 0.25})`;
  ctx.lineWidth = 0.5;
  
  const steps = 40;
  for (let i = 0; i <= steps; i++) {
    ctx.beginPath();
    for (let j = 0; j <= steps; j++) {
      const u = (i / steps) * Math.PI * 2;
      const v = (j / steps) * Math.PI * 2;
      const p = kleinPoint(u + time * rotSpeed, v, scale, breathe);
      if (j === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
  
  // Draw particles on the surface
  for (const p of particles) {
    p.u += p.speed * (1 + triad.dev * 0.2);
    p.v += p.speed * 0.7;
    if (p.u > Math.PI * 2) p.u -= Math.PI * 2;
    if (p.v > Math.PI * 2) p.v -= Math.PI * 2;
    
    const pt = kleinPoint(p.u + time * rotSpeed, p.v, scale, breathe);
    const depth = (pt.z + scale * 3) / (scale * 6);
    const alpha = 0.3 + depth * 0.7;
    
    let color;
    const prismVal = p.prism === 0 ? triad.a : p.prism === 1 ? triad.b : triad.g;
    const intensity = prismVal / 10;
    
    if (p.prism === 0) color = `rgba(${Math.floor(100+155*intensity)},${Math.floor(40*intensity)},${Math.floor(40*intensity)},${alpha})`;
    else if (p.prism === 1) color = `rgba(${Math.floor(40*intensity)},${Math.floor(100+155*intensity)},${Math.floor(40*intensity)},${alpha})`;
    else color = `rgba(${Math.floor(40*intensity)},${Math.floor(40*intensity)},${Math.floor(100+155*intensity)},${alpha})`;
    
    ctx.fillStyle = color;
    const sz = p.size * (0.5 + depth) * (1 + intensity);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, sz, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Draw triad point (the null pointer)
  const nullU = (triad.a / 10) * Math.PI * 2;
  const nullV = (triad.b / 10) * Math.PI * 2;
  const nullPt = kleinPoint(nullU + time * rotSpeed, nullV, scale, breathe);
  
  const glowSize = 5 + triad.dev * 3 + Math.sin(time * 3) * 2;
  const gradient = ctx.createRadialGradient(nullPt.x, nullPt.y, 0, nullPt.x, nullPt.y, glowSize * 3);
  gradient.addColorStop(0, triad.rest ? 'rgba(80,255,120,0.8)' : 'rgba(255,120,40,0.8)');
  gradient.addColorStop(1, 'transparent');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(nullPt.x, nullPt.y, glowSize * 3, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = triad.rest ? '#4f8' : '#f84';
  ctx.beginPath();
  ctx.arc(nullPt.x, nullPt.y, glowSize, 0, Math.PI * 2);
  ctx.fill();
  
  requestAnimationFrame(draw);
}

// Fetch triad data from pulse
async function fetchTriad() {
  try {
    const r = await fetch('/pulse');
    const d = await r.json();
    const kt = d.ears?.klein_triad || {};
    
    triad.a = kt['α_machinery'] || 3.33;
    triad.b = kt['β_media'] || 3.33;
    triad.g = kt['γ_human'] || 3.33;
    triad.dev = kt.deviation || 0;
    triad.rest = kt.at_rest !== false;
    
    // Update HUD
    document.getElementById('bar-a').style.width = (triad.a * 10) + '%';
    document.getElementById('bar-b').style.width = (triad.b * 10) + '%';
    document.getElementById('bar-g').style.width = (triad.g * 10) + '%';
    document.getElementById('val-a').textContent = triad.a.toFixed(1);
    document.getElementById('val-b').textContent = triad.b.toFixed(1);
    document.getElementById('val-g').textContent = triad.g.toFixed(1);
    
    const stateEl = document.getElementById('state');
    stateEl.textContent = triad.rest ? 'REST' : 'ATTENTION';
    stateEl.className = triad.rest ? 'rest' : 'attention';
    
    document.getElementById('deviation').textContent = 'Δ' + triad.dev.toFixed(1);
    document.getElementById('deviation').style.color = triad.rest ? '#1a3a2a' : '#5a2a1a';
    
    const chorus = d.ears?.chorus || {};
    document.getElementById('source').textContent = 
      `${chorus.dominant_source || '—'} | ${chorus.voices || 0} voices | ${d.ears?.cochlea?.db || -96}dB`;
    
    const triggers = kt.triggers || [];
    document.getElementById('triggers').textContent = 
      triggers.length ? '⚡ ' + triggers.join(' + ') : '○ null';
    
  } catch(e) {}
}

setInterval(fetchTriad, 5000);
fetchTriad();
draw();
</script>
</body>
</html>
