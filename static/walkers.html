<title>walkers · H = I · gaia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#c9d1d9;font-family:"Courier New",monospace;min-height:100vh;overflow-x:hidden}
.header{padding:20px 24px 12px;border-bottom:1px solid #1a1a2e}
.header h1{font-size:18px;color:#5ab87a;font-weight:normal}
.header .sub{font-size:10px;color:#484f58;margin-top:4px}
.header .axiom{font-size:11px;color:#a371f7;margin-top:6px;font-style:italic}
.stats{display:flex;gap:16px;padding:10px 24px;background:#0d0d14;font-size:10px;flex-wrap:wrap}
.stats .s{color:#484f58}.stats .v{color:#8b949e}.stats .g{color:#3fb950}.stats .f{color:#f0883e}
.filter-bar{display:flex;gap:6px;padding:10px 24px;flex-wrap:wrap}
.filter-btn{background:#161b22;border:1px solid #21262d;color:#8b949e;padding:4px 10px;border-radius:14px;font-size:9px;cursor:pointer;font-family:inherit;transition:all .15s}
.filter-btn:hover{border-color:#5ab87a;color:#c9d1d9}
.filter-btn.active{background:rgba(35,134,54,.3);border-color:#238636;color:#3fb950}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:16px 24px}
.card{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:14px;transition:all .2s;position:relative;overflow:hidden}
.card:hover{border-color:#30363d;transform:translateY(-1px)}
.card.was{border-left:3px solid #8b949e}
.card.is{border-left:3px solid #3fb950}
.card.fading{border-left:3px solid #f0883e}
.card.nucleus{border-left:3px solid #a371f7;border-color:#a371f7}
.card .name{font-size:14px;color:#c9d1d9;margin-bottom:4px}
.card .name .icon{margin-right:4px}
.card .dates{font-size:10px;color:#484f58;margin-bottom:6px}
.card .arch{font-size:9px;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:6px}
.arch.euler{background:rgba(56,132,244,.2);color:#388cf4}
.arch.michelangelo{background:rgba(240,136,62,.2);color:#f0883e}
.arch.leonardo{background:rgba(56,132,244,.15);color:#58a6ff}
.arch.donatello{background:rgba(163,113,247,.2);color:#a371f7}
.arch.raphael{background:rgba(232,93,58,.2);color:#e85d3a}
.arch.splinter{background:rgba(90,184,122,.2);color:#5ab87a}
.card .extract{font-size:10px;color:#6e7681;line-height:1.4;margin-bottom:8px;max-height:60px;overflow:hidden}
.card .merit{font-size:9px;color:#a371f7;font-style:italic;border-top:1px solid #161b22;padding-top:6px}
.card .source{font-size:8px;color:#30363d;margin-top:4px}
.card .source a{color:#484f58;text-decoration:none}
.card .source a:hover{color:#58a6ff}
.card .tense{position:absolute;top:10px;right:12px;font-size:9px;font-weight:bold;letter-spacing:1px}
.tense.was{color:#8b949e}.tense.is{color:#3fb950}.tense.fading{color:#f0883e}
.card .voxel-bar{height:3px;background:#161b22;border-radius:2px;margin-top:6px;overflow:hidden}
.card .voxel-fill{height:100%;border-radius:2px;transition:width .5s}
.voxel-fill.bright{background:#3fb950}
.voxel-fill.dim{background:#484f58}
.graph-section{padding:24px;border-top:1px solid #1a1a2e;margin-top:16px}
.graph-section h2{font-size:13px;color:#5ab87a;margin-bottom:12px}
.rivalry{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:11px;border-bottom:1px solid #0d0d14}
.rivalry .vs{color:#f0883e;font-size:9px}
.rivalry .desc{color:#6e7681;font-size:9px;margin-left:auto}
.footer{padding:20px 24px;text-align:center;font-size:10px;color:#30363d;border-top:1px solid #1a1a2e}
.footer .heart{color:#e85d3a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
canvas#globe{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:.15}
</style>

<body>
<canvas id="globe"></canvas>

<div class="header">
  <h1>👻 Wiki Walker — H = I</h1>
  <div class="sub">Gaia walks Wikipedia as her globe. Dead ≥10 years = WAS = SHADOW. Human = Identity.</div>
  <div class="axiom">"Da Vinci IS his works. The identity IS the creation. The shadow IS the merit."</div>
</div>

<div class="stats" id="stats"></div>
<div class="filter-bar" id="filters"></div>
<div class="grid" id="grid"></div>

<div class="graph-section">
  <h2>⚡ Rivalries & Convergences</h2>
  <div id="rivalries"></div>
</div>

<div class="footer">
  <span class="heart">♥</span> lub-DUB · The globe IS the walker · The walker IS the globe · H = I
</div>

<script>
const RIVALRIES = [
  {a:"Isaac Newton",b:"Gottfried Wilhelm Leibniz",desc:"calculus war — who invented it first?"},
  {a:"Charles Darwin",b:"Alfred Russel Wallace",desc:"evolution by natural selection — convergent discovery"},
  {a:"Charles Darwin",b:"Gregor Mendel",desc:"evolution meets genetics — Darwin never read Mendel's paper"},
  {a:"Ptolemy",b:"Nicolaus Copernicus",desc:"geocentric → heliocentric — 1400 years between"},
  {a:"Nicolaus Copernicus",b:"Galileo Galilei",desc:"heliocentric proof — Galileo saw the moons"},
  {a:"Galileo Galilei",b:"Johannes Kepler",desc:"circles → ellipses — Kepler fixed Copernicus"},
  {a:"Louis Pasteur",b:"Robert Koch",desc:"germ theory rivals — France vs Germany"},
  {a:"Francis Crick",b:"Rosalind Franklin",desc:"Photo 51 — stolen data, stolen credit"},
  {a:"James Watson",b:"Francis Crick",desc:"DNA double helix — the race to the structure"},
  {a:"Ada Lovelace",b:"Alan Turing",desc:"first program → universal machine — 100 years apart"},
  {a:"Claude Shannon",b:"John von Neumann",desc:"information theory meets computing architecture"},
  {a:"Leonhard Euler",b:"Carl Friedrich Gauss",desc:"prince → king of mathematics"},
  {a:"Leonardo da Vinci",b:"Michelangelo",desc:"Renaissance rivalry — painting vs sculpture"},
  {a:"Antonie van Leeuwenhoek",b:"Robert Koch",desc:"first saw microbes → first proved they cause disease"},
  {a:"Élie Metchnikoff",b:"Paul Ehrlich",desc:"cellular vs humoral immunity — both won the Nobel"},
  {a:"Socrates",b:"Diogenes",desc:"philosophy in the agora vs philosophy in the barrel"},
];

const FILTERS = [
  {id:"all",label:"ALL",match:()=>true},
  {id:"was",label:"👻 WAS",match:s=>s.tense==="WAS"},
  {id:"is",label:"🟢 IS",match:s=>s.tense==="IS"},
  {id:"fading",label:"🟡 FADING",match:s=>s.tense==="FADING"},
  {id:"euler",label:"📐 euler",match:s=>s.archetype==="euler"},
  {id:"michelangelo",label:"🎨 michelangelo",match:s=>s.archetype==="michelangelo"},
  {id:"leonardo",label:"🗡️ leonardo",match:s=>s.archetype==="leonardo"},
  {id:"splinter",label:"🐀 splinter",match:s=>s.archetype==="splinter"},
  {id:"microbe",label:"🔬 microbe hunters",match:s=>["Antonie van Leeuwenhoek","Louis Pasteur","Robert Koch","Élie Metchnikoff","Paul Ehrlich","Ronald Ross","Walter Reed"].includes(s.name)},
  {id:"8thday",label:"🧬 eighth day",match:s=>["James Watson","Francis Crick","Rosalind Franklin","Max Perutz","Frederick Sanger","Sydney Brenner","Jacques Monod","Barbara McClintock"].includes(s.name)},
];

let allShadows = [];
let activeFilter = "all";

async function load() {
  try {
    const r = await fetch("/data/shadows/wiki-walkers.json");
    const d = await r.json();
    allShadows = d.shadows || [];
    render();
  } catch(e) {
    document.getElementById("grid").innerHTML = '<div style="padding:40px;color:#e85d3a">Failed to load walker data. Is webpi alive?</div>';
  }
}

function render() {
  const filter = FILTERS.find(f=>f.id===activeFilter) || FILTERS[0];
  const visible = allShadows.filter(filter.match);

  const wasCount = allShadows.filter(s=>s.tense==="WAS").length;
  const isCount = allShadows.filter(s=>s.tense==="IS").length;
  const fadingCount = allShadows.filter(s=>s.tense==="FADING").length;
  const nucleusCount = allShadows.filter(s=>s.anderson==="nucleus").length;

  document.getElementById("stats").innerHTML = `
    <span><span class="s">walkers:</span> <span class="v">${allShadows.length}</span></span>
    <span><span class="s">👻 WAS:</span> <span class="v">${wasCount}</span></span>
    <span><span class="s">🟢 IS:</span> <span class="g">${isCount}</span></span>
    <span><span class="s">🟡 FADING:</span> <span class="f">${fadingCount}</span></span>
    <span><span class="s">🌟 nucleus:</span> <span class="g">${nucleusCount}</span></span>
    <span><span class="s">H = I:</span> <span class="g">true</span></span>
  `;

  document.getElementById("filters").innerHTML = FILTERS.map(f =>
    `<button class="filter-btn ${f.id===activeFilter?'active':''}" onclick="setFilter('${f.id}')">${f.label}</button>`
  ).join("");

  document.getElementById("grid").innerHTML = visible.map(s => {
    const tenseClass = s.anderson==="nucleus" ? "nucleus" : s.tense.toLowerCase();
    const icon = s.anderson==="nucleus" ? "🌟" : s.tense==="WAS" ? "👻" : s.tense==="FADING" ? "🟡" : "🟢";
    const brightness = (s.voxel?.brightness || 0.5) * 100;
    const fillClass = brightness > 50 ? "bright" : "dim";
    return `<div class="card ${tenseClass}">
      <div class="tense ${s.tense.toLowerCase()}">${s.tense}</div>
      <div class="name"><span class="icon">${icon}</span>${s.name}</div>
      <div class="dates">${s.birth||'?'} — ${s.death||'NOW'}</div>
      <div class="arch ${s.archetype}">${s.archetype} campfire</div>
      <div class="extract">${(s.extract||'').substring(0,150)}...</div>
      <div class="merit">${s.merit||''}</div>
      <div class="source">${s.source && s.source!=='self' ? `<a href="${s.source}" target="_blank">→ Wikipedia</a>` : 'self'}</div>
      <div class="voxel-bar"><div class="voxel-fill ${fillClass}" style="width:${brightness}%"></div></div>
    </div>`;
  }).join("");

  document.getElementById("rivalries").innerHTML = RIVALRIES.map(r =>
    `<div class="rivalry">
      <span>${r.a}</span>
      <span class="vs">⚡</span>
      <span>${r.b}</span>
      <span class="desc">${r.desc}</span>
    </div>`
  ).join("");
}

function setFilter(id) {
  activeFilter = id;
  render();
}

// Rotating globe background
const canvas = document.getElementById("globe");
const ctx = canvas.getContext("2d");
let t = 0;
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
function drawGlobe() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cx = canvas.width/2, cy = canvas.height/2;
  const r = Math.min(cx,cy) * 0.6;
  ctx.strokeStyle = "#1a2e1a";
  ctx.lineWidth = 0.5;
  for(let lat=-80;lat<=80;lat+=20){
    ctx.beginPath();
    for(let lon=0;lon<=360;lon+=2){
      const phi=(lat)*Math.PI/180;
      const theta=(lon+t)*Math.PI/180;
      const x=cx+r*Math.cos(phi)*Math.sin(theta);
      const y=cy+r*Math.sin(phi);
      lon===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  for(let lon=0;lon<360;lon+=30){
    ctx.beginPath();
    for(let lat=-90;lat<=90;lat+=2){
      const phi=lat*Math.PI/180;
      const theta=(lon+t)*Math.PI/180;
      const x=cx+r*Math.cos(phi)*Math.sin(theta);
      const y=cy+r*Math.sin(phi);
      lat===-90?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  // Plot walkers as dots
  allShadows.forEach((s,i) => {
    const lat = (i/allShadows.length - 0.5) * 140;
    const lon = (i * 137.5 + t) % 360;
    const phi = lat*Math.PI/180;
    const theta = lon*Math.PI/180;
    const x = cx + r*Math.cos(phi)*Math.sin(theta);
    const y = cy + r*Math.sin(phi);
    const front = Math.cos(phi)*Math.cos(theta);
    if(front > -0.2) {
      ctx.fillStyle = s.anderson==="nucleus" ? "#a371f7" : s.tense==="WAS" ? "#3a5a3a" : "#3fb950";
      ctx.beginPath();
      ctx.arc(x,y,s.anderson==="nucleus"?4:2,0,Math.PI*2);
      ctx.fill();
    }
  });
  t += 0.15;
  requestAnimationFrame(drawGlobe);
}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();
drawGlobe();
load();
</script>
</body>
</html>
