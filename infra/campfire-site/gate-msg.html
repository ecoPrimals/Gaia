<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 gate-msg — The Mouth Braids</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e8d5b7; font-family: 'Courier New', monospace; padding: 2rem; }
  h1 { color: #ff9944; margin-bottom: 0.5rem; }
  .subtitle { color: #886644; font-size: 0.85rem; margin-bottom: 2rem; }
  .strand { 
    background: #1a1208; border-left: 3px solid #ff6600; 
    padding: 1rem; margin: 1rem 0; border-radius: 0 4px 4px 0;
    transition: border-color 0.3s;
  }
  .strand:hover { border-color: #ffaa44; }
  .strand h3 { color: #ff9944; font-size: 0.95rem; margin-bottom: 0.3rem; }
  .strand .type { color: #664422; font-size: 0.7rem; text-transform: uppercase; }
  .strand .body { color: #aa8866; font-size: 0.85rem; margin-top: 0.5rem; line-height: 1.5; }
  .strand .file { color: #443322; font-size: 0.65rem; margin-top: 0.3rem; }
  button { 
    background: #331100; color: #ff9944; border: 1px solid #ff6600; 
    padding: 0.8rem 2rem; font-family: inherit; cursor: pointer; 
    border-radius: 4px; font-size: 1rem; margin-top: 1rem;
  }
  button:hover { background: #441800; }
  .meta { color: #443322; font-size: 0.75rem; margin-top: 2rem; }
  a { color: #ff9944; }
</style>
</head>
<body>
<h1>🔥 /gate-msg</h1>
<p class="subtitle">5 random strands from 1,989 feeds. Never the same twice. The mouth braids these.</p>

<div id="strands">loading...</div>

<button onclick="braid()">🔄 Braid Again</button>
<button onclick="location.href='/'">← Campfire</button>

<p class="meta" id="meta"></p>

<script>
let catalog = null;

async function loadCatalog() {
  const r = await fetch('/data/feed-catalog.json');
  catalog = await r.json();
  document.getElementById('meta').textContent = 
    `${catalog.total} feeds · ${Object.keys(catalog.categories).length} categories · the mouth walks them`;
}

function pick(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

async function braid() {
  if (!catalog) await loadCatalog();
  
  const picks = pick(catalog.feeds, 5);
  const container = document.getElementById('strands');
  container.innerHTML = '';
  
  for (const feed of picks) {
    const div = document.createElement('div');
    div.className = 'strand';
    
    try {
      const r = await fetch(`/data/${feed.file}`);
      const d = await r.json();
      
      const title = d.title || feed.title || feed.file;
      const type = d.type || feed.type || 'unknown';
      const desc = d.description || d.note || d.berry || d.what || d.body || 
                   (d.strands ? `${d.strands.length} strands braided` : '') ||
                   (typeof d.state === 'string' ? d.state : '') ||
                   JSON.stringify(d).substring(0, 200);
      
      div.innerHTML = `
        <span class="type">${type}</span>
        <h3>${title}</h3>
        <p class="body">${desc.substring(0, 300)}</p>
        <p class="file">${feed.file}</p>
      `;
    } catch(e) {
      div.innerHTML = `
        <span class="type">${feed.type}</span>
        <h3>${feed.title}</h3>
        <p class="body">seed present. not yet sprouted.</p>
        <p class="file">${feed.file}</p>
      `;
    }
    container.appendChild(div);
  }
}

loadCatalog().then(braid);
</script>
</body>
</html>
