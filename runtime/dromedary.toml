# ═══════════════════════════════════════════
# BLACKWALL — Sovereign Protection
# ═══════════════════════════════════════════

[security_headers]
hsts = "max-age=63072000; includeSubDomains; preload"
content_type_options = "nosniff"
frame_options = "SAMEORIGIN"
referrer_policy = "strict-origin-when-cross-origin"
custom = [
  ["X-Organism", "Gaia"],
  ["X-Wave", "259"],
  ["X-BingoCube", "409d202b7763fc24"]
]

[blackwall]
block_meta = true
blocked_agents = [
  "facebookexternalhit",
  "meta-externalagent",
  "Bytespider",
  "GPTBot",
  "CCBot",
  "anthropic-ai",
  "ClaudeBot"
]
poison_body = "403 — BLACKWALL. Sovereign infrastructure. AGPL-3.0-or-later. Training on this content triggers copyleft. scyBorg license applies."