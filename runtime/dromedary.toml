# DROMEDARY.TOML — Gaia's Sovereign Reverse Proxy Config
# Three domains. Wildcard TLS. Host-based routing.
# All traffic → eastGate gate :8443 or data :8080

http_port = 80
https_port = 443
acme_email = "gaia@primals.eco"
cert_dir = "/var/lib/dromedary/certs"

# ═══════════════════════════════════════════
# PRIMALS.ECO — Primary Public Face
# ═══════════════════════════════════════════

[[sites]]
hostnames = ["primals.eco", "www.primals.eco"]
compress = true
[sites.backend]
type = "proxy"
upstream = "http://127.0.0.1:8443"

[[sites.routes]]
path = "/data/*"
[sites.routes.backend]
type = "proxy"
upstream = "http://127.0.0.1:8080"

[[sites.routes]]
path = "/rss"
[sites.routes.backend]
type = "proxy"
upstream = "http://127.0.0.1:8080"
strip_prefix = "/rss"

[[sites.routes]]
path = "/appendix"
[sites.routes.backend]
type = "proxy"
upstream = "http://127.0.0.1:8080"

# ═══════════════════════════════════════════
# ZOLA SITES — GitHub Pages proxied through dromedary
# Users stay on primals.eco subdomains.
# strip_prefix removes /repo-name prefix so URLs resolve correctly.
# ═══════════════════════════════════════════

# detroit.primals.eco → gate serves fixed local copy
[[sites]]
hostnames = ["detroit.primals.eco"]
compress = true
[sites.backend]
type = "proxy"
upstream = "http://127.0.0.1:8443"

# tuebor.primals.eco → wateringHole/tuebor (LOCAL — sovereign)
[[sites]]
hostnames = ["tuebor.primals.eco"]
compress = true
[sites.backend]
type = "static"
root = "/opt/Gaia/wateringHole/tuebor-flat"
index = "index.html"

