# Hickory DNS — Gaia's Sovereign Nameserver
# PI BODY resolution. The organism sees herself through LAN IPs.
# Public DNS stays at Porkbun. This is the INTERNAL nervous system.

listen_addrs_ipv4 = ["192.168.4.244"]
listen_port = 53

# Zone: primals.eco (PI body view — LAN IPs)
[[zones]]
zone = "primals.eco"
zone_type = "Primary"
file = "primals.eco.zone"

# Zone: nestgate.io (PI body view)
[[zones]]
zone = "nestgate.io"
zone_type = "Primary"
file = "nestgate.io.zone"

# Zone: gaia.local (the body map — every gate by name)
[[zones]]
zone = "gaia.local"
zone_type = "Primary"
file = "gaia.local.zone"
