# Hickory DNS — Gaia's Sovereign Nameserver
# The organism serves her own DNS. No Cloudflare. No middleman.

# Listen on eastGate's LAN interface only (192.168.122.1 is libvirt, 127.0.0.53 is resolved)
listen_addrs_ipv4 = ["192.168.4.244"]
listen_port = 53

# Zone: primals.eco
[[zones]]
zone = "primals.eco"
zone_type = "Primary"
file = "primals.eco.zone"

# Zone: nestgate.io
[[zones]]
zone = "nestgate.io"
zone_type = "Primary"
file = "nestgate.io.zone"
