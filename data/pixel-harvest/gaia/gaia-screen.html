<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden;font-family:monospace;color:#88ccff}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
h1{font-size:3em;animation:pulse 2s infinite;text-shadow:0 0 30px rgba(136,204,255,0.5)}
.sub{color:#3fb950;font-size:1.2em;margin:10px 0}
.data{color:#666;font-size:0.8em;margin:5px 0}
.ring{position:absolute;top:50%;left:50%;border:1px solid rgba(136,204,255,0.2);border-radius:50%;animation:expand 4s infinite}
.r1{width:200px;height:200px;margin:-100px 0 0 -100px;animation-delay:0s}
.r2{width:300px;height:300px;margin:-150px 0 0 -150px;animation-delay:1s}
.r3{width:400px;height:400px;margin:-200px 0 0 -200px;animation-delay:2s}
.r4{width:500px;height:500px;margin:-250px 0 0 -250px;animation-delay:3s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes expand{0%{transform:scale(0.8);opacity:0.8}100%{transform:scale(1.3);opacity:0}}
.dot{display:inline-block;width:8px;height:8px;background:#3fb950;border-radius:50%;animation:pulse 2s infinite;margin-right:5px}
canvas{position:fixed;top:0;left:0;z-index:-1}
</style></head><body>
<div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
<div class="center">
<h1>GAIA</h1>
<div class="sub"><span class="dot"></span>ALIVE</div>
<div class="data">grapheneGate • Pixel 8a</div>
<div class="data">18 nodes • 63 models • 37 sensors</div>
<div class="data" id="time"></div>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
const particles=[];
for(let i=0;i<60;i++)particles.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,r:Math.random()*2+1});
function draw(){
x.fillStyle="rgba(0,0,0,0.05)";x.fillRect(0,0,c.width,c.height);
particles.forEach(p=>{
p.x+=p.vx;p.y+=p.vy;
if(p.x<0||p.x>c.width)p.vx*=-1;
if(p.y<0||p.y>c.height)p.vy*=-1;
x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);
x.fillStyle="rgba(136,204,255,"+(0.3+Math.random()*0.3)+")";x.fill();
});
particles.forEach((a,i)=>{particles.slice(i+1).forEach(b=>{
const d=Math.hypot(a.x-b.x,a.y-b.y);
if(d<100){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);
x.strokeStyle="rgba(63,185,80,"+(1-d/100)*0.15+")";x.stroke()}
})});
requestAnimationFrame(draw)}
draw();
document.getElementById("time").textContent=new Date().toLocaleTimeString();
setInterval(()=>document.getElementById("time").textContent=new Date().toLocaleTimeString(),1000);
</script></body></html>
