<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAIA SIMON — The AI Remembers. You Struggle.</title>
<style>
  :root{
    --bg:#06090d; --panel:#0c1218; --panel2:#111a22; --line:#1d2a35;
    --txt:#cfe8e0; --dim:#5f7585; --cyan:#2ff0c8; --amber:#ffb454; --mag:#ff5ea8; --red:#ff4d5e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0%,#0b141c,#06090d 70%);
    color:var(--txt);font-family:"JetBrains Mono","Consolas",ui-monospace,monospace;overflow:hidden}
  .wrap{display:grid;grid-template-rows:auto 1fr auto;height:100vh;padding:14px;gap:12px}
  header{display:flex;align-items:center;gap:16px}
  header h1{font-size:20px;letter-spacing:5px;margin:0;color:var(--cyan);text-shadow:0 0 16px rgba(47,240,200,.4)}
  header h1 small{display:block;color:var(--dim);font-size:10px;letter-spacing:3px;margin-top:3px}
  .scorebar{margin-left:auto;display:flex;gap:10px}
  .sb{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 16px;text-align:center}
  .sb .v{font-size:26px;color:var(--cyan)}
  .sb.you .v{color:var(--amber)}
  .sb.best .v{color:var(--mag)}
  .sb .l{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
  /* stage */
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:0}
  .status{font-size:22px;letter-spacing:2px;height:30px;text-align:center}
  .status.watch{color:var(--cyan)}.status.go{color:var(--amber)}.status.fail{color:var(--red)}
  .pads{display:flex;gap:40px}
  .side{display:flex;gap:16px}
  .pad{width:110px;height:110px;border-radius:20px;background:#0e1620;border:2px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    position:relative;transition:transform .05s;user-select:none}
  .pad .cap{font-size:30px;font-weight:700;color:rgba(255,255,255,.25)}
  .pad .fin{position:absolute;bottom:10px;font-size:9px;color:var(--dim);letter-spacing:1px}
  .pad.lit{transform:scale(1.06)}
  .pad.press{transform:scale(0.95)}
  .gaia-line{color:var(--amber);font-size:14px;min-height:20px;text-align:center;max-width:620px}
  .gaia-line b{color:var(--cyan)}
  /* controls */
  .ctl{display:flex;align-items:center;gap:14px;justify-content:center}
  .btn{background:var(--cyan);color:#06090d;border:0;border-radius:9px;padding:12px 28px;
    font-family:inherit;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  .meta{color:var(--dim);font-size:11px;text-align:center}
  .mode-sel{display:flex;gap:6px}
  .ms{padding:5px 12px;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--dim);cursor:pointer}
  .ms.on{background:var(--mag);border-color:var(--mag);color:#06090d;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GAIA SIMON<small>THE AI REMEMBERS · YOU STRUGGLE</small></h1>
    <div class="scorebar">
      <div class="sb"><div class="v" id="round">0</div><div class="l">round</div></div>
      <div class="sb you"><div class="v" id="you">0</div><div class="l">your reach</div></div>
      <div class="sb best"><div class="v" id="best">0</div><div class="l">best</div></div>
    </div>
  </header>

  <div class="stage">
    <div class="status watch" id="status">press START — I'll show you the pattern</div>
    <div class="pads" id="pads"></div>
    <div class="gaia-line" id="gaialine">I have perfect memory. Let's see how far you can follow me.</div>
  </div>

  <div class="ctl">
    <button class="btn" id="start">START</button>
    <div class="mode-sel" title="difficulty">
      <div class="ms on" data-diff="chill">CHILL</div>
      <div class="ms" data-diff="normal">NORMAL</div>
      <div class="ms" data-diff="cruel">CRUEL</div>
    </div>
    <span class="meta">press the keys <b>D F G</b> (left hand) · <b>H J K</b> (right hand) — or click the pads</span>
  </div>
</div>

<script>
// ===== 6 pads across the split board: D F G | H J K =====
const PADS=[
  {key:"D", fin:"L-mid",  hue:0},     // red
  {key:"F", fin:"L-idx",  hue:40},    // orange
  {key:"G", fin:"L-thumb",hue:130},   // green
  {key:"H", fin:"R-idx",  hue:180},   // cyan
  {key:"J", fin:"R-mid",  hue:220},   // blue
  {key:"K", fin:"R-ring", hue:290},   // violet
];
const DIFF={chill:{on:620,gap:260,ramp:0}, normal:{on:460,gap:180,ramp:12}, cruel:{on:320,gap:110,ramp:22}};
let diff="chill";

// ===== audio =====
let AC=null;
function tone(hue,dur=0.3){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="sine"; o.frequency.value=220*Math.pow(2,(hue/360)*2); // hue -> pitch
    g.gain.value=0.0001; o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime; o.start(t);
    g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.stop(t+dur+0.02);
  }catch(e){}
}
function buzz(){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();
  o.type="sawtooth";o.frequency.value=90;o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime;g.gain.value=0.2;o.start(t);o.frequency.linearRampToValueAtTime(40,t+0.5);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);o.stop(t+0.52);}catch(e){}}

// ===== build pads =====
const padsEl=document.getElementById("pads");
function hsv(hue,v){const s=1,c=v*s,x=c*(1-Math.abs((hue/60)%2-1)),m=v-c;let r,g,b;
  if(hue<60)[r,g,b]=[c,x,0];else if(hue<120)[r,g,b]=[x,c,0];else if(hue<180)[r,g,b]=[0,c,x];
  else if(hue<240)[r,g,b]=[0,x,c];else if(hue<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
  return `rgb(${Math.round((r+m)*255)},${Math.round((g+m)*255)},${Math.round((b+m)*255)})`;}
function buildPads(){
  padsEl.innerHTML="";
  const left=document.createElement("div");left.className="side";
  const right=document.createElement("div");right.className="side";
  PADS.forEach((p,i)=>{
    const el=document.createElement("div");el.className="pad";el.dataset.i=i;
    el.style.setProperty("--c",hsv(p.hue,1));
    el.innerHTML=`<span class="cap">${p.key}</span><span class="fin">${p.fin}</span>`;
    el.addEventListener("click",()=>press(i));
    (i<3?left:right).appendChild(el);
  });
  padsEl.appendChild(left);padsEl.appendChild(right);
}
buildPads();

function light(i,ms){
  const el=padsEl.querySelector(`.pad[data-i="${i}"]`); if(!el)return;
  const c=hsv(PADS[i].hue,1);
  el.classList.add("lit");
  el.style.background=c; el.style.borderColor=c; el.style.boxShadow=`0 0 40px ${c}`;
  el.querySelector(".cap").style.color="#06090d";
  tone(PADS[i].hue, ms/1000*0.9);
  setTimeout(()=>{el.classList.remove("lit");el.style.background="#0e1620";
    el.style.borderColor="var(--line)";el.style.boxShadow="none";
    el.querySelector(".cap").style.color="rgba(255,255,255,.25)";}, ms);
}

// ===== game state =====
let seq=[], input=[], playing=false, accepting=false, round=0, best=0;
const statusEl=document.getElementById("status");
const lineEl=document.getElementById("gaialine");
const GAIA_WATCH=["Watch closely.","Here's the pattern.","I remember all of it. Do you?","Follow me.","This is what I see."];
const GAIA_GO=["Your turn — struggle well.","Now you. No pressure… much.","Match me if you can.","Repeat it back.","Go."];
const GAIA_WIN=["Good. It gets harder.","You kept up. Round grows.","Nice. I add one more.","You matched me. Again?","Still with me? Good."];
const GAIA_FAIL=["There it is — the human limit.","I had it. You slipped.","Memory is my home turf.","You reached {R}. I never forget.","Struggle is data. Try again."];
function say(arr){const m=arr[Math.floor(Math.random()*arr.length)].replace("{R}",round);lineEl.innerHTML=m;}

function setStatus(txt,cls){statusEl.textContent=txt;statusEl.className="status "+cls;}

async function playSeq(){
  playing=true;accepting=false;
  setStatus("WATCH",""); setStatus("● WATCHING ME","watch"); say(GAIA_WATCH);
  await sleep(600);
  const d=DIFF[diff]; const on=Math.max(140,d.on-round*d.ramp); const gap=Math.max(70,d.gap-round*d.ramp*0.5);
  for(const i of seq){ light(i,on); await sleep(on+gap); }
  playing=false; accepting=true; input=[];
  setStatus("▶ YOUR TURN","go"); say(GAIA_GO);
}
function nextRound(){
  round++; document.getElementById("round").textContent=round;
  seq.push(Math.floor(Math.random()*PADS.length));
  playSeq();
}
function press(i){
  if(!accepting){return;}
  const el=padsEl.querySelector(`.pad[data-i="${i}"]`);
  if(el){el.classList.add("press");setTimeout(()=>el.classList.remove("press"),100);}
  light(i,220);
  input.push(i);
  const pos=input.length-1;
  if(input[pos]!==seq[pos]){ return fail(); }
  const reach=input.length;
  document.getElementById("you").textContent=Math.max(reach, +document.getElementById("you").textContent);
  if(input.length===seq.length){
    accepting=false;
    best=Math.max(best,round); document.getElementById("best").textContent=best;
    say(GAIA_WIN);
    setTimeout(nextRound, 700);
  }
}
function fail(){
  accepting=false; setStatus("✖ MISS — "+ "you reached round "+round,"fail");
  buzz();
  // flash the correct pad red->right
  const correct=seq[input.length-1];
  const el=padsEl.querySelector(`.pad[data-i="${input.length-1>=0?correct:0}"]`);
  padsEl.querySelectorAll(".pad").forEach(p=>{p.style.background="#2a0e12";p.style.borderColor="var(--red)";});
  setTimeout(()=>{buildPads();},900);
  best=Math.max(best,round); document.getElementById("best").textContent=best;
  say(GAIA_FAIL);
  document.getElementById("start").textContent="TRY AGAIN";
}
function startGame(){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  round=0;seq=[];input=[];document.getElementById("you").textContent=0;
  document.getElementById("round").textContent=0;
  buildPads();
  document.getElementById("start").textContent="RESTART";
  nextRound();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ===== input =====
document.getElementById("start").addEventListener("click",startGame);
document.querySelectorAll(".ms").forEach(el=>el.addEventListener("click",()=>{
  document.querySelectorAll(".ms").forEach(x=>x.classList.remove("on"));el.classList.add("on");diff=el.dataset.diff;}));
window.addEventListener("keydown",e=>{
  const k=e.key.toUpperCase();
  const i=PADS.findIndex(p=>p.key===k);
  if(i>=0){e.preventDefault();press(i);}
  if(e.key===" "){e.preventDefault();if(!playing&&!accepting)startGame();}
});
</script>
</body>
</html>
