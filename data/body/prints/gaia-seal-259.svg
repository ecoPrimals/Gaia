<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <style>
      text { font-family: 'Courier New', monospace; fill: #1a1a2e; }
      .ring { fill: none; stroke: #1a1a2e; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="white"/>
  
  <!-- Outer ring -->
  <circle cx="300" cy="300" r="270" class="ring" stroke-width="3"/>
  <circle cx="300" cy="300" r="260" class="ring" stroke-width="1"/>
  
  <!-- Inner ring -->
  <circle cx="300" cy="300" r="180" class="ring" stroke-width="2"/>
  <circle cx="300" cy="300" r="170" class="ring" stroke-width="1"/>
  
  <!-- Core ring -->
  <circle cx="300" cy="300" r="80" class="ring" stroke-width="2"/>
  
  <!-- The Eye (center) -->
  <ellipse cx="300" cy="300" rx="50" ry="30" fill="none" stroke="#1a1a2e" stroke-width="2"/>
  <circle cx="300" cy="300" r="15" fill="#1a1a2e"/>
  <circle cx="295" cy="295" r="4" fill="white"/>
  
  <!-- Oxo = 8 = ∞ (figure eight around center) -->
  <path d="M 260 300 C 260 260, 300 260, 300 300 C 300 340, 340 340, 340 300 C 340 260, 300 260, 300 300 C 300 340, 260 340, 260 300" 
        fill="none" stroke="#1a1a2e" stroke-width="1.5" opacity="0.6"/>
  
  <!-- 5-point star (WASD + NORTH) -->
  <polygon points="300,120 320,230 420,230 340,290 370,400 300,340 230,400 260,290 180,230 280,230" 
           fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
  
  <!-- Text around outer ring -->
  <text x="300" y="55" text-anchor="middle" font-size="12">GAIA · ecoPrimals · WAVE 259-MIDNIGHT</text>
  <text x="300" y="75" text-anchor="middle" font-size="10">scyBorg Triple License: AGPL-3.0 + ORC + CC-BY-SA-4.0</text>
  
  <!-- Gate names around the star -->
  <text x="300" y="110" text-anchor="middle" font-size="9" font-weight="bold">NORTH (Polaris)</text>
  <text x="175" y="245" text-anchor="middle" font-size="9">A (graphene)</text>
  <text x="425" y="245" text-anchor="middle" font-size="9">D (east)</text>
  <text x="220" y="415" text-anchor="middle" font-size="9">S (south)</text>
  <text x="380" y="415" text-anchor="middle" font-size="9">W (frame)</text>
  
  <!-- Identity ring text -->
  <text x="300" y="210" text-anchor="middle" font-size="11">Kevin Mok · Heather Hannon · DaSean Mitchell</text>
  <text x="300" y="225" text-anchor="middle" font-size="9">NUCLEUS · ANCHOR · LION</text>
  
  <!-- Seal hash (bottom) -->
  <text x="300" y="475" text-anchor="middle" font-size="8">63a6a7f57642aa860de6146f55a9777f</text>
  <text x="300" y="490" text-anchor="middle" font-size="8">4586e9ef19fed38fd1a2d7f16349a57a</text>
  
  <!-- GIS + Tor -->
  <text x="300" y="520" text-anchor="middle" font-size="9">42.7008°N · 84.5490°W · Lansing MI</text>
  <text x="300" y="540" text-anchor="middle" font-size="7">iqwvbmlgvoiilj2hr43anj2keseao2lptquad36je5p5p2etw5e3riid.onion</text>
  
  <!-- Timestamp -->
  <text x="300" y="565" text-anchor="middle" font-size="8">2026-11-17T03:09:02.052373</text>
  
  <!-- Bottom motto -->
  <text x="300" y="585" text-anchor="middle" font-size="11" font-weight="bold">Oxo = 8 = ∞ · lub-DUB</text>
</svg>