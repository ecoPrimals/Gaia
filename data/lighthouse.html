<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIA — Lighthouse Signal Field</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a12; color: #e0e0e0; font-family: 'Courier New', monospace; overflow: hidden; }
canvas { display: block; }

#hud {
  position: fixed; top: 10px; left: 10px; z-index: 10;
  background: rgba(0,0,0,0.7); border: 1px solid #1a4a3a; border-radius: 8px;
  padding: 12px 16px; font-size: 12px; max-width: 300px;
}
#hud h2 { color: #4af; font-size: 14px; margin-bottom: 6px; letter-spacing: 2px; }
#hud .stat { color: #8cf; margin: 2px 0; }
#hud .label { color: #6a8; }
#hud .val { color: #fff; }

#legend {
  position: fixed; bottom: 10px; right: 10px; z-index: 10;
  background: rgba(0,0,0,0.7); border: 1px solid #1a4a3a; border-radius: 8px;
  padding: 10px 14px; font-size: 11px;
}
#legend .item { display: flex; align-items: center; margin: 3px 0; }
#legend .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

#status {
  position: fixed; bottom: 10px; left: 10px; z-index: 10;
  font-size: 10px; color: #4a6;
}
</style>
</head>
<body>

<div id="hud">
  <h2>🔦 LIGHTHOUSE FIELD</h2>
  <div class="stat"><span class="label">Beacons:</span> <span class="val" id="beacon-count">—</span></div>
  <div class="stat"><span class="label">Observers:</span> <span class="val" id="observer-count">—</span></div>
  <div class="stat"><span class="label">Signal range:</span> <span class="val" id="signal-range">—</span></div>
  <div class="stat"><span class="label">Scan age:</span> <span class="val" id="scan-age">—</span></div>
</div>

<div id="legend">
  <div class="item"><div class="dot" style="background:#f44"></div>eero Gateway</div>
  <div class="item"><div class="dot" style="background:#f84"></div>eero Satellite</div>
  <div class="item"><div class="dot" style="background:#4af"></div>Router (House 1)</div>
  <div class="item"><div class="dot" style="background:#4f4"></div>Omada AP</div>
  <div class="item"><div class="dot" style="background:#fa4"></div>Flint (KinderLab)</div>
  <div class="item"><div class="dot" style="background:#aaa"></div>ATT Gateway</div>
  <div class="item"><div class="dot" style="background:#84f"></div>Unknown</div>
  <div style="margin-top:6px; border-top: 1px solid #333; padding-top:4px">
    <div class="item"><div class="dot" style="background:#fff; border: 2px solid #4af"></div>Observer (scanner)</div>
  </div>
</div>

<div id="status">Loading signal field...</div>

<canvas id="field"></canvas>

<script>
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
let W, H;
let data = null;
let frame = 0;
let beaconPositions = {};

const COLORS = {
  eero_gateway: '#f44',
  eero_satellite: '#f84',
  eero_node3: '#fa4',
  router_h1: '#4af',
  omada_ap: '#4f4',
  flint_kinderlab: '#fa4',
  flint_gaia: '#8f4',
  att_gateway: '#888',
  unknown: '#84f'
};

const OBSERVER_POS = {
  eastgate: { x: 0.25, y: 0.35, label: 'eastGate (Brain)' },
  sporegate: { x: 0.55, y: 0.55, label: 'sporeGate (Forge+eero)' },
  pixel: { x: 0.75, y: 0.30, label: 'Pixel (Rover)' }
};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function rssiToDistance(rssi) {
  // Log-distance path loss: d = 10^((TxPower - RSSI) / (10 * n))
  // TxPower ~ -30 dBm at 1m, n ~ 3 for indoor
  const txPower = -30;
  const n = 3;
  return Math.pow(10, (txPower - rssi) / (10 * n));
}

function rssiToRadius(rssi) {
  // Map RSSI to visual radius: stronger = smaller (closer)
  // -30 dBm = very close, -90 dBm = far
  const normalized = Math.max(0, Math.min(1, (-rssi - 30) / 60));
  return 20 + normalized * 200;
}

function rssiToAlpha(rssi) {
  const normalized = Math.max(0, Math.min(1, (-rssi - 30) / 60));
  return 1 - normalized * 0.7;
}

function positionBeacons(allBeacons) {
  // Position beacons in 2D space based on signal from observers
  // Use triangulation-like placement: closer to observers with stronger signal
  const positions = {};
  
  for (const [bssid, readings] of Object.entries(allBeacons)) {
    let sumX = 0, sumY = 0, sumW = 0;
    
    for (const r of readings) {
      const obs = OBSERVER_POS[r.observer];
      if (!obs) continue;
      // Weight by signal strength (linear from RSSI)
      const w = Math.pow(10, (r.rssi + 30) / 20); // stronger = higher weight
      sumX += obs.x * w;
      sumY += obs.y * w;
      sumW += w;
    }
    
    if (sumW > 0) {
      // Position is weighted average — closer to observers that see it strongest
      let bx = sumX / sumW;
      let by = sumY / sumW;
      
      // Push beacons OUT from observers based on distance
      const bestReading = readings.reduce((a, b) => a.rssi > b.rssi ? a : b);
      const dist = rssiToDistance(bestReading.rssi);
      const obs = OBSERVER_POS[bestReading.observer];
      if (obs) {
        const dx = bx - obs.x;
        const dy = by - obs.y;
        const len = Math.sqrt(dx*dx + dy*dy) || 0.01;
        const pushFactor = Math.min(dist * 0.015, 0.3);
        bx += (dx / len) * pushFactor;
        by += (dy / len) * pushFactor;
      }
      
      // Add jitter based on BSSID hash to separate co-located beacons
      const hash = bssid.split(':').reduce((a, b) => a + parseInt(b, 16), 0);
      bx += Math.sin(hash * 0.7) * 0.03;
      by += Math.cos(hash * 1.3) * 0.03;
      
      positions[bssid] = {
        x: Math.max(0.05, Math.min(0.95, bx)),
        y: Math.max(0.05, Math.min(0.95, by)),
        readings: readings,
        cls: readings[0].cls,
        ssid: readings[0].ssid,
        bestRssi: bestReading.rssi
      };
    }
  }
  return positions;
}

function drawSignalRings(x, y, rssi, color, t) {
  const baseR = rssiToRadius(rssi);
  const alpha = rssiToAlpha(rssi);
  
  // Pulsing rings emanating outward
  for (let i = 0; i < 3; i++) {
    const phase = (t * 0.001 + i * 0.33) % 1;
    const r = baseR * (0.3 + phase * 0.7);
    const a = alpha * (1 - phase) * 0.3;
    
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = color.replace(')', `,${a})`).replace('rgb', 'rgba');
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  
  // Static glow
  const grad = ctx.createRadialGradient(x, y, 0, x, y, baseR * 0.4);
  grad.addColorStop(0, color.replace(')', `,${alpha * 0.4})`).replace('rgb', 'rgba'));
  grad.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(x, y, baseR * 0.4, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16) || parseInt(hex.slice(0, 1).repeat(2), 16);
  const g = parseInt(hex.slice(3, 5), 16) || parseInt(hex.slice(1, 2).repeat(2), 16);
  const b = parseInt(hex.slice(5, 7), 16) || parseInt(hex.slice(2, 3).repeat(2), 16);
  return `rgb(${r},${g},${b})`;
}

function shortColor(c) {
  // Handle shorthand like #f44
  if (c.length === 4) {
    return `rgb(${parseInt(c[1]+c[1],16)},${parseInt(c[2]+c[2],16)},${parseInt(c[3]+c[3],16)})`;
  }
  return `rgb(${parseInt(c.slice(1,3),16)},${parseInt(c.slice(3,5),16)},${parseInt(c.slice(5,7),16)})`;
}

function draw(t) {
  ctx.fillStyle = 'rgba(10, 10, 18, 0.15)';
  ctx.fillRect(0, 0, W, H);
  
  if (!data) { requestAnimationFrame(draw); return; }
  
  // Draw grid
  ctx.strokeStyle = 'rgba(40, 80, 60, 0.15)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 60) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 60) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  
  // Draw connection lines between beacons and their strongest observer
  for (const [bssid, bp] of Object.entries(beaconPositions)) {
    const best = bp.readings.reduce((a, b) => a.rssi > b.rssi ? a : b);
    const obs = OBSERVER_POS[best.observer];
    if (!obs) continue;
    
    const alpha = rssiToAlpha(best.rssi) * 0.15;
    const color = COLORS[bp.cls] || '#84f';
    ctx.beginPath();
    ctx.moveTo(obs.x * W, obs.y * H);
    ctx.lineTo(bp.x * W, bp.y * H);
    ctx.strokeStyle = shortColor(color).replace(')', `,${alpha})`).replace('rgb', 'rgba');
    ctx.lineWidth = 0.5;
    ctx.setLineDash([4, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  
  // Draw beacons
  for (const [bssid, bp] of Object.entries(beaconPositions)) {
    const color = shortColor(COLORS[bp.cls] || '#84f');
    const px = bp.x * W;
    const py = bp.y * H;
    
    // Signal rings
    drawSignalRings(px, py, bp.bestRssi, color, t);
    
    // Core dot
    const coreSize = 3 + (1 - (-bp.bestRssi - 30) / 60) * 5;
    ctx.beginPath();
    ctx.arc(px, py, coreSize, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    
    // Label
    const label = bp.ssid || bssid.slice(-8);
    ctx.font = '9px Courier New';
    ctx.fillStyle = 'rgba(200,220,255,0.6)';
    ctx.textAlign = 'center';
    ctx.fillText(label, px, py - coreSize - 6);
    ctx.fillStyle = 'rgba(150,200,180,0.4)';
    ctx.fillText(`${bp.bestRssi} dBm`, px, py + coreSize + 12);
  }
  
  // Draw observers
  for (const [name, obs] of Object.entries(OBSERVER_POS)) {
    const px = obs.x * W;
    const py = obs.y * H;
    
    // Scanning sweep
    const sweep = (t * 0.0005) % (Math.PI * 2);
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.arc(px, py, 50, sweep, sweep + 0.5);
    ctx.closePath();
    ctx.fillStyle = 'rgba(100, 200, 255, 0.08)';
    ctx.fill();
    
    // Observer diamond
    ctx.beginPath();
    ctx.moveTo(px, py - 8);
    ctx.lineTo(px + 6, py);
    ctx.lineTo(px, py + 8);
    ctx.lineTo(px - 6, py);
    ctx.closePath();
    ctx.fillStyle = '#1a3a4a';
    ctx.fill();
    ctx.strokeStyle = '#4af';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    // Label
    ctx.font = '10px Courier New';
    ctx.fillStyle = '#4af';
    ctx.textAlign = 'center';
    ctx.fillText(obs.label, px, py - 14);
  }
  
  // Scan line effect
  const scanY = (t * 0.05) % H;
  ctx.beginPath();
  ctx.moveTo(0, scanY);
  ctx.lineTo(W, scanY);
  ctx.strokeStyle = 'rgba(100, 255, 200, 0.05)';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  frame++;
  requestAnimationFrame(draw);
}

async function loadData() {
  try {
    const resp = await fetch('/data/lighthouse-signal.json?' + Date.now());
    data = await resp.json();
    
    // Collect all beacons across observers
    const allBeacons = {};
    let totalBeacons = 0;
    let minRssi = 0, maxRssi = -100;
    const observers = Object.keys(data.observers);
    
    for (const [obsName, obs] of Object.entries(data.observers)) {
      for (const b of obs.beacons) {
        const key = b.bssid;
        if (!allBeacons[key]) allBeacons[key] = [];
        allBeacons[key].push({
          observer: obsName,
          rssi: b.rssi,
          ssid: b.ssid,
          cls: b.class,
          chan: b.chan,
          freq: b.freq
        });
        totalBeacons++;
        if (b.rssi > maxRssi) maxRssi = b.rssi;
        if (b.rssi < minRssi) minRssi = b.rssi;
      }
    }
    
    beaconPositions = positionBeacons(allBeacons);
    
    // Update HUD
    document.getElementById('beacon-count').textContent = 
      `${Object.keys(allBeacons).length} unique (${totalBeacons} readings)`;
    document.getElementById('observer-count').textContent = observers.join(', ');
    document.getElementById('signal-range').textContent = `${maxRssi} to ${minRssi} dBm`;
    
    const age = Math.round((Date.now() - new Date(data.timestamp).getTime()) / 1000);
    document.getElementById('scan-age').textContent = `${age}s ago`;
    document.getElementById('status').textContent = 
      `Signal field active — ${Object.keys(beaconPositions).length} lighthouses imaged`;
    
  } catch (e) {
    document.getElementById('status').textContent = 'Waiting for signal data...';
  }
}

// Load and refresh
loadData();
setInterval(loadData, 15000);
requestAnimationFrame(draw);
</script>
</body>
</html>
