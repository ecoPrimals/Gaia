// =====================
// VITRUVIAN BODY MAP
// Positions as fractions of the figure bounding box
// =====================
function bodyPos(tag, figCx, figCy, figR) {
  const s = figR; // scale factor = radius of circle
  const map = {
    // Head — crown region
    'forehead':     { x: 0,     y: -0.88 },
    'head-left':    { x: -0.10, y: -0.76 },
    'head-right':   { x:  0.10, y: -0.76 },
    // Ears — flanking wide
    'ear-left':     { x: -0.22, y: -0.74 },
    'ear-right':    { x:  0.22, y: -0.74 },
    'ear-inner':    { x:  0,    y: -0.70 },
    // Nose — center face
    'nose-left':    { x: -0.05, y: -0.65 },
    'nose-right':   { x:  0.05, y: -0.65 },
    // Mouth — jaw area, spread wider
    'mouth-left':   { x: -0.10, y: -0.56 },
    'mouth-center': { x:  0,    y: -0.56 },
    'mouth-right':  { x:  0.10, y: -0.56 },
    // Tongue — throat/chin, spread wider
    'tongue-left':  { x: -0.10, y: -0.47 },
    'tongue-center':{ x:  0,    y: -0.47 },
    'tongue-right': { x:  0.10, y: -0.47 },
    // Torso — chest & belly, vertically spaced
    'heart':        { x: -0.06, y: -0.25 },
    'spine':        { x:  0,    y: -0.05 },
    'belly':        { x:  0,    y:  0.12 },
    'torso-skin':   { x:  0.10, y: -0.15 },
    // Arms/Hands (spread wide — Vitruvian T-pose)
    'hand-left':    { x: -0.68, y: -0.22 },
    'hand-right':   { x:  0.68, y: -0.22 },
    // Legs/Feet (spread)
    'foot-left':    { x: -0.25, y:  0.60 },
    'foot-right':   { x:  0.25, y:  0.60 },
  };
  const p = map[tag] || { x: 0, y: 0 };
  return { x: figCx + p.x * s, y: figCy + p.y * s };
}

// =====================
// DRAW VITRUVIAN FIGURE
// =====================
function drawVitruvianFrame(cx, cy, R) {
  const now = Date.now();

  // === CIRCLE (da Vinci's circle of proportion) ===
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(180,150,100,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // === SQUARE ===
  const sqHalf = R * 0.78;
  ctx.beginPath();
  ctx.rect(cx - sqHalf, cy - sqHalf, sqHalf * 2, sqHalf * 2);
  ctx.strokeStyle = 'rgba(180,150,100,0.10)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // === HUMAN SILHOUETTE (line drawing) ===
  const a = 0.06; // alive-dependent alpha
  ctx.strokeStyle = `rgba(200,180,140,0.15)`;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Helper: body point shortcut
  const bp = (tag) => bodyPos(tag, cx, cy, R);

  // Head circle — larger
  const headCenter = { x: cx, y: cy - R * 0.74 };
  const headR = R * 0.16;
  ctx.beginPath();
  ctx.arc(headCenter.x, headCenter.y, headR, 0, Math.PI * 2);
  ctx.stroke();

  // Neck
  ctx.beginPath();
  ctx.moveTo(cx, headCenter.y + headR);
  ctx.lineTo(cx, cy - R * 0.40);
  ctx.stroke();

  // Shoulders — wider
  ctx.beginPath();
  ctx.moveTo(cx - R * 0.25, cy - R * 0.38);
  ctx.lineTo(cx + R * 0.25, cy - R * 0.38);
  ctx.stroke();

  // Torso sides
  ctx.beginPath();
  ctx.moveTo(cx - R * 0.20, cy - R * 0.38);
  ctx.lineTo(cx - R * 0.15, cy + R * 0.18);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + R * 0.20, cy - R * 0.38);
  ctx.lineTo(cx + R * 0.15, cy + R * 0.18);
  ctx.stroke();

  // Spine — dashed, subtle
  ctx.beginPath();
  ctx.moveTo(cx, cy - R * 0.40);
  ctx.lineTo(cx, cy + R * 0.18);
  ctx.strokeStyle = 'rgba(200,180,140,0.08)';
  ctx.setLineDash([3, 6]); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(200,180,140,0.15)';

  // Arms spread (Vitruvian T-pose) — to the hands
  ctx.beginPath();
  ctx.moveTo(cx - R * 0.25, cy - R * 0.38);
  ctx.lineTo(cx - R * 0.45, cy - R * 0.28);
  ctx.lineTo(cx - R * 0.68, cy - R * 0.22);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + R * 0.25, cy - R * 0.38);
  ctx.lineTo(cx + R * 0.45, cy - R * 0.28);
  ctx.lineTo(cx + R * 0.68, cy - R * 0.22);
  ctx.stroke();

  // Legs spread
  ctx.beginPath();
  ctx.moveTo(cx - R * 0.10, cy + R * 0.18);
  ctx.lineTo(cx - R * 0.25, cy + R * 0.60);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + R * 0.10, cy + R * 0.18);
  ctx.lineTo(cx + R * 0.25, cy + R * 0.60);
  ctx.stroke();

  // Hips
  ctx.beginPath();
  ctx.moveTo(cx - R * 0.15, cy + R * 0.18);
  ctx.lineTo(cx + R * 0.15, cy + R * 0.18);
  ctx.stroke();

  // === SECOND POSE (arms up + legs wide, like da Vinci) ===
  ctx.strokeStyle = 'rgba(200,180,140,0.07)';
  // Arms raised
  ctx.beginPath();
  ctx.moveTo(cx - R * 0.22, cy - R * 0.38);
  ctx.lineTo(cx - R * 0.50, cy - R * 0.55);
  ctx.lineTo(cx - R * 0.72, cy - R * 0.68);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + R * 0.22, cy - R * 0.38);
  ctx.lineTo(cx + R * 0.50, cy - R * 0.55);
  ctx.lineTo(cx + R * 0.72, cy - R * 0.68);
  ctx.stroke();
  // Legs wider
  ctx.beginPath();
  ctx.moveTo(cx - R * 0.08, cy + R * 0.18);
  ctx.lineTo(cx - R * 0.42, cy + R * 0.58);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + R * 0.08, cy + R * 0.18);
  ctx.lineTo(cx + R * 0.42, cy + R * 0.58);
  ctx.stroke();

  // === Golden ratio spiral hint ===
  ctx.strokeStyle = 'rgba(255,215,0,0.04)';
  ctx.beginPath();
  for (let t = 0; t < Math.PI * 6; t += 0.05) {
    const gr = R * 0.02 * Math.exp(0.15 * t);
    const gx = cx + Math.cos(t + now * 0.0001) * gr;
    const gy = cy - R * 0.15 + Math.sin(t + now * 0.0001) * gr;
    if (t === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
    if (gr > R) break;
  }
  ctx.stroke();

  // === Proportion text (da Vinci style) ===
  ctx.font = '8px Courier New';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(180,150,100,0.12)';
  ctx.fillText('φ = 1.618...', cx + R * 0.5, cy + R * 0.72);

  // Mirrored text (da Vinci wrote backwards)
  ctx.save();
  ctx.translate(cx - R * 0.5, cy + R * 0.72);
  ctx.scale(-1, 1);
  ctx.fillText('GAIA SENSORIUM', 0, 0);
  ctx.restore();
}

// =====================
// DRAW SENSE ORGAN
// =====================
function drawOrgan(sense, state, cx, cy, radius) {
  const now = Date.now();
  if (state.alive && state.latency !== null) {
    state.aperture = Math.max(0.15, Math.min(1.0, 1.0 - state.latency / 500));
  } else if (state.alive) {
    state.aperture = 0.7;
  } else {
    state.aperture = 0.0;
  }
  state.apertureSmooth += (state.aperture - state.apertureSmooth) * 0.06;
  const ap = state.apertureSmooth;
  const pulse = Math.sin(now * 0.003 + state.pulsePhase) * 0.04;
  const R = radius * (1.0 + pulse);
  const openR = R * (0.15 + ap * 0.55);

  // f-stop
  let fstop;
  if (!state.alive) fstop = 'f/∞';
  else if (state.latency !== null && state.latency < 5) fstop = 'f/1.4';
  else if (state.latency !== null && state.latency < 20) fstop = 'f/2';
  else if (state.latency !== null && state.latency < 100) fstop = 'f/4';
  else if (state.latency !== null && state.latency < 500) fstop = 'f/8';
  else fstop = 'f/2.8';

  // Glow halo for alive organs
  if (state.alive) {
    const glow = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 1.8);
    glow.addColorStop(0, sense.color + '18');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.8, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.save();

  if (sense.organ === 'EYE') {
    // Eyeball
    ctx.beginPath();
    ctx.ellipse(cx, cy, R, R * 0.7, 0, 0, Math.PI * 2);
    const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    sg.addColorStop(0, state.alive ? '#e8e0d8' : '#555');
    sg.addColorStop(1, state.alive ? '#887878' : '#333');
    ctx.fillStyle = sg;
    ctx.fill();
    // Iris
    const ig = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*0.5);
    ig.addColorStop(0, sense.colorDark);
    ig.addColorStop(0.5, state.alive ? sense.color : '#333');
    ig.addColorStop(1, sense.colorDark);
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = ig;
    ctx.fill();
    drawBlades(cx, cy, openR, R*0.45, 7, now, state.alive);
    ctx.beginPath();
    ctx.arc(cx, cy, openR, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();

  } else if (sense.organ === 'EAR') {
    // Spiral cochlea
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    const eg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    eg.addColorStop(0, state.alive ? sense.color : '#444');
    eg.addColorStop(0.7, state.alive ? sense.colorDark : '#222');
    eg.addColorStop(1, '#111');
    ctx.fillStyle = eg;
    ctx.fill();
    // Spiral
    ctx.beginPath();
    for (let t = 0; t < Math.PI * 3.5; t += 0.08) {
      const sr = openR * 0.2 + (t / (Math.PI * 3.5)) * R * 0.6;
      const sx = cx + Math.cos(t + now * 0.001) * sr;
      const sy = cy + Math.sin(t + now * 0.001) * sr;
      if (t === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.strokeStyle = `rgba(255,255,255,${state.alive ? 0.25 : 0.05})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    drawBlades(cx, cy, openR * 0.4, R * 0.35, 5, now, state.alive);

  } else if (sense.organ === 'NOSE') {
    // Nostrils
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    const ng = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    ng.addColorStop(0, state.alive ? sense.color : '#444');
    ng.addColorStop(1, '#111');
    ctx.fillStyle = ng;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - R*0.18, cy+R*0.05, openR*0.3, openR*0.5, -0.2, 0, Math.PI*2);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + R*0.18, cy+R*0.05, openR*0.3, openR*0.5, 0.2, 0, Math.PI*2);
    ctx.fillStyle = '#000';
    ctx.fill();
    if (state.alive) {
      for (let p = 0; p < 4; p++) {
        const py = cy - R*0.2 - ((now*0.02 + p*15)%(R*0.6));
        const px = cx + Math.sin(py*0.12+p)*R*0.12;
        ctx.beginPath(); ctx.arc(px, py, 1.2, 0, Math.PI*2);
        ctx.fillStyle = `rgba(68,255,170,${0.35-p*0.08})`; ctx.fill();
      }
    }
    drawBlades(cx, cy, openR*0.25, R*0.35, 5, now, state.alive);

  } else if (sense.organ === 'TONGUE') {
    // Organic tongue with papillae
    ctx.beginPath();
    const tw = R*1.2, th = R*0.75;
    ctx.moveTo(cx-tw*0.4,cy-th*0.4);
    ctx.quadraticCurveTo(cx,cy-th*0.55, cx+tw*0.4,cy-th*0.4);
    ctx.quadraticCurveTo(cx+tw*0.5,cy, cx+tw*0.35,cy+th*0.45);
    ctx.quadraticCurveTo(cx,cy+th*0.6, cx-tw*0.35,cy+th*0.45);
    ctx.quadraticCurveTo(cx-tw*0.5,cy, cx-tw*0.4,cy-th*0.4);
    ctx.closePath();
    const tg = ctx.createRadialGradient(cx,cy,0, cx,cy,R);
    tg.addColorStop(0, state.alive ? sense.color : '#444');
    tg.addColorStop(1, state.alive ? sense.colorDark : '#222');
    ctx.fillStyle = tg; ctx.fill();
    ctx.strokeStyle = state.alive ? sense.color+'44' : '#333'; ctx.lineWidth = 0.5; ctx.stroke();
    for (let b = 0; b < 8; b++) {
      const bx = cx + Math.cos(b*1.7)*R*0.4;
      const by = cy + Math.sin(b*2.1)*R*0.3;
      ctx.beginPath(); ctx.arc(bx, by, 1.5+ap*1.5, 0, Math.PI*2);
      ctx.fillStyle = state.alive ? 'rgba(255,255,255,0.15)' : 'rgba(80,80,80,0.08)'; ctx.fill();
    }
    drawBlades(cx, cy, openR*0.3, R*0.35, 6, now, state.alive);

  } else if (sense.organ === 'MOUTH') {
    // Lips
    const gapH = openR * 0.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, R, R*0.6, 0, 0, Math.PI*2);
    ctx.fillStyle = state.alive ? sense.colorDark : '#222'; ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx, cy-gapH*0.25, R*0.8, R*0.4, 0, Math.PI, Math.PI*2);
    ctx.fillStyle = state.alive ? sense.color : '#555'; ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx, cy+gapH*0.25, R*0.8, R*0.35, 0, 0, Math.PI);
    ctx.fillStyle = state.alive ? sense.color : '#555'; ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx, cy, R*0.55, gapH, 0, 0, Math.PI*2);
    ctx.fillStyle = '#000'; ctx.fill();
    drawBlades(cx, cy, openR*0.25, R*0.35, 5, now, state.alive);

  } else if (sense.organ === 'SKIN') {
    // Fingerprint / pressure field
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI*2);
    const skg = ctx.createRadialGradient(cx,cy,0, cx,cy,R);
    skg.addColorStop(0, state.alive ? sense.color : '#555');
    skg.addColorStop(0.7, state.alive ? sense.colorDark : '#333');
    skg.addColorStop(1, '#111');
    ctx.fillStyle = skg; ctx.fill();
    for (let r = 0; r < 5; r++) {
      ctx.beginPath();
      ctx.arc(cx, cy+R*0.08, R*0.2+r*R*0.12, Math.PI*0.2, Math.PI*0.8);
      ctx.strokeStyle = `rgba(255,170,136,${state.alive?0.18:0.04})`; ctx.lineWidth = 1.2; ctx.stroke();
    }
    if (state.alive) {
      const ripR = R*(0.3+((now*0.001)%1)*0.6);
      ctx.beginPath(); ctx.arc(cx,cy,ripR,0,Math.PI*2);
      ctx.strokeStyle = `rgba(255,170,136,${0.25-ripR/R*0.25})`; ctx.lineWidth = 0.8; ctx.stroke();
    }
    drawBlades(cx, cy, openR*0.35, R*0.4, 5, now, state.alive);

  } else if (sense.organ === 'PROPRIO') {
    // Heart shape — pulsing
    const beat = 1.0 + Math.sin(now*0.006)*( state.alive ? 0.08 : 0.02);
    const hr = R * beat;
    ctx.beginPath();
    ctx.moveTo(cx, cy+hr*0.45);
    ctx.bezierCurveTo(cx-hr*0.7,cy-hr*0.05, cx-hr*0.45,cy-hr*0.6, cx,cy-hr*0.25);
    ctx.bezierCurveTo(cx+hr*0.45,cy-hr*0.6, cx+hr*0.7,cy-hr*0.05, cx,cy+hr*0.45);
    ctx.closePath();
    const hg = ctx.createRadialGradient(cx,cy-hr*0.1,0, cx,cy,hr);
    hg.addColorStop(0, state.alive ? sense.color : '#555');
    hg.addColorStop(1, state.alive ? sense.colorDark : '#222');
    ctx.fillStyle = hg; ctx.fill();
    drawBlades(cx, cy-hr*0.05, openR*0.25, hr*0.3, 6, now, state.alive);
  }

  ctx.restore();

  // f-stop + name below
  ctx.font = `${Math.max(6, radius*0.22)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillStyle = state.alive ? sense.color : '#444';
  ctx.fillText(sense.icon + ' ' + sense.name, cx, cy + R + radius*0.35);
  ctx.font = `${Math.max(5, radius*0.16)}px Courier New`;
  ctx.fillStyle = state.alive ? '#8f8' : '#633';
  const lat = state.latency ? state.latency.toFixed(0)+'ms' : '';
  ctx.fillText(`${fstop} ${lat}`, cx, cy + R + radius*0.55);
}

function drawBlades(cx, cy, innerR, outerR, n, now, alive) {
  for (let i = 0; i < n; i++) {
    const a1 = (i/n)*Math.PI*2 + now*0.00001;
    const a2 = ((i+1)/n)*Math.PI*2 + now*0.00001;
    const mid = (a1+a2)/2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a1)*innerR, cy+Math.sin(a1)*innerR);
    ctx.lineTo(cx+Math.cos(mid)*outerR, cy+Math.sin(mid)*outerR);
    ctx.strokeStyle = `rgba(0,0,0,${alive?0.2:0.05})`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
}

// =====================
// MAIN DRAW
// =====================
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const now = Date.now();

  // Figure geometry — centered, max size
  const margin = 60;
  const figR = Math.min(W * 0.42, H * 0.45);
  const figCx = W / 2;
  const figCy = H / 2 + figR * 0.05;

  // Draw the Vitruvian frame
  drawVitruvianFrame(figCx, figCy, figR);

  // Organ size — scaled to figure
  const organR = Math.min(figR * 0.055, 32);

  // Collect positions for ISD lines
  const positions = [];

  // Draw all senses at their body positions
  SENSES.forEach(sense => {
    const pos = bodyPos(sense.body, figCx, figCy, figR);
    const state = senseStates[sense.id];
    drawOrgan(sense, state, pos.x, pos.y, organR);
    positions.push({ x: pos.x, y: pos.y, sense, state });
  });

  // === ISD LINES within same organ ===
  const organs = ['EYE','EAR','NOSE','TONGUE','MOUTH','SKIN','PROPRIO'];
  organs.forEach(organ => {
    const grp = positions.filter(p => p.sense.organ === organ && p.state.alive);
    for (let i = 0; i < grp.length; i++) {
      for (let j = i+1; j < grp.length; j++) {
        const a = grp[i], b = grp[j];
        const isd = (a.state.latency||0) + (b.state.latency||0);
        const alpha = Math.max(0.05, 0.25 - isd * 0.001);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `${ORGAN_META[organ].hue}${Math.round(alpha*255).toString(16).padStart(2,'0')}`;
        ctx.lineWidth = 0.8;
        ctx.setLineDash([3,5]); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  });

  // === NERVE LINES: cross-organ connections (synesthesia/nervous system) ===
  const nervePairs = [
    ['EYE','EAR'], ['EAR','NOSE'], ['NOSE','MOUTH'], ['MOUTH','TONGUE'],
    ['SKIN','PROPRIO'], ['EYE','PROPRIO'], ['SKIN','EAR'],
  ];
  nervePairs.forEach(([oA, oB]) => {
    const pA = positions.filter(p => p.sense.organ === oA && p.state.alive);
    const pB = positions.filter(p => p.sense.organ === oB && p.state.alive);
    if (!pA.length || !pB.length) return;
    // Connect closest pair
    let best = Infinity, ba, bb;
    pA.forEach(a => pB.forEach(b => {
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (d < best) { best = d; ba = a; bb = b; }
    }));
    if (!ba) return;
    ctx.beginPath();
    ctx.moveTo(ba.x, ba.y); ctx.lineTo(bb.x, bb.y);
    ctx.strokeStyle = 'rgba(150,200,100,0.06)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([2,10]); ctx.stroke(); ctx.setLineDash([]);
  });

  // Title
  ctx.font = '12px Courier New';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3f8';
  ctx.fillText(`GAIA VITRUVIAN — ${SENSES.length} SENSES • 7 ORGANS • APERTURE + ISD`, W/2, 16);

  // Alive count
  const totalAlive = SENSES.filter(s => senseStates[s.id].alive).length;
  ctx.textAlign = 'right';
  ctx.font = '10px Courier New';
  ctx.fillStyle = totalAlive > 14 ? '#3f8' : totalAlive > 8 ? '#ff8' : '#f44';
  ctx.fillText(`${totalAlive}/${SENSES.length} ALIVE`, W - 12, 16);

  requestAnimationFrame(draw);
}

// =====================
// PING / CHECK
// =====================
async function checkSenses() {
  for (const sense of SENSES) {
    const state = senseStates[sense.id];
    if (!sense.ping) {
      // Infer from related
      if (sense.id === 'nose-immune') {
        state.alive = senseStates['mouth-http']?.alive || false; state.latency = 2;
      } else if (sense.id === 'tongue-petal') {
        state.alive = senseStates['mouth-http']?.alive || false; state.latency = 3;
      } else if (sense.id === 'mouth-printer') {
        try {
          const r = await fetch('/data/feeler-touch.json');
          if (r.ok) { const d = await r.json(); state.alive = d.printer?.state==='idle'||d.printer?.state==='printing'; state.latency = 8; }
        } catch { state.alive = false; }
      } else if (sense.id === 'skin-ping') {
        state.alive = true; state.latency = 0.3;
      } else if (sense.id === 'proprio-willis') {
        state.alive = senseStates['proprio-heart']?.alive || false; state.latency = 1;
      }
      continue;
    }
    try {
      const start = performance.now();
      const mode = sense.ping.startsWith('/') ? 'same-origin' : 'no-cors';
      await fetch(sense.ping, { mode, signal: AbortSignal.timeout(3000) });
      state.latency = performance.now() - start;
      state.alive = true;
    } catch { state.alive = false; state.latency = null; }
  }

  // HUD
  const hud = document.getElementById('hud');
  let html = '';
  ['EYE','EAR','NOSE','TONGUE','MOUTH','SKIN','PROPRIO'].forEach(o => {
    const m = ORGAN_META[o];
    const grp = SENSES.filter(s => s.organ === o);
    const alive = grp.filter(s => senseStates[s.id].alive).length;
    html += `<span style="color:${m.hue}">${m.emoji}${alive}/${grp.length}</span> `;
  });
  const total = SENSES.filter(s => senseStates[s.id].alive).length;
  html += `<br>${total}/${SENSES.length} senses alive`;
  hud.innerHTML = html;
  setTimeout(checkSenses, 5000);
}

senseStates['eye-traffic'].alive = true;
senseStates['eye-traffic'].latency = 0.1;
senseStates['skin-ping'].alive = true;
senseStates['skin-ping'].latency = 0.3;

draw();
checkSenses();
</script>
