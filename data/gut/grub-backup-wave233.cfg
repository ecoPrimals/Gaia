# GAIA BOOT ENGINE - Wave 233 - OSINT Informed
# THREE paths to surgery, all armed:
# 1. setup_var.efi (standalone, auto-reboot) — needs UEFI Shell
# 2. modGRUBShell + grub.cfg (type 'normal') — 1 word
# 3. Smokeless UMAF (manual browser) — full CBS access
set timeout=5
set default=0

menuentry "Windows Boot Manager (DEFAULT)" {
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "GAIA SURGERY: modGRUBShell (type 'normal' for auto-write)" {
    echo ""
    echo "  modGRUBShell will drop to grub> prompt"
    echo "  Type ONE word: normal"
    echo "  Auto-executes: iGPU=Forces, UMA=512M"
    echo "  Then auto-reboots to Windows"
    echo ""
    chainloader /EFI/tools/modGRUBShell.efi
}

menuentry "GAIA SURGERY: setup_var.efi (standalone)" {
    echo ""
    echo "  Launching setup_var.efi directly..."
    echo "  (may need UEFI Shell for args)"
    echo ""
    chainloader /EFI/gaia/setup_var.efi
}

menuentry "Smokeless UMAF (full AMD CBS browser)" {
    echo ""
    echo "  FULL PRESCRIPTION:"
    echo "  AMD CBS > NBIO > Above 4G Decoding -> ENABLED"
    echo "  AMD CBS > NBIO > Resizable BAR     -> ENABLED"
    echo "  AMD CBS > CPU  > SMT Control        -> AUTO"
    echo "  Boot > Fast Boot                    -> DISABLED"
    echo "  AMD CBS > NBIO > GFX > iGPU        -> Forces"
    echo "  AMD CBS > NBIO > GFX > UMA         -> 512M"
    echo ""
    chainloader /EFI/UMAF/Bootx64.efi
}

menuentry "Reboot" {
    reboot
}
