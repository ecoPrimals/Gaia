# GAIA SPRING NEEDLE ? Wave 233 Reboot #4
# 3 toggles: Turbo Game Mode OFF, ReBAR ON, SVM ON
set timeout=10
set default=0

menuentry ">>> ENTER BIOS (fwsetup) ? SPRING NEEDLE <<<" {
    echo ""
    echo "  ????????????????????????????????????????????????"
    echo "  ?  SPRING NEEDLE ? 3 TOGGLES ONLY:            ?"
    echo "  ?                                              ?"
    echo "  ?  1. Advanced > AMD CBS > NBIO >              ?"
    echo "  ?     Turbo Game Mode ? DISABLED               ?"
    echo "  ?     (unlocks 2nd CCD + SMT = 16C/32T)       ?"
    echo "  ?                                              ?"
    echo "  ?  2. Advanced > PCI Subsystem >               ?"
    echo "  ?     Re-Size BAR Support ? ENABLED            ?"
    echo "  ?     (RTX 5090 full VRAM access)              ?"
    echo "  ?                                              ?"
    echo "  ?  3. Advanced > AMD CBS >                     ?"
    echo "  ?     SVM Mode ? ENABLED                       ?"
    echo "  ?     (AMD virtualization)                     ?"
    echo "  ?                                              ?"
    echo "  ?  F10 ? Save & Exit when done                 ?"
    echo "  ????????????????????????????????????????????????"
    echo ""
    echo "  Entering UEFI Firmware Setup in 3 seconds..."
    sleep 3
    fwsetup
}

menuentry "Windows Boot Manager (skip to Windows)" {
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "Reboot" {
    reboot
}
