<text x="40" y="980" font-family="monospace" font-size="11" fill="#333">SUBTRACTIVE COLOR: C+M=Blue  C+Y=Green  M+Y=Red  C+M+Y=Black(ish)  K=True Black</text>
<text x="40" y="998" font-family="monospace" font-size="11" fill="#333">Print this → scan it back → the DELTA between digital and scan IS the epitope</text>
<text x="40" y="1016" font-family="monospace" font-size="11" fill="#333">EcoTank 502: ~0.3¢/page color, ~0.1¢/page black. This page ≈ 2% coverage = negligible.</text></svg>