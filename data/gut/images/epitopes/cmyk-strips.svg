<text x="408" y="40" font-family="monospace" font-size="18" fill="#000" text-anchor="middle">GAIA CMYK EPITOPE — Minimal Ink Test</text><text x="408" y="58" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">4 channels × 10 densities × 3 line weights = vision theory from first principles</text><text x="40" y="80" font-family="monospace" font-size="14" fill="#333">K — Black (pigment)</text>
<text x="40" y="98" font-family="monospace" font-size="10" fill="#666">Absorbs ALL light. Pigment ink = sharpest text.</text>
