<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056">
<rect width="816" height="1056" fill="white"/>
<text x="408" y="40" font-family="monospace" font-size="18" fill="#000" text-anchor="middle">GAIA COLOR WHEEL — Subtractive Mixing</text>
<circle cx="408" cy="200" r="30" fill="#00FFFF" stroke="#333" stroke-width="1"/>
<text x="408" y="150" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">C</text>
<circle cx="548" cy="238" r="30" fill="#0088FF" stroke="#333" stroke-width="1"/>
<text x="573" y="194" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">C+</text>
<circle cx="650" cy="340" r="30" fill="#0000FF" stroke="#333" stroke-width="1"/>
<text x="694" y="315" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">C+M=Blue</text>
<circle cx="688" cy="480" r="30" fill="#8800FF" stroke="#333" stroke-width="1"/>
<text x="738" y="480" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">M+</text>
<circle cx="650" cy="620" r="30" fill="#FF00FF" stroke="#333" stroke-width="1"/>
<text x="694" y="645" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">M</text>
<circle cx="548" cy="722" r="30" fill="#FF0088" stroke="#333" stroke-width="1"/>
<text x="573" y="766" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">M+</text>
<circle cx="408" cy="760" r="30" fill="#FF0000" stroke="#333" stroke-width="1"/>
<text x="408" y="810" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">M+Y=Red</text>
<circle cx="268" cy="722" r="30" fill="#FF8800" stroke="#333" stroke-width="1"/>
<text x="243" y="766" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">Y+</text>
<circle cx="166" cy="620" r="30" fill="#FFFF00" stroke="#333" stroke-width="1"/>
<text x="122" y="645" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">Y</text>
<circle cx="128" cy="480" r="30" fill="#88FF00" stroke="#333" stroke-width="1"/>
<text x="78" y="480" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">Y+</text>
<circle cx="166" cy="340" r="30" fill="#00FF00" stroke="#333" stroke-width="1"/>
<text x="122" y="315" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">C+Y=Green</text>
<circle cx="268" cy="238" r="30" fill="#00FF88" stroke="#333" stroke-width="1"/>
<text x="243" y="194" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">C+</text>
<circle cx="378" cy="480" r="40" fill="cyan" opacity="0.5"/>
<circle cx="438" cy="480" r="40" fill="magenta" opacity="0.5"/>
<circle cx="408" cy="450" r="40" fill="yellow" opacity="0.5"/>
<circle cx="408" cy="540" r="15" fill="black"/>
<text x="408" y="570" font-family="monospace" font-size="10" fill="#333" text-anchor="middle">K (true black)</text>
<text x="408" y="480" font-family="monospace" font-size="8" fill="#333" text-anchor="middle">CMY overlap</text>
<text x="408" y="820" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">Your EYES use RGB (additive). The PRINTER uses CMYK (subtractive).</text>
<text x="408" y="838" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">Light + Light = brighter. Ink + Ink = darker. This is why printers need K separately.</text>
<text x="408" y="856" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">CMY theoretically makes black, but dye inks make muddy brown → K pigment needed.</text></svg>