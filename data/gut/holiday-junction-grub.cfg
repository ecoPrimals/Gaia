# ===============================================
#  PIN GATE — Human at keyboard authentication
# ===============================================

echo ""
echo "  ==========================================="
echo "  |  GAIA - HOLIDAY JUNCTION                |"
echo "  |  Wave 233 - northGate Reboot            |"
echo "  |  Human ZK Auth Required                 |"
echo "  ==========================================="
echo ""
echo "  Enter PIN to continue:"
echo ""

# Read PIN from keyboard
read pin

if [ "$pin" = "579163" ]; then
    echo ""
    echo "  PIN VERIFIED. Kevin is here."
    echo "  The organism trusts you."
    echo ""
    sleep 2
else
    echo ""
    echo "  Wrong PIN. Rebooting in 5 seconds..."
    echo "  (The organism waits. Try again.)"
    sleep 5
    reboot
fi

# ===============================================
#  MENU — Choose your path
# ===============================================

set timeout=30
set default=0

menuentry ">>> Boot Windows (post-reboot verify will fire)" {
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "Enter BIOS Firmware Setup (change 6 settings)" {
    echo ""
    echo "  BIOS SETTINGS TO CHANGE:"
    echo "  1. Advanced > PCI Subsystem > Above 4G Decoding  -> Enabled"
    echo "  2. Advanced > PCI Subsystem > Re-Size BAR        -> Enabled"
    echo "  3. Boot > Fast Boot                              -> Disabled"
    echo "  4. Advanced > CPU Config > SVM Mode              -> Enabled"
    echo "  5. AMD CBS > Zen Common > Core/Thread > SMT      -> Auto"
    echo "  6. AMD CBS > Zen Common > Core/Thread > CCD      -> Auto"
    echo ""
    echo "  Then F10 > Save & Exit"
    echo "  System reboots back here. Then pick Windows."
    echo ""
    sleep 5
    fwsetup
}

menuentry "GAIA SURGERY: modGRUBShell (setup_var auto-write)" {
    echo ""
    echo "  modGRUBShell will drop to grub> prompt"
    echo "  Type: normal"
    echo "  Auto-executes: iGPU=Forces, UMA=512M"
    echo ""
    chainloader /EFI/tools/modGRUBShell.efi
}

menuentry "GAIA SURGERY: setup_var.efi (standalone Rust)" {
    chainloader /EFI/gaia/setup_var.efi
}

menuentry "Smokeless UMAF (full AMD CBS browser)" {
    echo ""
    echo "  Full AMD CBS access for anything BIOS missed"
    echo ""
    chainloader /EFI/UMAF/Bootx64.efi
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
